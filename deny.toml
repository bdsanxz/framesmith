# Licence gate (run with `cargo deny check licenses`; see scripts/gates.sh).
# The project is offered under GPL-3.0-or-later (LICENSE) and under a commercial licence. So that the
# code can be offered under both, dependencies are limited to the permissive and MPL-2.0 licences
# below, each compatible with GPL-3.0-or-later; no dependency of the GPL family (GPL, AGPL, LGPL) is
# accepted. Anything else, and any unknown or missing licence, is denied.

[graph]
all-features = true
# No `targets` line: every package in Cargo.lock is checked, whatever system it is built for, so that
# a dependency used only on Windows or Linux is not missed when those systems are added.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# Nothing outside the list above is accepted, and a licence cannot be guessed from a loose text match.
confidence-threshold = 0.93
# A licence in the list that no current dependency uses is fine.
unused-allowed-license = "allow"
# Crates used only for tests and tools are crates of the project too, and every crate must pass.
include-dev = true

# Our own workspace crates are unpublished (`publish = false`) and carry no licence field.
# They are skipped because they are private, not because the gate is loosened for anyone else.
[licenses.private]
ignore = true
