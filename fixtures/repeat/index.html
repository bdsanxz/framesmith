<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repeat</title>
<style>
  .ground { position: absolute; inset: 0; background: #14213d; }
  #word { position: absolute; left: 16px; top: 12px; margin: 0; font: 700 28px/1.2 Helvetica, Arial, sans-serif; color: #e5e5e5; }
  #picture { position: absolute; left: 200px; top: 20px; width: 96px; height: 64px; }
  #first { position: absolute; left: 16px; top: 100px; width: 40px; height: 24px; background: #fca311; }
  #second { position: absolute; left: 16px; top: 140px; width: 24px; height: 24px; background: #d62828; }
</style>
</head>
<body>
<div data-fs-composition="repeat" data-fs-size="320x180" data-fs-fps="30" data-fs-duration="2">
  <div class="ground"></div>
  <p id="word" data-fs-clip data-fs-start="0.2" data-fs-duration="1.2">Repeat</p>
  <div data-fs-clip data-fs-start="0.5" data-fs-duration="1"><img id="picture" src="pattern.png" alt=""></div>
  <div id="first"></div>
  <div id="second"></div>
</div>
<script type="application/framesmith-motion+json">
[
  { "target": "#first", "to": { "x": 200 }, "at": 0.3, "duration": 0.9, "ease": "out-cubic" },
  { "target": "#picture", "from": { "scale": 0.8, "rotation": -10 }, "to": { "scale": 1, "rotation": 0 }, "at": 0.5, "duration": 0.5, "ease": "in-out-quad" },
  { "target": "#word", "from": { "opacity": 0.3 }, "at": 0.2, "duration": 0.4 },
  { "target": "#second", "to": { "x": 240, "rotation": 180 }, "at": 1.5, "duration": 1.5 }
]
</script>
</body>
</html>
