<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three clips that follow each other in a circle</title>
<style>
  .box { position: absolute; top: 60px; width: 60px; height: 60px; }
  #base { left: 20px; background: #ff0000; }
  #one { left: 100px; background: #00ff00; }
  #two { left: 180px; background: #0000ff; }
  #three { left: 250px; background: #ffff00; }
</style>
</head>
<body>
<div data-fs-composition="main" data-fs-size="320x180" data-fs-fps="30" data-fs-duration="6">
  <div id="base" class="box" data-fs-clip data-fs-start="0" data-fs-duration="1"></div>
  <div id="one" class="box" data-fs-clip data-fs-start="after:three" data-fs-duration="1"></div>
  <div id="two" class="box" data-fs-clip data-fs-start="after:one" data-fs-duration="1"></div>
  <div id="three" class="box" data-fs-clip data-fs-start="after:two" data-fs-duration="1"></div>
</div>
</body>
</html>
