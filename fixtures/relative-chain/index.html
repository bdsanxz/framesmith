<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chain of relative starts</title>
<style>
  .box { position: absolute; top: 60px; width: 60px; height: 60px; }
  #a { left: 20px; background: #ff0000; }
  #b { left: 100px; background: #00ff00; }
  #c { left: 180px; background: #0000ff; }
</style>
</head>
<body>
<div data-fs-composition="main" data-fs-size="320x180" data-fs-fps="30" data-fs-duration="8">
  <div id="a" class="box" data-fs-clip data-fs-start="1" data-fs-duration="2"></div>
  <div id="b" class="box" data-fs-clip data-fs-start="after:a" data-fs-duration="1.5"></div>
  <div id="c" class="box" data-fs-clip data-fs-start="after:b+0.5" data-fs-duration="1"></div>
</div>
</body>
</html>
