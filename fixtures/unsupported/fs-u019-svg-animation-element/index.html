<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG animation element</title>
</head>
<body>
<div data-fs-composition="main" data-fs-size="320x180" data-fs-fps="30" data-fs-duration="1">
  <svg width="100" height="100" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="20" fill="#3a6ea5">
      <animate attributeName="r" from="10" to="40" dur="1s"></animate>
    </circle>
  </svg>
</div>
</body>
</html>
