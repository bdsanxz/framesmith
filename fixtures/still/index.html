<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still</title>
<style>
  .sheet { position: absolute; inset: 0; background: #20304a; }
  .block { position: absolute; left: 100px; top: 100px; width: 400px; height: 200px; background: #e63946; }
  .disc { position: absolute; left: 800px; top: 360px; width: 240px; height: 240px; border-radius: 50%; background: #2a9d8f; }
  .line { position: absolute; left: 0; top: 0; width: 1280px; height: 2px; background: #ffffff; }
  .word { position: absolute; left: 100px; top: 400px; margin: 0; font: 700 72px Helvetica, Arial, sans-serif; color: #f1faee; }
</style>
</head>
<body>
<div data-fs-composition="still" data-fs-size="1280x720" data-fs-fps="30" data-fs-duration="2">
  <div class="sheet"></div>
  <div class="line"></div>
  <div class="block"></div>
  <div class="disc"></div>
  <p class="word">Still frame</p>
</div>
</body>
</html>
