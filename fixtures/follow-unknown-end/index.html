<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Follow a clip whose end cannot be worked out</title>
<style>
  .box { position: absolute; top: 60px; width: 60px; height: 60px; }
  #base { left: 20px; background: #ff0000; }
  #follower { left: 100px; background: #00ff00; }
</style>
</head>
<body>
<div data-fs-composition="main" data-fs-size="320x180" data-fs-fps="30">
  <div id="base" class="box" data-fs-clip data-fs-start="1"></div>
  <div id="follower" class="box" data-fs-clip data-fs-start="after:base" data-fs-duration="1"></div>
</div>
</body>
</html>
