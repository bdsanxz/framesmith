<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title card</title>
<style>
  .ground { position: absolute; inset: 0; background: #101820; }
  #title { position: absolute; left: 140px; top: 250px; margin: 0; font: 700 96px/1.1 Helvetica, Arial, sans-serif; color: #ffffff; white-space: nowrap; }
  #bar { position: absolute; left: 140px; top: 420px; width: 360px; height: 16px; background: #ff5a36; }
  #tag { position: absolute; left: 140px; top: 480px; width: 200px; height: 60px; background: #3498db; }
  #subtitle { position: absolute; left: 140px; top: 580px; margin: 0; font: 400 40px/1.2 Helvetica, Arial, sans-serif; color: #ffffff; white-space: nowrap; }
  #badge { position: absolute; left: 960px; top: 150px; width: 160px; height: 100px; background: #2ecc71; }
</style>
</head>
<body>
<div data-fs-composition="title-card" data-fs-size="1280x720" data-fs-fps="30" data-fs-duration="4">
  <div class="ground"></div>
  <h1 id="title" data-fs-clip data-fs-start="0.8" data-fs-duration="2.7">Framesmith</h1>
  <div id="bar" data-fs-clip data-fs-start="0.5" data-fs-duration="3"></div>
  <div id="tag"></div>
  <p id="subtitle" data-fs-clip data-fs-start="1.5" data-fs-duration="2">made frame by frame</p>
  <div id="badge"></div>
</div>
<script type="application/framesmith-motion+json">
{ "composition": "title-card",
  "tweens": [
    { "target": "#bar", "from": { "x": 400 }, "at": 0.5, "duration": 0.6, "ease": "out-cubic" },
    { "target": "#title", "from": { "y": 40, "opacity": 0 }, "to": { "y": 0, "opacity": 1 }, "at": 0.8, "duration": 0.6, "ease": "out-quad" },
    { "target": "#badge", "to": { "rotation": 90, "scale": 1.5 }, "at": 1, "duration": 1.5, "ease": "in-out-quad" },
    { "target": "#subtitle", "from": { "x": -30, "opacity": 0 }, "at": 1.5, "duration": 0.5, "ease": "in-out-cubic" },
    { "target": "#tag", "set": { "x": 300 }, "at": 2 },
    { "target": "#tag", "to": { "opacity": 0.5 }, "at": 2.5, "duration": 0.5, "ease": "linear" },
    { "target": "#bar", "to": { "x": 60 }, "at": 3, "duration": 1, "ease": "in-quart" }
  ] }
</script>
</body>
</html>
