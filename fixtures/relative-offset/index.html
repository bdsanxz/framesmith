<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relative start with an offset</title>
<style>
  .box { position: absolute; top: 60px; width: 60px; height: 60px; }
  #intro { left: 20px; background: #ff0000; }
  #later { left: 100px; background: #00ff00; }
  #sooner { left: 180px; background: #0000ff; }
  #spaced { left: 250px; background: #ffff00; }
</style>
</head>
<body>
<div data-fs-composition="main" data-fs-size="320x180" data-fs-fps="30" data-fs-duration="5">
  <div id="intro" class="box" data-fs-clip data-fs-start="1" data-fs-duration="2"></div>
  <div id="later" class="box" data-fs-clip data-fs-start="after:intro+0.5" data-fs-duration="1"></div>
  <div id="sooner" class="box" data-fs-clip data-fs-start="after:intro-0.5" data-fs-duration="1"></div>
  <div id="spaced" class="box" data-fs-clip data-fs-start="after: intro + 1" data-fs-duration="0.5"></div>
</div>
</body>
</html>
