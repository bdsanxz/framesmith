name: CI

# Sprint 25 (T003 / CAP-001): one matrix that builds the full
# workspace and runs the full test suite on macOS, Windows, and
# Linux with identical commands per OS; no OS skips what another
# runs. A red OS fails the run naming the OS and the test.
#
# The live green run is pending the owner push (not pushed here):
# validate the YAML locally before pushing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # End-to-end render tests need a real ffmpeg binary on PATH.
      # Registry builds ship x265 without 10-bit (HDR encodes
      # downgrade to 8-bit), so every OS installs the full
      # package-manager build: Homebrew, apt, and choco.
      - name: Install FFmpeg (macOS)
        if: matrix.label == 'macos'
        run: brew install ffmpeg
          rm ffmpeg.zip
      - name: Install FFmpeg (Windows)
        if: matrix.label == 'windows'
        run: choco install ffmpeg -y
      - name: Install FFmpeg (Linux)
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
          rm ffmpeg.zip
      - name: Build full workspace (${{ matrix.label }})
        run: cargo build --workspace
      - name: Run full test suite (${{ matrix.label }})
        run: cargo test --workspace
