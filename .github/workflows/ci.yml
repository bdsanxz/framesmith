name: CI

# Sprint 25 (T003 / CAP-001): one matrix that builds the full
# workspace and runs the full test suite on macOS, Windows, and
# Linux with identical commands per OS; no OS skips what another
# runs. A red OS fails the run naming the OS and the test.
#
# The live green run is pending the owner push (not pushed here):
# validate the YAML locally before pushing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # End-to-end render tests need a real ffmpeg binary on PATH
      # built exactly like the one framesmith ships (the brew/apt/
      # choco builds encode differently and fail the peak-cap test).
      # Download the registry asset directly (no API rate limit).
      - name: Install FFmpeg (macOS)
        if: matrix.label == 'macos'
        run: |
          curl -fsSL -o ffmpeg.zip "https://github.com/bdsanxz/ffmpeg-registry/releases/latest/download/ffmpeg-osx-arm64.zip"
          unzip -o ffmpeg.zip
          chmod +x ffmpeg ffprobe
          sudo mkdir -p /usr/local/bin
          sudo mv ffmpeg ffprobe /usr/local/bin/
          rm ffmpeg.zip
      - name: Install FFmpeg (Windows)
        if: matrix.label == 'windows'
        run: |
          curl -fsSL -o ffmpeg.zip "https://github.com/bdsanxz/ffmpeg-registry/releases/latest/download/ffmpeg-windows-x64.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath . -Force
          $ffmpeg = (Get-ChildItem -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          echo "$ffmpeg" >> $env:GITHUB_PATH
      - name: Install FFmpeg (Linux)
        if: matrix.label == 'linux'
        run: |
          curl -fsSL -o ffmpeg.zip "https://github.com/bdsanxz/ffmpeg-registry/releases/latest/download/ffmpeg-linux-x64.zip"
          unzip -o ffmpeg.zip
          chmod +x ffmpeg ffprobe
          sudo mv ffmpeg ffprobe /usr/local/bin/
          rm ffmpeg.zip
      - name: Build full workspace (${{ matrix.label }})
        run: cargo build --workspace
      - name: Run full test suite (${{ matrix.label }})
        run: cargo test --workspace
