# The quality gates of Framesmith on a hosted macOS runner: formatting, static analysis, the tests,
# the licence gate and the frx7 pin, each a job of its own so that the run reports each by name.
# Hosted jobs run on `main` and on pull requests only (decision A7); work branches rely on the local
# gates (.githooks/pre-push). Every job runs scripts/gates.sh, the script the local gates run.
# No job installs a browser or FFmpeg: the only installs are the Rust toolchain and cargo-deny.
# frx7 is a private repository: every job that builds (static analysis, tests, licence gate) fetches
# it at the pinned revision with the read-only deploy key kept in the secret FRX7_DEPLOY_KEY
# (scripts/gates/frx7.sh deploy-key, which never prints it). Formatting reads no dependency, and the
# job "frx7 pin" reads git only (all of its history); neither needs the key.
# The behaviour is specified in docs/dev/gates.md.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: 5
  # Cargo fetches with the git program, which honours the rewrite of the frx7 remote to the deploy key.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  formatting:
    name: formatting
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (the one rust-toolchain.toml names)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: formatting
        run: scripts/gates.sh --hosted --gate format

  static-analysis:
    name: static analysis
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (the one rust-toolchain.toml names)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: frx7 (private remote, read-only deploy key)
        env:
          FRX7_DEPLOY_KEY: ${{ secrets.FRX7_DEPLOY_KEY }}
        run: scripts/gates/frx7.sh deploy-key
      - name: static analysis
        run: scripts/gates.sh --hosted --gate lint

  tests:
    name: tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (the one rust-toolchain.toml names)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: frx7 (private remote, read-only deploy key)
        env:
          FRX7_DEPLOY_KEY: ${{ secrets.FRX7_DEPLOY_KEY }}
        run: scripts/gates/frx7.sh deploy-key
      # Tests marked "reference machine only" (hardware encoder, graphics card) and yardstick tests
      # (they start FFmpeg from outside, to compare) are ignored here: the job lists each by name as
      # not run, and never counts one as passed (decision A27).
      - name: tests
        run: scripts/gates.sh --hosted --gate test

  licence-gate:
    name: licence gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (the one rust-toolchain.toml names)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: frx7 (private remote, read-only deploy key)
        env:
          FRX7_DEPLOY_KEY: ${{ secrets.FRX7_DEPLOY_KEY }}
        run: scripts/gates/frx7.sh deploy-key
      - name: cargo-deny 0.20.2 from the cache
        id: deny-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-deny 0.20.2 (built from the crates.io source, at the version the local gates use)
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: licence gate
        run: scripts/gates.sh --hosted --gate licence

  frx7-pin:
    name: frx7 pin
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # The gate reads the whole history for the commits that moved the pin.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: frx7 pin
        run: scripts/gates.sh --hosted --gate pin
