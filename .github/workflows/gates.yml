name: gates

# The four quality gates (formatting, static analysis, tests, licences) on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # macOS on Apple silicon, the target of this sprint.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check the runner is Apple silicon
        run: test "$(uname -m)" = "arm64"

      - name: Install the Rust toolchain (rustfmt, clippy)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked

      # The comparison tool's tests make their test videos with ffmpeg.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Run the four gates
        run: scripts/gates.sh
