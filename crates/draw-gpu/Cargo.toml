[package]
name = "draw-gpu"
description = "The renderer on the graphics card: it draws a display list the way the processor does."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "draw_gpu"
path = "src/lib.rs"

[dependencies]
draw = { workspace = true }
layout = { workspace = true }
gpu = { workspace = true }
vello_cpu = { workspace = true }
# The shadows and the outline of a paragraph are pictures the processor draws and the card places (`docs/spec/card-renderer.md`,
# section 9.9); the card calls the processor's functions for them. No type of the processor is in a public interface of this crate.
draw-cpu = { workspace = true }

[dev-dependencies]
measure = { workspace = true }
# The face of a machine font as the text crate gives it to the renderers (`docs/spec/text.md`, section 2.7).
text = { workspace = true }
