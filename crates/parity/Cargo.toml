[package]
name = "parity"
description = "Development only: runs the reference as a black box and compares its video with ours (container facts, pictures, timing, position). Never a dependency of the product, its build or its tests."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "parity"
path = "src/main.rs"

# The yardstick tests (they start ffmpeg and ffprobe, or the reference, from outside) are run by the
# runner of `measure::yardstick`, not by the Rust test harness: docs/dev/gates.md, section 5.
[[test]]
name = "yardstick_video_reading"
harness = false

[[test]]
name = "yardstick_pixelmatch_counts"
harness = false

[[test]]
name = "yardstick_clip_timing"
harness = false

[[test]]
name = "yardstick_reference_version"
harness = false

[dependencies]
measure = { workspace = true }
serde_json = { workspace = true }
