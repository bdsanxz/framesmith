[package]
name = "text"
description = "Paragraphs of text: the fonts a composition declares, shaping, line breaking and the glyphs of a line."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The dictionary segmenters of the engine (docs/spec/text.md, section 12.3): Thai and Japanese text breaks at word
# boundaries. The feature adds no crate to the lock file.
parley = { workspace = true, features = ["complex-scripts"] }
# frx7 reads the PNG pictures of the emoji from memory and scales them (docs/spec/text.md, section 12.4). The picture
# decoding stays in frx7; no type of frx7 is in a public interface of this crate.
base = { workspace = true }
codec = { workspace = true }
backend-os = { workspace = true }
pixel = { workspace = true }
# The font reader that judges a declared font file (docs/spec/text.md, section 2.1; decision B28): a file it refuses is
# damaged, and its reason is reported. The version is the one the shaping engine already brings.
read-fonts = { version = "=0.41.0", default-features = false, features = ["std"] }
tracing = { workspace = true }
