[package]
name = "text"
description = "Paragraphs of text: the fonts a composition declares, shaping, line breaking and the glyphs of a line."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The dictionary segmenters of the engine (docs/spec/text.md, section 12.3): Thai and Japanese text breaks at word
# boundaries. The feature adds no crate to the lock file.
parley = { workspace = true, features = ["complex-scripts"] }
