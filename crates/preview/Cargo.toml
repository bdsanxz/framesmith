[package]
name = "preview"
version = "0.1.0"
edition = "2021"
description = "Framesmith preview frame service (Sprint 14): on-demand exact frames with an outside-project cache"
license = "MIT OR Apache-2.0"

[dependencies]
ffmpeg = { path = "../ffmpeg" }
glyph = { path = "../glyph" }
layout = { path = "../layout" }
motion = { path = "../motion" }
notation = { path = "../notation" }
validate = { path = "../validate" }
render = { path = "../render" }
sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
