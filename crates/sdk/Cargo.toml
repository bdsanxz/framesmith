[package]
name = "sdk"
version = "0.1.0"
edition = "2021"
description = "Framesmith headless edit-SDK open (Sprint 15): validated open with persist, preview, overrides, history, and coalesce options, never rendering"
license = "MIT OR Apache-2.0"

[dependencies]
notation = { path = "../notation" }
validate = { path = "../validate" }
motion = { path = "../motion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
preview = { path = "../preview" }
