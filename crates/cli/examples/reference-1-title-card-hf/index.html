<!doctype html>
<!-- HyperFrames equivalent of Framesmith reference-1-title-card
     (framesmith/crates/cli/examples/reference-1-title-card/composition.kdl):
     10 s, 1920x1080, 30 fps title card: card image + accent bar + two text
     lines + bed audio, with entrance motion [0,1]/[0.3,1.3] and exit fades
     [9,10]. Mapping notes:
     - KDL `x from -800` on an element placed at left L becomes a GSAP x
       transform from (-800 - L) to 0 (GSAP x is an offset; no CSS transform
       is authored on animated elements).
     - KDL volume=-12 dB becomes data-volume 0.25 (10^(-12/20)).
     - KDL out-cubic -> power3.out, linear -> none.
     - Font Arial resolves via the bundled alias map (Arial -> Inter). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101828;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #101828;
      }
      .clip {
        position: absolute;
      }
      #card {
        left: 940px;
        top: 270px;
        width: 860px;
        height: 540px;
        object-fit: contain;
        z-index: 0;
      }
      #accent {
        left: 120px;
        top: 500px;
        width: 120px;
        height: 12px;
        background: #2a9d8f;
        z-index: 1;
      }
      #title {
        left: 120px;
        top: 540px;
        font-family: Arial, sans-serif;
        font-size: 150px;
        line-height: 1;
        white-space: nowrap;
        color: #ffffff;
        z-index: 2;
      }
      #subtitle {
        left: 120px;
        top: 730px;
        font-family: Arial, sans-serif;
        font-size: 56px;
        line-height: 1;
        white-space: nowrap;
        color: #ffd166;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <img
        id="card"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        src="assets/card.png"
        alt="card art"
      />
      <div id="accent" class="clip" data-start="0" data-duration="10" data-track-index="1"></div>
      <div id="title" class="clip" data-start="0" data-duration="10" data-track-index="2">Framesmith</div>
      <div id="subtitle" class="clip" data-start="0" data-duration="10" data-track-index="3">v1 proof title card</div>
      <audio
        id="bed"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="4"
        src="assets/bed.wav"
        data-volume="0.25"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { x: -920, opacity: 0, duration: 1, ease: "power3.out" }, 0);
      tl.from("#card", { scale: 0.6, duration: 1, ease: "power3.out" }, 0);
      tl.from("#subtitle", { opacity: 0, duration: 1, ease: "power3.out" }, 0.3);
      tl.to("#card", { opacity: 0, duration: 1, ease: "none" }, 9);
      tl.to("#title", { opacity: 0, duration: 1, ease: "none" }, 9);
      tl.to("#subtitle", { opacity: 0, duration: 1, ease: "none" }, 9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
