<!doctype html>
<!-- HyperFrames equivalent of Framesmith reference-2-lower-third
     (framesmith/crates/cli/examples/reference-2-lower-third/composition.kdl):
     8 s, 1920x1080, 30 fps animated lower-third over bg video with sound:
     panel + accent bar + two text lines + sting audio, slide-in entrance
     [0.5,1.5]/[0.8,1.8] and slide/fade exit [7,8]. Mapping notes:
     - KDL `x from/to -800` on an element placed at left L becomes a GSAP x
       transform from/to (-800 - L) (GSAP x is an offset; no CSS transform
       is authored on animated elements).
     - bg.mp4 carries an audio track, so it keeps sound
       (data-has-audio="true", not muted).
     - KDL volume=-18 dB becomes data-volume 0.13 (10^(-18/20)); fade-in/out
       become data-fade-in/data-fade-out.
     - KDL out-cubic -> power3.out, in-cubic -> power3.in, linear -> none.
     - Font Arial resolves via the bundled alias map (Arial -> Inter). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000000;
      }
      .clip {
        position: absolute;
      }
      #bg {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        z-index: 0;
      }
      #panel {
        left: 120px;
        top: 780px;
        width: 760px;
        height: 200px;
        background: #101828;
        opacity: 0.9;
        z-index: 1;
      }
      #bar {
        left: 120px;
        top: 780px;
        width: 16px;
        height: 200px;
        background: #e63946;
        z-index: 2;
      }
      #name {
        left: 170px;
        top: 800px;
        font-family: Arial, sans-serif;
        font-size: 72px;
        line-height: 1;
        white-space: nowrap;
        color: #ffffff;
        z-index: 3;
      }
      #role {
        left: 170px;
        top: 890px;
        font-family: Arial, sans-serif;
        font-size: 40px;
        line-height: 1;
        white-space: nowrap;
        color: #ffd166;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <video
        id="bg"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        src="assets/bg.mp4"
        data-has-audio="true"
        playsinline
      ></video>
      <div id="panel" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>
      <div id="bar" class="clip" data-start="0" data-duration="8" data-track-index="2"></div>
      <div id="name" class="clip" data-start="0.5" data-duration="7" data-track-index="3">Ada Lovelace</div>
      <div id="role" class="clip" data-start="0.5" data-duration="7" data-track-index="4">First programmer, Analytical Engine</div>
      <audio
        id="sting"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="5"
        src="assets/sting.wav"
        data-volume="0.13"
        data-fade-in="1"
        data-fade-out="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#panel", { x: -920, duration: 1, ease: "power3.out" }, 0.5);
      tl.from("#bar", { x: -920, duration: 1, ease: "power3.out" }, 0.5);
      tl.from("#name", { x: -1070, duration: 1, ease: "power3.out" }, 0.5);
      tl.from("#role", { opacity: 0, duration: 1, ease: "power3.out" }, 0.8);
      tl.to("#panel", { x: -920, duration: 1, ease: "power3.in" }, 7);
      tl.to("#bar", { x: -920, duration: 1, ease: "power3.in" }, 7);
      tl.to("#name", { opacity: 0, duration: 1, ease: "none" }, 7);
      tl.to("#role", { opacity: 0, duration: 1, ease: "none" }, 7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
