<!-- hyperframes-registry-item: hw-scribble-transition -->
<!--
  GUIDE: compositions/hw-scribble-transition.html (composition id "hw-scribble-transition")
  WHAT: A 2.2-second overlay transition. Seven fat warm zigzag bands scribble across the frame, staggered
    and alternating in direction, until a solid warm backstop covers the whole frame (fully covered from about 0.92 to 1.42 s).
    The host cuts underneath at that moment; then the bands scribble off the other way and the frame is
    clear. In sketchbook-family index.html it runs from 10.4 to 12.6 s, so the cut from the full-frame clip
    to the framed layout sits at 11.5 s.
  STRUCTURE: back to front: #hw-st-svg (seven band paths, #hw-st-band-0 to #hw-st-band-6, added by the
    script, each stroked about 85 percent of its band height), then #hw-st-solid (the full-frame backstop
    div). Timeline "hw-scribble-transition": the bands draw on from 0 s, each 0.04 s after the previous one,
    over 0.55 s; the backstop fades in at 0.8 s over 0.12 s (opaque from 0.92 s); the backstop fades out at 1.42 s over 0.15 s
    while the bands draw off from 1.42 s, each 0.035 s after the previous, over 0.5 s (done by about 2.13 s); #hw-st-root is hidden at 2.17 s.
  CUSTOMIZE: CONFIG.color sets the band and backstop color (null uses the accent #ffb020 on #hw-st-root).
    CONFIG.bands sets how many horizontal bands there are (7). CONFIG.strokeScale multiplies the band
    thickness (1.0). CONFIG.seed changes the wobble. The timing is fixed in the script, and DUR = 2.2
    must match data-duration on #hw-st-root and on the host slot. To move the cut, change the host's
    data-start so the cut lands inside the solid window (0.92 to 1.42 s of this block's own time). index.html cuts 1.1 s after the wipe starts.
  MEDIA: No media file is bundled, and none is needed. The transition is SVG paths and a solid fill, so it needs no fonts, images or video. gsap
    3.14.2 is loaded from the jsDelivr CDN.
  WHEN TO USE: a hand-drawn cut between two scenes, where a marker scribble covers the frame and then
    clears. The solid backstop is what hides a hard cut underneath it. Use a plain cut or a fade for a
    calmer film.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Reset: zero margins and padding, border-box sizing everywhere. */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* The page is transparent, so the transition covers only what the host shows beneath it. */
      body {
        background: transparent;
        overflow: hidden;
      }
      /* The stage: a 1920 by 1080 transparent box that holds the accent token. */
      #hw-st-root {
        /* Warm marker accent, consistent with the rest of the hw family.
           Override per use via CONFIG.color. */
        --hw-accent: #ffb020;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      /* The band SVG covers the whole stage. */
      #hw-st-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Band paths: open strokes in the accent color, with round caps and joins. */
      #hw-st-svg path {
        fill: none;
        stroke: var(--hw-accent);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* solid backstop that guarantees full coverage at the midpoint */
      #hw-st-solid {
        position: absolute;
        inset: 0;
        background: var(--hw-accent);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- The root holds the band SVG, the solid backstop and the clip driver. -->
    <div
      id="hw-st-root"
      data-composition-id="hw-scribble-transition"
      data-start="0"
      data-duration="2.2"
      data-width="1920"
      data-height="1080"
    >
      <!-- The bands are added inside this SVG by the script. -->
      <svg id="hw-st-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
      <!-- Full-frame backstop: the timeline fades it in under the scribble so the frame is covered at the cut. -->
      <div id="hw-st-solid"></div>
      <div
        id="hw-st-drv"
        class="clip"
        data-start="0"
        data-duration="2.2"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters ----
           Overlay-transition (the mk-clone-wall model): fat scribble strokes
           sweep across and cover the frame, a solid backstop guarantees full
           coverage at the midpoint (the host hard-cuts beneath, ~0.9-1.4s
           local), then everything clears. Place spanning the host's cut. */
        var CONFIG = {
          color: null, // css color; null = --hw-accent (warm marker)
          bands: 7, // horizontal scribble bands
          strokeScale: 1.0,
          seed: 17,
        };

        /* Canvas constants: the 1920 by 1080 frame and the 2.2 s length. */
        var W = 1920,
          H = 1080,
          DUR = 2.2;

        /* Seeded hash: a stable pseudo random value from -1 to 1 for an index. */
        window.hwHash = function (n, seed) {
          var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        };

        /* Color setup: a CONFIG color overrides the accent on the root. */
        var root = document.getElementById("hw-st-root");
        if (CONFIG.color) root.style.setProperty("--hw-accent", CONFIG.color);
        var NS = "http://www.w3.org/2000/svg";
        var svg = document.getElementById("hw-st-svg");

        /* fat zigzag bands, each covering a horizontal slice edge-to-edge */
        var bandH = H / CONFIG.bands;
        var paths = [];
        for (var b = 0; b < CONFIG.bands; b++) {
          var y0 = b * bandH + bandH / 2;
          var d = "M -80 " + (y0 + window.hwHash(b * 17, CONFIG.seed) * 20).toFixed(1);
          var zigs = 7;
          for (var i = 1; i <= zigs; i++) {
            var x = (W + 160) * (i / zigs) - 80;
            var y =
              y0 + (i % 2 ? -1 : 1) * bandH * 0.32 + window.hwHash(b * 17 + i, CONFIG.seed) * 16;
            d += " L " + x.toFixed(1) + " " + y.toFixed(1);
          }
          var p = document.createElementNS(NS, "path");
          p.setAttribute("d", d);
          p.setAttribute("stroke-width", Math.ceil(bandH * 0.85 * CONFIG.strokeScale));
          p.setAttribute("id", "hw-st-band-" + b);
          svg.appendChild(p);
          paths.push(p);
        }

        /* Timeline: paused, so the host seeks it; the scribble-on, backstop and clear phases follow. */
        var tl = gsap.timeline({ paused: true });

        /* 0-0.85: bands scribble on (staggered, alternating direction) */
        paths.forEach(function (p, i) {
          var len = p.getTotalLength();
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: i % 2 ? -len : len });
          tl.to(p, { strokeDashoffset: 0, duration: 0.55, ease: "power2.in" }, 0.04 * i);
        });
        /* 0.8: solid backstop fades in beneath the finished scribble, reaching full
           opacity at 0.92 and holding to 1.42 (the host's cut falls inside this window) */
        tl.to("#hw-st-solid", { opacity: 1, duration: 0.12, ease: "none" }, 0.8);

        /* 1.42 onward: clear. The backstop fades out and the bands scribble off the other way, done by about 2.13 */
        tl.to("#hw-st-solid", { opacity: 0, duration: 0.15, ease: "none" }, 1.42);
        paths.forEach(function (p, i) {
          var len = p.getTotalLength();
          tl.to(
            p,
            { strokeDashoffset: i % 2 ? len : -len, duration: 0.5, ease: "power2.out" },
            1.42 + 0.035 * i,
          );
        });

        /* hard kill the moment the last band clears (learning: kill roots
           when the final fade completes, not at DUR) */
        tl.set(root, { visibility: "hidden" }, 2.17);

        window.__timelines["hw-scribble-transition"] = tl;
      })();
    </script>
  </body>
</html>
