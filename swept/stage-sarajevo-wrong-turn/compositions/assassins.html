<!doctype html>
<!--
  GUIDE: compositions/assassins.html (composition id "assassins")
  WHAT: Mounted at 12.56 s for 2.5 s, on the narration line "Along his route wait six young
    assassins". An empty orange card lands with a turn at 12.58 s; the big "6" is stamped on at
    13.43 s, as the word "six" is spoken; the label "YOUNG ASSASSINS" types on from 13.61 s. A trial
    photo slides in from the right at 12.86 s, blurred and then sharp, and three black bars strike
    across the eyes of the accused at 13.91 s, 14.01 s and 14.11 s.
  STRUCTURE: Back to front: two grey torn scraps (.as-scrap), the #as-print group (the trial photo
    image, three .as-bar redaction bars with ids as-bar-1 to 3, and two .as-tape strips), and the
    #as-card group (#as-card-bg, the number #as-num, and the #as-label strip with #as-label-text).
    All sit in #as-cam. Timeline (local seconds from the 12.56 s start): the card at 0.02 s over
    0.18 s; the number at 0.87 s over 0.12 s; the label typing at 1.05 s (26 per second); the print
    slide x 1250 to 0 and rotation 8 to 2.5 over 0.38 s from 0.3 s, with its image blur 18 px to 0;
    the bars scaleX 0 to 1, staggered by 0.1 s from 1.35 s; the camera scales 1 to 1.04 over 2.5 s.
  CUSTOMIZE: The count: the text of #as-num ("6"). Label: the text of #as-label-text. Colours: card
    #e8702a, number ink #333411, label strip #f6f4ec with ink #21241a, bars #111111 with accent ends
    #e8702a, the ground #e4ddc6, scraps #a79684 and #dbd7cb. Positions: #as-card at 190,300 px
    (430x420); #as-print at 700,250 px (1060x578). Bar positions are in the print's own pixels:
    (80,168), (384,190) and (752,140), each 150 px wide, so they must be moved if the photo is
    re-cropped. Timings are local seconds in the script. A different count needs the label and the
    number to change together, and the number's stamp time to match the spoken word.
  MEDIA: No media file is bundled in this file, so it loads nothing from disk. It has one photo slot
    and two font faces.
    Photo, #as-print img (the trial photo inside #as-print, data-media "assets/generated/trial.png"):
    it showed a crop of a public domain Wikimedia Commons photo of the 1914 trial, cut out and given a
    paper border by paper-cutout.py (the crop is made by make-footage.sh). It was used as a whole
    print, since the accused do not cut out cleanly from a crowd. Now it shows a faint hatch with the
    label "PHOTO: assets/generated/trial.png" on the taped print. To plug in, set the img's src to
    "assets/generated/trial.png", or to any group photo at 1060 by 578 px; the three bars are placed
    for this picture, so move them (see CUSTOMIZE) if you change it.
    Font Anton, #as-num (the big count): it was assets/fonts/anton-latin.woff2. Now the @font-face
    uses local("Anton") only, so the installed face shows, or else the sans-serif fallback. To plug in,
    make the Anton src: local("Anton"), url("assets/fonts/anton-latin.woff2") format("woff2").
    Font Special Elite, #as-label-text (the label): the same, with
    assets/fonts/special-elite-latin.woff2 as the second source, falling back to monospace.
    Sound: none, this file plays no sound. CSS image: none; the card, the scraps and the tape are plain
    colour, and the bars are CSS boxes.
  WHEN TO USE: A "how many" beat, where a large number and a label are the point and a group photo
    is evidence, with redaction bars to suggest anonymity. Pick a plainer caption when the number is
    not the point, or when the people in the photo should be shown clearly.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Fonts: Anton for the number, Special Elite for the label. */
        @font-face { font-family: "Anton"; font-style: normal; font-weight: 400; font-display: block; src: local("Anton"); }
        @font-face { font-family: "Special Elite"; font-style: normal; font-weight: 400; font-display: block; src: local("Special Elite"); }
        /* The frame: the khaki paper ground, clipped to the stage. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #e4ddc6; }
        /* The camera wrapper: the card, the print and the scraps move together from one point. */
        #as-cam { position: absolute; inset: 0; transform-origin: 900px 520px; }
        /* Torn paper: the SVG turbulence filter displaces the edge of any piece marked .as-torn. */
        .as-torn { filter: url(#as-tear); }
        /* Scrap: a plain paper piece, positioned inline in the markup. */
        .as-scrap { position: absolute; }
        /* The number card: torn orange paper, a big number, a typed label strip. */
        #as-card { position: absolute; left: 190px; top: 300px; width: 430px; height: 420px; transform: rotate(-3deg); }
        #as-card-bg { position: absolute; inset: 0; background: #e8702a; box-shadow: 0 10px 16px rgba(34, 40, 11, 0.3); }
        #as-num { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 240px; line-height: 1.15; color: #333411; }
        /* The label strip: a pale bar at the foot of the card that holds the typed label. */
        #as-label { position: absolute; left: 40px; right: 40px; bottom: 34px; height: 54px; background: #f6f4ec; text-align: center; }
        #as-label-text { font-family: "Special Elite", monospace; font-size: 34px; line-height: 54px; color: #21241a; white-space: nowrap; }
        /* The trial photo as a whole print (a crowd does not cut out cleanly), taped down. */
        #as-print { position: absolute; left: 700px; top: 250px; width: 1060px; height: 578px; transform: rotate(2.5deg); filter: drop-shadow(10px 14px 12px rgba(29, 34, 12, 0.38)); }
        #as-print img { position: absolute; inset: 0; width: 100%; height: 100%; }
        .as-tape { position: absolute; width: 140px; height: 40px; background: rgba(234, 229, 209, 0.85); }
        /* Redaction bars over the eyes, with accent marker ends. */
        .as-bar { position: absolute; height: 34px; background: #111111; transform-origin: 0 50%; }
        .as-bar::after { content: ""; position: absolute; right: -18px; top: 6px; width: 26px; height: 22px; background: #e8702a; transform: skewX(-20deg); }
      </style>
      <div id="root" data-composition-id="assassins" data-width="1920" data-height="1080">
        <!-- The torn-edge filter used by the paper pieces. -->
        <svg width="0" height="0" style="position:absolute">
          <filter id="as-tear"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" /><feDisplacementMap in="SourceGraphic" scale="12" /></filter>
        </svg>
        <div id="as-cam" data-layout-allow-overflow>
          <!-- Two grey paper scraps lying under the print and the card, for depth. -->
          <div class="as-scrap as-torn" style="left: 1450px; top: 760px; width: 380px; height: 240px; background: #a79684; transform: rotate(6deg)"></div>
          <div class="as-scrap as-torn" style="left: 90px; top: 820px; width: 520px; height: 180px; background: #dbd7cb; transform: rotate(-2deg)"></div>
          <!-- The trial photo as a taped print, with the three redaction bars on top of it. -->
          <div id="as-print" data-layout-allow-overflow>
            <img src="data:image/svg+xml,%3C!--trial.png--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'687' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/trial.png%3C/text%3E%3C/svg%3E" data-media="assets/generated/trial.png" alt="" />
            <div class="as-bar" id="as-bar-1" style="left: 80px; top: 168px; width: 150px"></div>
            <div class="as-bar" id="as-bar-2" style="left: 384px; top: 190px; width: 150px"></div>
            <div class="as-bar" id="as-bar-3" style="left: 752px; top: 140px; width: 150px"></div>
            <div class="as-tape" style="left: -40px; top: -16px; transform: rotate(-35deg)"></div>
            <div class="as-tape" style="right: -40px; top: -16px; transform: rotate(35deg)"></div>
          </div>
          <!-- The number card: the orange paper, the big number, and the label strip. -->
          <div id="as-card">
            <div id="as-card-bg" class="as-torn"></div>
            <div id="as-num">6</div>
            <div id="as-label"><span id="as-label-text">YOUNG ASSASSINS</span></div>
          </div>
        </div>
      </div>
      <script>
        /* Setup: this scene's paused timeline. */
        const tl = gsap.timeline({ paused: true });
        /* Helper: types a text element one character at a time, from a start time and a rate. */
        function typeOn(sel, t, cps) {
          const el = document.querySelector(sel);
          const text = el.textContent;
          el.textContent = "";
          [...text].forEach((ch, i) => {
            const s = document.createElement("span");
            s.textContent = ch;
            s.style.display = "none";
            el.appendChild(s);
            tl.set(s, { display: "inline" }, t + i / cps);
          });
        }
        // The empty card lands first; the number is stamped on "six" (13.43 s); the label types after.
        tl.fromTo("#as-card", { scale: 1.3, rotation: -9, opacity: 0 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.18, ease: "power4.out" }, 0.02);
        tl.fromTo("#as-num", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "power3.out" }, 0.87);
        typeOn("#as-label-text", 1.05, 26);
        // The print slides in from the right with motion blur; the bars strike through the eyes one by one.
        tl.fromTo("#as-print", { x: 1250, rotation: 8 }, { x: 0, rotation: 2.5, duration: 0.38, ease: "power3.out" }, 0.3);
        tl.fromTo("#as-print img", { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.38, ease: "power2.out" }, 0.3);
        tl.fromTo(".as-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power2.out", stagger: 0.1 }, 1.35);
        // The whole frame drifts in slowly for the length of the shot (the camera scale).
        tl.fromTo("#as-cam", { scale: 1 }, { scale: 1.04, duration: 2.5, ease: "sine.inOut" }, 0);
        /* Registration: the host finds this timeline by the composition id "assassins". */
        window.__timelines["assassins"] = tl;
      </script>
    </template>
  </body>
</html>
