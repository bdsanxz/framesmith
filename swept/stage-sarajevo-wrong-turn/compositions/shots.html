<!doctype html>
<!--
  GUIDE: compositions/shots.html (composition id "shots")
  WHAT: The last 3.66 s of the film, mounted at 23.84 s, on "He fires twice". A pistol cut-out
    slides in from the right at 23.84 s and settles at a slight tilt. A "2" card with the label
    SHOTS lands at 24.29 s, and the label types on from 24.59 s. Two orange muzzle bursts flash at
    the muzzle on the two shots (24.95 s and 25.35 s), the frame kicks sideways on the first, and
    the second shot whites out the frame. Then the picture cuts to a black that holds to the end.
  STRUCTURE: Back to front: two dark bands (.sh-band), #sh-gun (the pistol image in a wrapper with a
    drop shadow), two SVG bursts #sh-burst-1 and #sh-burst-2 (orange star with a paper-white
    centre), the card #sh-card (#sh-card-bg, #sh-num, #sh-label with #sh-label-text). All of these
    except the overlays sit in #sh-cam. Over that are #sh-black (solid black) and #sh-flash (a white
    radial gradient). Timeline (local seconds from 23.84 s): the pistol x 1300 to 0 and rotation 4
    to -4 over 0.38 s; the card at 0.45 s over 0.18 s; the number at 0.55 s; SHOTS typing at 0.75 s
    (20 per second); the bursts at 1.11 s and 1.51 s; the camera kick at 1.11 s (three steps over
    0.17 s); the flash at 1.51 s (white up over 0.03 s, held 0.08 s, falling away over 0.3 s);
    #sh-black fades in at 1.56 s; #sh-cam is hidden at 1.6 s, so the black holds on its own.
  CUSTOMIZE: The count: the text of #sh-num ("2"). Label: #sh-label-text (SHOTS). Colours: ground
    #e4ddc6, bands #303228, card #e8702a, number ink #333411, label strip #f6f4ec, bursts #e8702a
    with #fffefb centres, flash gradient #ffffff to #dcd9d0, final black #000000. Positions: #sh-gun
    at 250,230 px (1000x669); #sh-card at 1380,300 px. The shot times are local seconds in the
    script; they match the shot clips in index.html (starts at 24.88 and 25.28 s, each with a peak
    0.07 s in, so the hits land at 1.11 and 1.51 s here). Move the two together. The black hold is
    set by the index.html host's end time, not here.
  MEDIA: No media file is bundled in this file, so it loads nothing from disk. Photo, #sh-gun img (the
    pistol inside #sh-gun, data-media "assets/generated/pistol.png"): it showed a paper-sticker cut-out
    of a pistol, from a CC BY 2.0 Wikimedia Commons photo, cut out by cutout.py and paper-cutout.py. Now
    it shows a faint hatch with the label "PHOTO: assets/generated/pistol.png" on the same ground, and
    the bursts, the flash and the count still teach the beat. To plug in, set its src to
    "assets/generated/pistol.png", or to any pistol cut-out at 1000 by 669 px with a paper border.
    Font Anton, #sh-num (the count): it was assets/fonts/anton-latin.woff2. Now the @font-face uses
    local("Anton") only, so the installed face shows, or else the sans-serif fallback. To plug in, make
    the Anton src: local("Anton"), url("assets/fonts/anton-latin.woff2") format("woff2").
    Font Special Elite, #sh-label-text (the label): the same, with
    assets/fonts/special-elite-latin.woff2 as the second source, falling back to monospace.
    Sound: none in this file. The two gunshots are the sfx-shot-1 and sfx-shot-2 slots in index.html,
    described in its MEDIA note. CSS image: none; the bands, card, flash and black are colour or
    gradient.
  WHEN TO USE: A climax beat where a count and two hits end a scene, with a flash and silence to
    close. Pick a softer end when the film's last beat should not be a violent event, or when the
    sound should carry the close on its own.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Fonts: Anton for the count, Special Elite for the label. */
        @font-face { font-family: "Anton"; font-style: normal; font-weight: 400; font-display: block; src: local("Anton"); }
        @font-face { font-family: "Special Elite"; font-style: normal; font-weight: 400; font-display: block; src: local("Special Elite"); }
        /* The frame: the khaki paper ground, clipped to the stage. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #e4ddc6; }
        /* The camera wrapper: the bands, pistol, bursts and card move together for the kick and hide at the end. */
        #sh-cam { position: absolute; inset: 0; }
        /* Dark bands across the frame, each placed by its inline top and height. */
        .sh-band { position: absolute; left: -40px; right: -40px; background: #303228; }
        /* Torn paper: the SVG turbulence filter displaces the edge of any piece marked .sh-torn. */
        .sh-torn { filter: url(#sh-tear); }
        #sh-gun { position: absolute; left: 250px; top: 230px; width: 1000px; height: 669px; transform: rotate(-4deg); filter: drop-shadow(10px 14px 12px rgba(29, 34, 12, 0.4)); }
        #sh-gun img { position: absolute; inset: 0; width: 100%; height: 100%; }
        /* Muzzle bursts: a comic star at the muzzle, accent outside, paper-white inside. */
        .sh-burst { position: absolute; left: 150px; top: 250px; width: 220px; height: 220px; }
        /* The count card: an orange torn card with the big number and the label strip. */
        #sh-card { position: absolute; left: 1380px; top: 300px; width: 360px; height: 380px; transform: rotate(3deg); }
        #sh-card-bg { position: absolute; inset: 0; background: #e8702a; box-shadow: 0 10px 16px rgba(34, 40, 11, 0.3); }
        #sh-num { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 220px; line-height: 1.15; color: #333411; }
        #sh-label { position: absolute; left: 50px; right: 50px; bottom: 30px; height: 52px; background: #f6f4ec; text-align: center; }
        #sh-label-text { font-family: "Special Elite", monospace; font-size: 34px; line-height: 52px; color: #21241a; }
        /* The flash goes white, then cuts to a black that holds in silence. */
        #sh-black { position: absolute; inset: 0; background: #000000; }
        #sh-flash { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #ffffff 40%, #dcd9d0 100%); }
      </style>
      <div id="root" data-composition-id="shots" data-width="1920" data-height="1080">
        <!-- The torn-edge filter used by the card. -->
        <svg width="0" height="0" style="position:absolute">
          <filter id="sh-tear"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="6" /><feDisplacementMap in="SourceGraphic" scale="12" /></filter>
        </svg>
        <div id="sh-cam" data-layout-allow-overflow>
          <!-- The two bands, the pistol cut-out, the two muzzle bursts, and the count card. -->
          <div class="sh-band" style="top: 40px; height: 34px"></div>
          <div class="sh-band" style="top: 96px; height: 14px"></div>
          <div id="sh-gun" data-layout-allow-overflow><img src="data:image/svg+xml,%3C!--pistol.png--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'706' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/pistol.png%3C/text%3E%3C/svg%3E" data-media="assets/generated/pistol.png" alt="" /></div>
          <svg class="sh-burst" id="sh-burst-1" viewBox="-50 -50 100 100"><polygon points="0,-48 9,-18 34,-36 20,-8 48,-6 20,8 36,32 8,18 0,48 -8,18 -36,32 -20,8 -48,-6 -20,-8 -34,-36 -9,-18" fill="#e8702a" /><polygon points="0,-26 5,-10 18,-18 10,-3 26,-2 10,5 18,17 4,10 0,26 -4,10 -18,17 -10,5 -26,-2 -10,-3 -18,-18 -5,-10" fill="#fffefb" /></svg>
          <svg class="sh-burst" id="sh-burst-2" viewBox="-50 -50 100 100"><polygon points="0,-48 9,-18 34,-36 20,-8 48,-6 20,8 36,32 8,18 0,48 -8,18 -36,32 -20,8 -48,-6 -20,-8 -34,-36 -9,-18" fill="#e8702a" transform="rotate(14)" /><polygon points="0,-26 5,-10 18,-18 10,-3 26,-2 10,5 18,17 4,10 0,26 -4,10 -18,17 -10,5 -26,-2 -10,-3 -18,-18 -5,-10" fill="#fffefb" /></svg>
          <div id="sh-card">
            <div id="sh-card-bg" class="sh-torn"></div>
            <div id="sh-num">2</div>
            <div id="sh-label"><span id="sh-label-text">SHOTS</span></div>
          </div>
        </div>
        <!-- The overlays, outside the camera: the black that holds at the end and the white flash of the second shot. -->
        <div id="sh-black"></div>
        <div id="sh-flash"></div>
      </div>
      <script>
        /* Setup: this scene's paused timeline. */
        const tl = gsap.timeline({ paused: true });
        /* Helper: types a text element one character at a time, from a start time and a rate. */
        function typeOn(sel, t, cps) {
          const el = document.querySelector(sel);
          const text = el.textContent;
          el.textContent = "";
          [...text].forEach((ch, i) => {
            const s = document.createElement("span");
            s.textContent = ch;
            s.style.display = "none";
            el.appendChild(s);
            tl.set(s, { display: "inline" }, t + i / cps);
          });
        }
        tl.fromTo("#sh-gun", { x: 1300, rotation: 4 }, { x: 0, rotation: -4, duration: 0.38, ease: "power3.out" }, 0);
        tl.fromTo("#sh-gun img", { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.38, ease: "power2.out" }, 0);
        // The count arrives with "twice" (24.39 s), before the shots are heard.
        tl.fromTo("#sh-card", { scale: 1.3, rotation: 10, opacity: 0 }, { scale: 1, rotation: 3, opacity: 1, duration: 0.18, ease: "power4.out" }, 0.45);
        tl.fromTo("#sh-num", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "power3.out" }, 0.55);
        typeOn("#sh-label-text", 0.75, 20);
        // Two shots (1.11 s and 1.51 s, on the measured sound): a burst at the muzzle and a kick of the frame.
        tl.fromTo("#sh-burst-1", { scale: 0, opacity: 1 }, { keyframes: [{ scale: 1.15, duration: 0.06 }, { scale: 1, opacity: 0, duration: 0.3 }] }, 1.11);
        tl.fromTo("#sh-burst-2", { scale: 0, opacity: 1 }, { keyframes: [{ scale: 1.25, duration: 0.06 }, { scale: 1, opacity: 0, duration: 0.3 }] }, 1.51);
        tl.fromTo("#sh-cam", { x: 0, y: 0 }, { keyframes: [{ x: -14, y: 8, duration: 0.04 }, { x: 9, y: -6, duration: 0.05 }, { x: 0, y: 0, duration: 0.08 }] }, 1.11);
        // The second shot whites out the frame, and the white falls away to black, which holds.
        tl.fromTo("#sh-flash", { opacity: 0 }, { keyframes: [{ opacity: 1, duration: 0.03 }, { opacity: 1, duration: 0.08 }, { opacity: 0, duration: 0.3, ease: "power2.in" }] }, 1.51);
        tl.fromTo("#sh-black", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.56);
        tl.set("#sh-cam", { autoAlpha: 0 }, 1.6);
        /* Registration: the host finds this timeline by the composition id "shots". */
        window.__timelines["shots"] = tl;
      </script>
    </template>
  </body>
</html>
