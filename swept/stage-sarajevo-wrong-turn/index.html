<!doctype html>
<!--
  GUIDE: index.html (root composition) (composition id "main")
  WHAT: A 27.5 s history short about the 1914 assassination in Sarajevo. A map settles and pins the
    city (0 s), a title is slapped onto a sea chart (4.25 s), the Archduke's cut-out whips in with
    his name and role (7.16 s), six young assassins are stamped on (12.56 s), a top-down street
    diagram shows the wrong turn, the stall and Princip (15.06 s), and two shots end on a white
    flash and black (23.84 s). The film is the collage half of the dark archival style.
  STRUCTURE: Scenes are sub-compositions mounted by empty hosts in #root, each with data-start and
    data-duration: map-slot 0 s for 4.25 s, title-slot 4.25 s for 2.91 s, archduke-slot 7.16 s for
    5.4 s, assassins-slot 12.56 s for 2.5 s, street-slot 15.06 s for 8.78 s, shots-slot 23.84 s for
    3.66 s, all on track 1. paper-slot (track 2, 0 to 25.4 s) mounts the shared paper sheet, which
    is multiplied over the scenes by the CSS rule on #paper-slot (mix-blend-mode: multiply, z-index
    50). Audio: voice-s01 to voice-s07 on track 10, one clip per narration sentence (starts at 0,
    3.735, 7.03, 12.3, 15.035, 19.175, 23.685 s); bed on track 11 with a volume lane (0 to 0.32 over
    1.2 s, held, ends at 24.88 s); sound effects on tracks 12 to 20 (pop 2.72 s, typing 2.95 s, slap
    4.15 s, whip 7.04 s, role typing 10.12 s, six 13.31 s, stamp 18.24 s); two shot clips at 24.88 s
    and 25.28 s. The root timeline itself is empty; each scene registers its own timeline.
  CUSTOMIZE: Scene starts are the narration's sentence starts: when a line of narration.txt moves,
    move the matching host's data-start, the matching voice clip's data-start, and the shift of the
    scene timeline's tweens. The root data-duration (27.5) must cover the last host (shots ends at
    27.5 s). Background of the frame and the final black: #000000 on html, body and #root. Paper
    layer: #paper-slot z-index and blend mode. Music level: the bed's data-volume (1) and its volume
    lane points (0.32). Sound effect levels: data-volume values on each sfx element.
  MEDIA: No media file is bundled in this file or in its scenes, so the film is silent as shipped.
    Photos, fonts and CSS images: none in this file; the scenes hold their own (see each MEDIA note).
    Sound: 17 sound slots, all silent now. Each was an audio element and is now a comment here. To hear
    one, add an audio element with the id and data attributes given, and set its src to a sound file of
    your own. data-start is the film time the clip begins, data-duration its length where one was
    given, data-track-index its track, and data-volume its level. A clip that began partway into its
    original file needs your file cut to start at that point.
    Narration, one clip per sentence of narration.txt (timings in assets/narration/segments.json), all on
    track 10 at volume 1:
    - #voice-s01, "June twenty-eighth, nineteen fourteen. Sarajevo.": an audio element with id="voice-s01", src set to your file, data-start="0", data-duration="3.734", data-track-index="10" and data-volume="1"
    - #voice-s02, "One wrong turn is about to start a world war.": an audio element with id="voice-s02", src set to your file, data-start="3.735", data-duration="3.294", data-track-index="10" and data-volume="1"
    - #voice-s03, "In the back seat rides Archduke Franz Ferdinand, heir to Austria-Hungary's throne.": an audio element with id="voice-s03", src set to your file, data-start="7.03", data-duration="5.269", data-track-index="10" and data-volume="1"
    - #voice-s04, "Along his route wait six young assassins.": an audio element with id="voice-s04", src set to your file, data-start="12.3", data-duration="2.734", data-track-index="10" and data-volume="1"

    - #voice-s06, "He brakes, and the engine stalls, a few steps from Gavrilo Princip.": an audio element with id="voice-s06", src set to your file, data-start="19.175", data-duration="4.509", data-track-index="10" and data-volume="1"
    - #voice-s07, "He fires twice.": an audio element with id="voice-s07", src set to your file, data-start="23.685", data-duration="1.853", data-track-index="10" and data-volume="1"
    - #bed, the music bed from assets/generated/src/bed.mp3 (Freesound), from 0 s for 24.88 s on track 11

      shot. That lane lived in data-automation, which is not bundled, so add your own volume automation to

    - #sfx-pin, the pop from assets/sfx/pop.mp3 (Pixabay), from 2.72 s on track 12 at volume 0.6. Its peak

    - #sfx-type-city, the typing from assets/sfx/typing.mp3 (Pixabay), from 2.95 s for 0.6 s on track 13 at

      volume 0.8. Its peak is 0.12 s in, so the hit lands on the stamp of six at 13.43 s. Plug in: an audio element with id="sfx-six", src set to your file, data-start="13.31", data-track-index="17" and data-volume="0.8"
    - #sfx-stamp, the bass impact from assets/sfx/impact-bass-1.mp3 (Pixabay), from 18.24 s on track 18 at

    - #sfx-shot-1, the first gunshot from assets/generated/src/shot.mp3 (Freesound), from 24.88 s on track 19 at
      volume 1. Its peak is 0.07 s in, so the hit lands at 24.95 s. Plug in: an audio element with id="sfx-shot-1", src set to your file, data-start="24.88", data-track-index="19" and data-volume="1"
    - #sfx-shot-2, the second gunshot from the same file, from 25.28 s on track 20 at volume 1. Its hit lands at
      25.35 s. Plug in: an audio element with id="sfx-shot-2", src set to your file, data-start="25.28", data-track-index="20" and data-volume="1"
    Without the narration clips the film is silent, so the scene timings still show the visual rhythm.
    Without the music bed or the gunshot, use any short quiet bed and a single short percussive hit at
    24.88 s. Not media: the GSAP script loads from cdn.jsdelivr.net (gsap 3.14.2), so the page needs a
    network connection.
  WHEN TO USE: A short, sentence-timed history film built from photos, cut-outs and paper scraps,
    where every reveal lands on the word that names it. Pick another root when the film has no
    narration to time against, or needs motion graphics rather than collage.

<!-- The collage half of the "dark archival with animation" style (references/dark-archival-with-animation.md): a locator map, a title slapped
     onto a sea chart, printed cut-outs with typed labels, a schematic street diagram, and a flash to
     black. Every scene starts on a sentence of the narration (assets/transcript.json); every reveal
     lands on the word that names it. One paper sheet is multiplied over all scenes so they share a
     surface. Media: ./make-footage.sh (searched photos, AI cut-outs, map, paper, music, shot). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sarajevo, one wrong turn</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Page reset and a fixed 1920x1080 black frame, so the stage is the same size in any window. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000000; }
      #root[data-composition-id="main"] { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000000; }
      /* The shared paper layer sits above the scenes and multiplies onto them. */
      #paper-slot { z-index: 50; mix-blend-mode: multiply; pointer-events: none; }
    </style>
  </head>
  <body>

      <div id="archduke-slot" data-composition-id="archduke" data-composition-src="compositions/archduke.html"

      <div id="assassins-slot" data-composition-id="assassins" data-composition-src="compositions/assassins.html"

      <div id="paper-slot" data-composition-id="paper" data-composition-src="compositions/paper.html"
        data-start="0" data-duration="25.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
