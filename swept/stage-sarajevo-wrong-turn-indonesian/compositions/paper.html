<!doctype html>
<!--
  GUIDE: compositions/paper.html (composition id "paper")
  WHAT: One sheet of grey paper and a dark indigo vignette, mounted by index.html at 0 s for 25.88
    s. It has no motion of its own. The host multiplies this whole layer over every scene, so the
    map, title, cut-outs and shots all sit on the same paper; the sheet is gone when the film
    reaches its final black. The file plays no sound of its own.
  STRUCTURE: #root holds two layers: #pp-sheet (the paper image, 2112x1188 px, at -96,-54 so it
    covers the frame with a margin) and #pp-vig (a radial vignette, transparent at the centre and
    dark indigo at the edges). The timeline is empty; the layer is static. The blend is not set
    here: index.html sets mix-blend-mode multiply on its #paper-slot host, because a blend inside a
    layer only mixes within that layer.
  CUSTOMIZE: Paper strength: the opacity of #pp-sheet and #pp-vig (0.55 each); keep them under 0.6
    so the layout audit does not count the sheet as covering the text. For a stronger or weaker
    surface, change the texture (paper-texture.py mottle and burn settings). The vignette colour is
    rgba(0, 25, 108) and its size is set in the gradient (75% by 70%, starting at 55%). The sheet's
    2112x1188 px must match the texture file's size.
  MEDIA: No media file is bundled. This file has one photo slot, and no video, sound or font slot.
    Photo slot, #pp-sheet (assets/generated/paper.jpg, a neutral paper texture with folds, mottling and burn marks,
    made by paper-texture.py at 2112 by 1188 px; generated, with no photograph in it): it now shows a faint hatch
    stand-in labeled "PHOTO: assets/generated/paper.jpg" at the sheet's 0.55 opacity, under the vignette. To plug in
    your own texture, set the src of that img to your file, for example src="assets/generated/paper.jpg". The file
    must be 2112 by 1188 px to match the overscan, or any plain off-white paper image of that size. To run with no
    sheet at all, delete the img; the vignette still works alone.
  WHEN TO USE: A shared surface for a collage film, so photos, cut-outs and type look printed on one
    sheet. Pick something else when the film is clean-graphic or when a flat look is wanted.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* One sheet of paper over every scene. The host multiplies this whole layer onto the scenes
           (mix-blend-mode on the mount: a blend set inside a layer only mixes within that layer).
           Opacity stays under 0.6 so the layout audit does not count the sheet as covering the text;
           the strength is baked into the texture instead (paper-texture.py with its mottle and burn flags). */
        /* Pass-through: the paper never takes clicks or hovers from the host. */
        #root, #root * { pointer-events: none; }
        /* The frame: a transparent full-stage box that hides the sheet's overhang. */
        #root { position: absolute; inset: 0; overflow: hidden; }
        /* The paper sheet, oversized so the edges stay outside the frame. */
        #pp-sheet { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; opacity: 0.55; }
        #pp-vig { position: absolute; inset: 0; opacity: 0.55; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0, 25, 108, 0) 55%, rgba(0, 25, 108, 0.5) 100%); }
      </style>
      <div id="root" data-composition-id="paper" data-width="1920" data-height="1080">
        <!-- The paper texture, then the vignette laid over it. -->
        <img id="pp-sheet" src="data:image/svg+xml,%3C!--paper.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'687' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/paper.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/paper.jpg" alt="" data-layout-allow-overflow />
        <div id="pp-vig"></div>
      </div>
      <script>
        /* Registration: an empty timeline, so the host can run this layer with the others. */
        window.__timelines["paper"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
