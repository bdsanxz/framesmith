  WHAT: The whole film, 68 s at 1920 by 1080, in the dark archival with animation style. It opens on

    subtitles, a number that counts up to 34, and a statement card about the passenger lounge. From
    26.99 s to 51.2 s a paper-collage block explains the cause: a cut-out of Hugo Eckener, a paper map
    of the USA with Texas filled, a red card with 7,000,000 cubic feet, and the landing field seen from
    above with the ship and the storm. Back on film, the tail catches fire at 51.2 s, the survivors
    count runs, and the film ends on the wreck with THE END OF AN AGE. Heard: the narration, a music bed, the blast
    and fire roar, and short sound hits. None of them is bundled, so the film plays silently until they are added
    (see MEDIA).
  STRUCTURE: #root is the root composition, 68 s long. Track 1 mounts the scene compositions in order,
    each in its own div with data-composition-src: map at 0 s, arrival 5.93, flame 12.81, stat 17.08,
    statement 21.73, eckener 26.99, helium 34.03, hydrogen 39.99, field 45.17, fire 51.2, survivors
    55.91, ending 61.29. Track 2 mounts paper (26.99 s for 24.21 s), the paper sheet laid over the
    collage block. Track 3 mounts subs over the whole film. The narration clips voice-s01 to voice-s11
    sit on track 10. Music: bed-a runs from 0 to 51.2 s and bed-b starts at 55.91 s for 12.09 s (track
    11). The blast sfx-blast sits at 51.17 s and the fire roar amb-fire at 51.2 s (tracks 12 and 13),
    and the short sound hits sit on tracks 14 to 16. The main GSAP timeline holds no tweens; each
    scene registers its own timeline by id.
  CUSTOMIZE: Scene order and timing are the data-start and data-duration pairs on each slot. A slot's
    duration must equal its scene's own length (arrival is 6.88 s, which is 4.02 plus 2.86). The
    narration clips are generated from narration.txt and carry a do-not-edit note, so re-cut them
    rather than retiming them by hand. Music and effect levels are the data-volume attributes and the
    data-automation lanes: bed-a holds volume 0.0363, bed-b swells to 0.0675 at about 10.5 s of its
    clip and falls to 0 at its end, amb-fire holds 0.0102, and the blast is 0.5 with data-duck off.
    The frame is 1920 by 1080 in the meta tag, the html and body rules, and each slot. The layer order
    is set in the CSS: the paper layer at z-index 50 with multiply, the subtitles at z-index 60.
  MEDIA: No media file is bundled. This file has no picture, video or font slot of its own: the scenes it mounts
    are compositions with their own MEDIA notes, and the paper and subs layers have theirs too. Its own slots are
    the 32 sound slots listed below. Each one is a commented SOUND SLOT that stood for an audio element, and none
    plays until you add that element, so the film is silent until then.
