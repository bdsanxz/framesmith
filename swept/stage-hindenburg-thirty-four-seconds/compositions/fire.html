<!doctype html>
<!--
  GUIDE: compositions/fire.html (composition id "fire")
  WHAT: Archive film of the burning airship in black and white, cut on the narration. It opens on a white flash
    that falls away in about a third of a second, then shows the tail on fire for the first 1.35 s, then the
    whole ship from 1.35 s, with the flames running its length. Both shots drift slowly in scale. It lasts
    4.71 s, and index.html mounts it at 51.2 s, right after the collage block, as the climax of the film.
    The file plays no sound of its own.
  STRUCTURE: Back to front. #fr-a is the tail shot (a wrapper with a push from 1.03 to 1.06, holding the video
    #fr-a-video). #fr-b is the ship shot (a push from 1.02 to 1.08, video #fr-b-video, which starts at 1.35 s
    with local media time). Then the vignette #fr-vig and the full-frame white layer #fr-flash on top.
    Timeline: #fr-flash goes from opacity 1 to 0 over 0.34 s from 0.04 s; the first push runs 0 to 1.35 s and
    the second 1.35 to 4.71 s, both with ease none.
  CUSTOMIZE: The cut (1.35 s) sets both the length of c1 and the start of c2; keep the data-duration of
    #fr-a-video and the start of the second push equal. The grade is in the .fr-shot video rule: grayscale 1,
    contrast 1.12, brightness 0.9. The flash colour is #ffffff, and its length is the 0.34 s duration. The push
    amounts are the scale numbers in the tweens. The clip files are the src attributes of the two videos.
  MEDIA: No media file is bundled. This file has two video slots, and no photo, sound or font slot.
    Video slot 1, #fr-a-video (footage/c1.mp4, the tail catches fire, muted, shown from 0 s to 1.35 s): it now
    shows a faint hatch stand-in labeled "VIDEO: footage/c1.mp4". To plug in your own clip, replace that img with
    a video element that has id="fr-a-video", src="footage/c1.mp4", muted, playsinline, data-start="0", data-duration="1.35", data-track-index="1" and data-media-kind="video". Keep the id and every data-* attribute, and keep
    data-media-kind="video" so the grade rule on .fr-shot [data-media-kind="video"] still matches.
    Video slot 2, #fr-b-video (footage/c2.mp4, the whole ship burning, muted, shown from 1.35 s to 4.71 s): the
    same hatch stand-in, labeled "VIDEO: footage/c2.mp4". To plug in your own clip, replace that img with
    a video element that has id="fr-b-video", src="footage/c2.mp4", muted, playsinline, data-start="1.35", data-hf-media-start-basis="local", data-duration="3.36", data-track-index="2" and data-media-kind="video".
    Until you plug in clips, the two hatch stand-ins still show under the white flash, and the flash and vignette
    still carry the cut.
  WHEN TO USE: The climax of an archive film: a white flash, then a cut from a detail to the whole object. Pick
    another when no film exists for the moment.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Scene root: a full-frame black box under the film shots. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #000000; }
        .fr-shot { position: absolute; inset: 0; transform-origin: 45% 50%; }
        .fr-shot [data-media-kind="video"] { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.12) brightness(0.9); }
        /* A dark radial vignette over the film, darkest at the corners. */
        #fr-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.6) 100%); }
        #fr-flash { position: absolute; inset: 0; background: #ffffff; }
      </style>
      <div id="root" data-composition-id="fire" data-width="1920" data-height="1080">
        <!-- Cut on the clause: the tail from "the tail catches fire" (51.20 s), the whole ship from
             "and the flames run" (52.55 s). -->
        <div class="fr-shot" id="fr-a" data-layout-allow-overflow>
          <img id="fr-a-video" data-start="0" data-duration="1.35" data-track-index="1" src="data:image/svg+xml,%3C!--c1.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/c1.mp4%3C/text%3E%3C/svg%3E" data-media="footage/c1.mp4" data-media-kind="video" alt="" />
        </div>
        <div class="fr-shot" id="fr-b" data-layout-allow-overflow>
          <img id="fr-b-video" data-start="1.35" data-hf-media-start-basis="local" data-duration="3.36" data-track-index="2" src="data:image/svg+xml,%3C!--c2.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/c2.mp4%3C/text%3E%3C/svg%3E" data-media="footage/c2.mp4" data-media-kind="video" alt="" />
        </div>
        <div id="fr-vig"></div>
        <div id="fr-flash"></div>
      </div>
      <script>
        /* Setup: the scene timeline, paused so the host seeks it. */
        const tl = gsap.timeline({ paused: true });
        // The film opens on a white flash that falls away in a third of a second.
        tl.fromTo("#fr-flash", { opacity: 1 }, { opacity: 0, duration: 0.34, ease: "power2.out" }, 0.04);
        /* The tail shot and the whole-ship shot each get their own slow push, split at the cut. */
        tl.fromTo("#fr-a", { scale: 1.03 }, { scale: 1.06, duration: 1.35, ease: "none" }, 0);
        tl.fromTo("#fr-b", { scale: 1.02 }, { scale: 1.08, duration: 3.36, ease: "none" }, 1.35);
        window.__timelines["fire"] = tl;
      </script>
    </template>
  </body>
</html>
