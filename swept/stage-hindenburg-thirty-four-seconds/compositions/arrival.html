<!doctype html>
<!--
  GUIDE: compositions/arrival.html (composition id "arrival")
  WHAT: Two archive shots in black and white, cut on the narration. The first shows the airship over
    Manhattan with a gold tag, LZ 129 HINDENBURG, that springs open low on the left and leaves on the
    cut. The second shows the ship over the landing field, and a second tag, 7:21 PM, opens on it.
    Both shots drift slowly in scale. It lasts 6.88 s, and index.html mounts it at 5.93 s, after the
    map scene. The file plays no sound of its own.
  STRUCTURE: Back to front. #ar-a is the first shot (wrapper with a push from 1.02 to 1.08, holding the
    video #ar-a-video). #ar-b is the second shot (push from 1.02 to 1.07, video #ar-b-video, which starts
    at 4.02 s with local media time). Then the vignette #ar-vig and the two gold tags #ar-tag-1 and
    #ar-tag-2. Timeline: the first push runs 0 to 4.02 s and the second 4.02 to 6.88 s, both with ease
    none; #ar-tag-1 scales in at 1.5 s and is hidden at the cut at 4.02 s; #ar-tag-2 is hidden at start
    and scales in at 4.35 s.
  CUSTOMIZE: The tag texts are the text of #ar-tag-1 and #ar-tag-2. Their placement (left 118 px, top
    776 px), gold fill #e9b04a, dark text #15110a and the 50 px Roboto Condensed style are shared with the
    flame and ending scenes, so change them together for a consistent look. The grade is on the video:
    grayscale 1, contrast 1.12, brightness 0.9. The cut point is 4.02 s, so the first clip's duration and
    the second shot's start must both stay at 4.02. The two data-duration values (4.02 and 2.86) must add
    up to the scene length of 6.88 s.
  MEDIA: No media file is bundled. This file has two video slots and one font slot.
    Video slot 1, #ar-a-video (footage/a1.mp4, the ship over Manhattan, muted, shown from 0 s to 4.02 s of
    the scene): it now shows a faint hatch stand-in labeled "VIDEO: footage/a1.mp4". To plug in your own
    clip, replace that img with a video element with id="ar-a-video", src="footage/a1.mp4", muted and playsinline, data-start="0", data-duration="4.02", data-track-index="1" and data-media-kind="video". Keep the id and every data-*
    attribute, and keep data-media-kind="video" so the grade rule on .ar-shot [data-media-kind="video"] still matches.
    Video slot 2, #ar-b-video (footage/a2.mp4, the ship over the landing field, muted, shown from 4.02 s to
    6.88 s): the same hatch stand-in, labeled "VIDEO: footage/a2.mp4". To plug in your own clip, replace
    that img with a video element with id="ar-b-video", src="footage/a2.mp4", muted and playsinline, data-start="4.02", data-hf-media-start-basis="local", data-duration="2.86", data-track-index="2" and data-media-kind="video".
    Font slot, the Roboto Condensed 500 face used by the .ar-tag gold labels: it now uses an installed Roboto
    Condensed, or the sans-serif fallback. To bundle it, change the src of the @font-face rule to
    url("assets/fonts/roboto-condensed-latin.woff2") format("woff2"), local("Roboto Condensed").
  WHEN TO USE: Archive film cut on a sentence, with a gold caps label that names what is on screen.
    Pick another when no archive footage is available or the film has no label to set.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Roboto Condensed"; font-style: normal; font-weight: 500; font-display: block; src: local("Roboto Condensed"); }
        /* Scene root: a full-frame black box that clips the two film shots. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #000000; }
        /* Archive film under a slow push. Motion on the wrapper, treatment on the video. */
        .ar-shot { position: absolute; inset: 0; transform-origin: 50% 45%; }
        .ar-shot [data-media-kind="video"] { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.12) brightness(0.9); }
        /* A dark radial vignette over the film, darkest at the corners. */
        #ar-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.6) 100%); }
        /* The tag: a caps label on a gold box, low on the left, above the subtitle line. */
        .ar-tag { position: absolute; left: 118px; top: 776px; padding: 16px 22px; background: #e9b04a; font-family: "Roboto Condensed", sans-serif; font-weight: 500; font-size: 50px; line-height: 1.2; letter-spacing: 0.02em; color: #15110a; white-space: nowrap; transform-origin: 0 50%; }
      </style>
      <div id="root" data-composition-id="arrival" data-width="1920" data-height="1080">
        <!-- Cut on the narration: Manhattan from the sentence start, the landing field from "drops" (9.95 s).
             Media times inside a sub-composition are local; a nonzero one says so (start-basis). -->
        <div class="ar-shot" id="ar-a" data-layout-allow-overflow>
          <img id="ar-a-video" data-start="0" data-duration="4.02" data-track-index="1" src="data:image/svg+xml,%3C!--a1.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/a1.mp4%3C/text%3E%3C/svg%3E" data-media="footage/a1.mp4" data-media-kind="video" alt="" />
        </div>
        <div class="ar-shot" id="ar-b" data-layout-allow-overflow>
          <img id="ar-b-video" data-start="4.02" data-hf-media-start-basis="local" data-duration="2.86" data-track-index="2" src="data:image/svg+xml,%3C!--a2.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/a2.mp4%3C/text%3E%3C/svg%3E" data-media="footage/a2.mp4" data-media-kind="video" alt="" />
        </div>
        <div id="ar-vig"></div>
        <div class="ar-tag" id="ar-tag-1">LZ 129 HINDENBURG</div>
        <div class="ar-tag" id="ar-tag-2">7:21 PM</div>
      </div>
      <script>
        /* Setup: the scene timeline, paused so the host seeks it; the second tag starts hidden. */
        const tl = gsap.timeline({ paused: true });
        gsap.set("#ar-tag-2", { opacity: 0 });
        /* The two shots: the first pushes in for 4.02 s, the second picks up at the cut with its own push. */
        tl.fromTo("#ar-a", { scale: 1.02 }, { scale: 1.08, duration: 4.02, ease: "none" }, 0);
        tl.fromTo("#ar-b", { scale: 1.02 }, { scale: 1.07, duration: 2.86, ease: "none" }, 4.02);
        // The first tag names the ship on "the largest aircraft" (8.26 s) and leaves on the cut.
        tl.fromTo("#ar-tag-1", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 1.5);
        tl.to("#ar-tag-1", { opacity: 0, duration: 0.001 }, 4.02);
        // The second gives the time as the lines drop.
        tl.fromTo("#ar-tag-2", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 4.35);
        window.__timelines["arrival"] = tl;
      </script>
    </template>
  </body>
</html>
