<!doctype html>
<!--
  GUIDE: compositions/flame.html (composition id "flame")
  WHAT: One archive shot in black and white of flame pouring past the airship's hull. The frame pushes in
    slowly, from scale 1.02 to 1.09, over 4.27 s. A gold tag reading 7:25 PM slides open from the left at
    1.3 s and stays to the end of the scene. It follows the arrival scene, and index.html mounts it at
    12.81 s, where the narration says "Four minutes later". The file plays no sound of its own.
  STRUCTURE: Back to front. #fl-shot is the wrapper that carries the push, holding the video #fl-video.
    Then the vignette #fl-vig and the gold tag #fl-tag. Timeline: the push runs from 0 to 4.27 s with ease
    none; #fl-tag scales in from scaleX 0 with its opacity at 1.3 s, over 0.2 s, with power3.out.
  CUSTOMIZE: The tag text is the text of #fl-tag ("7:25 PM"). Its placement (left 118 px, top 776 px), gold
    #e9b04a fill, #15110a text and 50 px Roboto Condensed style match the tags in the arrival and ending
    scenes. The grade is on #fl-shot video: grayscale 1, contrast 1.12, brightness 0.88. The push end
    (1.09) and the tag time (1.3) are arguments in the tl calls. Keep the push duration at 4.27 s, which
    is the scene length and the video's data-duration.
  MEDIA: No media file is bundled. This file has one video slot and one font slot, and no sound.
    Video slot, #fl-video (footage/b1.mp4, the flame shot, muted, shown from 0 s to 4.27 s): it now shows a faint
    hatch stand-in labeled "VIDEO: footage/b1.mp4". To plug in your own clip, replace that img with
    a video element that has id="fl-video", src="footage/b1.mp4", muted, playsinline, data-start="0", data-duration="4.27", data-track-index="1" and data-media-kind="video". Keep the id and every data-* attribute, and keep
    data-media-kind="video" so the grade rule on #fl-shot [data-media-kind="video"] still matches.
    Font slot, Roboto Condensed 500, used by the #fl-tag gold label: it now uses an installed Roboto Condensed,
    or the sans-serif fallback. To bundle it, change the src of the @font-face rule to
    url("assets/fonts/roboto-condensed-latin.woff2") format("woff2"), local("Roboto Condensed").
  WHEN TO USE: One archive shot with a short time caption that needs a slow push-in. Pick another when
    the film has no shot to hold, or the caption is not a time.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Roboto Condensed"; font-style: normal; font-weight: 500; font-display: block; src: local("Roboto Condensed"); }
        /* Scene root: a full-frame black box under the film shot and the tag. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #000000; }
        #fl-shot { position: absolute; inset: 0; transform-origin: 40% 50%; }
        #fl-shot [data-media-kind="video"] { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.12) brightness(0.88); }
        /* A dark radial vignette darkens the corners of the film. */
        #fl-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.6) 100%); }
        #fl-tag { position: absolute; left: 118px; top: 776px; padding: 16px 22px; background: #e9b04a; font-family: "Roboto Condensed", sans-serif; font-weight: 500; font-size: 50px; line-height: 1.2; letter-spacing: 0.02em; color: #15110a; white-space: nowrap; transform-origin: 0 50%; }
      </style>
      <div id="root" data-composition-id="flame" data-width="1920" data-height="1080">
        <div id="fl-shot" data-layout-allow-overflow>
          <img id="fl-video" data-start="0" data-duration="4.27" data-track-index="1" src="data:image/svg+xml,%3C!--b1.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/b1.mp4%3C/text%3E%3C/svg%3E" data-media="footage/b1.mp4" data-media-kind="video" alt="" />
        </div>
        <div id="fl-vig"></div>
        <div id="fl-tag">7:25 PM</div>
      </div>
      <script>
        /* Setup: the scene timeline, paused so the host seeks it. */
        const tl = gsap.timeline({ paused: true });
        /* The slow push on the film runs for the full length of the scene. */
        tl.fromTo("#fl-shot", { scale: 1.02 }, { scale: 1.09, duration: 4.27, ease: "none" }, 0);
        // The time lands on "a flame" (14.18 s).
        tl.fromTo("#fl-tag", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 1.3);
        window.__timelines["flame"] = tl;
      </script>
    </template>
  </body>
</html>
