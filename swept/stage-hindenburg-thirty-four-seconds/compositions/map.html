<!doctype html>
<!--
  GUIDE: compositions/map.html (composition id "map")
  WHAT: A dark locator map of the United States opens the film. The country settles out of a soft
    focus, then the camera flies in to New Jersey while the state is highlighted. A coral pin drops
    on the word "Lakehurst", the name types out in serif capitals, and a leader line runs from the name
    to the pin, where the subline "May 6, 1937, Naval Air Station, New Jersey" types on. It lasts 5.93 s
    and index.html mounts it at 0 s as the first scene of the dark half. The file plays no sound of its own.
  STRUCTURE: Back to front. #mp-drift is a slow scale push (1 to 1.045) on the whole scene and holds
    #mp-cam, the camera, with two images inside it: #mp-map (the country) and #mp-hl (the state
    highlight). Also in #mp-drift is the pin group #mp-pin, with rings #mp-ring-1 and #mp-ring-2, the
    shadow #mp-shadow and the coral pin svg. Above that come the vignette #mp-vig, the leader line
    #mp-lead (dot #mp-dot and path #mp-line) and the label #mp-label with #mp-name and #mp-sub.
    Timeline: the camera fades in and blurs out over 0 to 1.1 s; #mp-cam flies from scale 1 to 3
    between 0.55 and 2.85 s; #mp-hl fades in at 2.45 s; the pin drops at 3.0 s, the shadow at 3.12 s and
    the rings at 3.2 and 3.3 s; the name types at 12 characters per second from 3.18 s; the dot appears
    at 3.95 s and the line draws at 3.98 s; the subline types at 34 characters per second from 4.07 s.
  CUSTOMIZE: The place name and the subline are the text of #mp-name and #mp-sub. The camera target is
    set by its x and y (-3367.4, -792.3) with scale 3, chosen so the pin's map point (1565.8, 424.1 in
    map.json) lands at 1330, 480. If you move the target, recompute x and y together with the pin
    position (#mp-pin left 1330 and top 480). Colours: background #070b0f, name #f6f3ea, subline #d5e3e8,
    pin #f2604f with a #ff9b8c rim, rings rgba(190, 255, 220). Sizes: name 112 px, subline 30 px. The
    timings are the numbers in the tl calls and the typeOn arguments, and the drift must end at the
    scene length of 5.93 s.
  MEDIA: No media file is bundled. Bundled drawings (SVG, kept): assets/generated/map.svg (#mp-map, the country map,
    drawn by map-svg.py at twice the frame size, 3840 by 2160 px, placed at -960, -540) and assets/generated/map-hl.svg
    (#mp-hl, the state highlight on the same canvas, faded in at 2.45 s). Both are made for this inspiration and render
    as they are; they need nothing plugged in. To use your own drawing, set the src of that img to your own SVG on
    the same canvas, for example src="assets/generated/map.svg". To draw your own outline instead, use teal #1f6f8b on
    the same canvas. No picture, video or sound slot.
    Font slot, Cormorant Garamond 700, used by #mp-name (LAKEHURST): it now uses an installed Cormorant Garamond, or the
    fallback serif. To bundle it, change the src of the @font-face rule to
    url("assets/fonts/cormorant-garamond-latin.woff2") format("woff2"), local("Cormorant Garamond").
    The subline font, Inter, is bundled by HyperFrames, so it needs no file here.
  WHEN TO USE: A locator map that flies from a country to one place and names it. Pick something else
    when the place needs no camera move, or when no map is available.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 700; font-display: block; src: local("Cormorant Garamond"); }
        /* Scene root: a full-frame dark box that clips the camera layers. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #070b0f; }
        /* A slow push on the whole scene; the fly-in is on the camera inside it. */
        #mp-drift { position: absolute; inset: 0; transform-origin: 1330px 480px; }
        /* The camera flies from the whole country to the state: scale and move together from a
           top-left origin, so the pin (1565.8,424.1 in map.json) ends at 1330,480. */
        #mp-cam { position: absolute; inset: 0; transform-origin: 0 0; }
        /* map-svg.py draws half a frame beyond each edge, so the images sit at -960,-540 and are twice the frame. */
        #mp-cam img { position: absolute; left: -960px; top: -540px; width: 3840px; height: 2160px; }
        /* The pin and its rings are outside the camera, at the pin's final place, so they stay sharp and unscaled. */
        #mp-pin { position: absolute; left: 1330px; top: 480px; width: 0; height: 0; }
        #mp-pin svg { position: absolute; left: -30px; top: -84px; width: 60px; height: 84px; }
        .mp-ring { position: absolute; left: -46px; top: -16px; width: 92px; height: 32px; border-radius: 50%; border: 2px solid rgba(190, 255, 220, 0.55); }
        #mp-ring-2 { left: -74px; top: -26px; width: 148px; height: 52px; border-color: rgba(190, 255, 220, 0.28); }
        #mp-shadow { position: absolute; left: -22px; top: -7px; width: 44px; height: 14px; border-radius: 50%; background: rgba(4, 14, 18, 0.7); }
        /* A dark radial vignette darkens the frame edges so the centre reads. */
        #mp-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 72% 68% at 55% 48%, rgba(7, 11, 15, 0) 45%, rgba(7, 11, 15, 0.82) 100%); }
        /* The place label on the left of the frame: the serif name, then the sans subline. */
        #mp-label { position: absolute; left: 128px; top: 398px; }
        #mp-name { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 112px; line-height: 1.15; letter-spacing: 0.005em; color: #f6f3ea; white-space: nowrap; text-shadow: 0 2px 18px rgba(4, 16, 22, 0.55); }
        #mp-sub { margin-top: 4px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 30px; line-height: 1.3; color: #d5e3e8; white-space: nowrap; text-shadow: 0 2px 10px rgba(4, 16, 22, 0.6); }
        #mp-lead { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      </style>
      <div id="root" data-composition-id="map" data-width="1920" data-height="1080">
        <div id="mp-drift" data-layout-allow-overflow>
          <!-- The camera group: the country map and its state highlight scale and move together. -->
          <div id="mp-cam" data-layout-allow-overflow>
            <img id="mp-map" src="assets/generated/map.svg" alt="" />
            <img id="mp-hl" src="assets/generated/map-hl.svg" alt="" />
          </div>
          <div id="mp-pin">
            <div class="mp-ring" id="mp-ring-2"></div>
            <div class="mp-ring" id="mp-ring-1"></div>
            <div id="mp-shadow"></div>
            <svg viewBox="0 0 60 84"><path d="M30 82 C20 60 3 48 3 29 A27 27 0 0 1 57 29 C57 48 40 60 30 82 Z" fill="#f2604f" stroke="#ff9b8c" stroke-width="2" /><circle cx="30" cy="29" r="10" fill="#fff6f2" /></svg>
          </div>
        </div>
        <div id="mp-vig"></div>
        <!-- Leader line: a dot at the end of the name, a run, then a bend down to the pin. -->
        <svg id="mp-lead" viewBox="0 0 1920 1080">
          <circle id="mp-dot" cx="806" cy="466" r="6" fill="#f6f3ea" />
          <path id="mp-line" d="M 806 466 L 1060 466 L 1300 462" fill="none" stroke="#f6f3ea" stroke-width="3" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
        </svg>
        <!-- The place name and its subline, drawn above the leader line. -->
        <div id="mp-label">
          <div id="mp-name">LAKEHURST</div>
          <div id="mp-sub">May 6, 1937 · Naval Air Station, New Jersey</div>
        </div>
      </div>
      <script>
        /* Setup: the scene timeline, paused so the host seeks it. */
        const tl = gsap.timeline({ paused: true });
        /* typeOn: splits the text into one span per character and reveals each at a fixed rate. */
        function typeOn(sel, t, cps) {
          const el = document.querySelector(sel);
          const text = el.textContent;
          el.textContent = "";
          [...text].forEach((ch, i) => {
            const s = document.createElement("span");
            s.textContent = ch;
            el.appendChild(s);
            tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, t + i / cps);
          });
        }
        // The whole country settles out of a soft focus, then the camera flies to New Jersey.
        gsap.set("#mp-cam", { opacity: 0, filter: "blur(8px)" });
        tl.to("#mp-cam", { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
        tl.to("#mp-cam", { filter: "blur(0px)", duration: 1.1, ease: "power2.out" }, 0);
        tl.fromTo("#mp-cam", { scale: 1, x: 0, y: 0 }, { scale: 3, x: -3367.4, y: -792.3, duration: 2.3, ease: "power2.inOut" }, 0.55);
        tl.fromTo("#mp-hl", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.45);
        // The pin drops on "Lakehurst" (3.18 s); the name types as it is spoken; the line reaches the pin.
        tl.fromTo("#mp-pin svg", { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 3.0);
        tl.fromTo("#mp-shadow", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" }, 3.12);
        tl.fromTo("#mp-ring-1", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 3.2);
        tl.fromTo("#mp-ring-2", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 3.3);
        typeOn("#mp-name", 3.18, 12);
        tl.fromTo("#mp-dot", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 3.95);
        tl.to("#mp-line", { strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 3.98);
        typeOn("#mp-sub", 4.07, 34);
        /* The whole scene drifts in scale for its full length. */
        tl.fromTo("#mp-drift", { scale: 1 }, { scale: 1.045, duration: 5.93, ease: "sine.inOut" }, 0);
        window.__timelines["map"] = tl;
      </script>
    </template>
  </body>
</html>
