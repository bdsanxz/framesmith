<!doctype html>
<!--
  GUIDE: compositions/ending.html (composition id "ending")
  WHAT: The last scene: archive film of the wreck seen from the air the next day, in black and white. The gold tag
    THE END OF AN AGE slides open low on the left at 2.85 s. The second shot begins at 2.71 s, on the narration
    line "ends in a New Jersey field", and from 5.3 s the whole frame fades to black over 1.1 s. It lasts 6.71 s.
    index.html mounts it at 61.29 s, as the final scene. The file plays no sound of its own.
  STRUCTURE: Back to front. #en-a is the first shot (a push from 1.02 to 1.06, holding the video #en-a-video, 2.71 s
    long). #en-b is the second shot (a push from 1.02 to 1.09 from 2.71 s, holding #en-b-video, 4.0 s long, with
    local media time). Then the vignette #en-vig, the gold tag #en-tag and the full-frame black layer #en-black,
    which starts hidden. Timeline: the tag scales in from 2.85 s over 0.2 s; #en-black fades in from 5.3 s over
    1.1 s with power1.in.
  CUSTOMIZE: The tag text is the text of #en-tag. The cut at 2.71 s must stay equal to the length of e1.mp4
    (data-duration 2.71). The fade starts at 5.3 s and the tag at 2.85 s, both arguments in the script. The
    grade is in the video rule: grayscale 1, contrast 1.14, brightness 0.84. The tag styling matches the arrival
    and flame tags (left 118 px, top 776 px, gold #e9b04a, Roboto Condensed 500 at 50 px).
  MEDIA: No media file is bundled. This file has two video slots and one font slot.
    Video slot 1, #en-a-video (footage/e1.mp4, the wreck from the air the next day, muted, shown from 0 s to
    2.71 s): it now shows a faint hatch stand-in labeled "VIDEO: footage/e1.mp4". To plug in your own clip,
    replace that img with a video element with id="en-a-video", src="footage/e1.mp4", muted, playsinline, data-start="0", data-duration="2.71", data-track-index="1" and data-media-kind="video". Keep the id and every data-*
    attribute, and keep data-media-kind="video" so the grade rule on .en-shot [data-media-kind="video"] still matches.
    Video slot 2, #en-b-video (footage/e2.mp4, the second shot, muted, shown from 2.71 s to 6.71 s): the same
    hatch stand-in, labeled "VIDEO: footage/e2.mp4". To plug in your own clip, replace that img with
    a video element with id="en-b-video", src="footage/e2.mp4", muted, playsinline, data-start="2.71", data-hf-media-start-basis="local", data-duration="4.0", data-track-index="2" and data-media-kind="video".
    Font slot, the Roboto Condensed 500 face used by the #en-tag gold label: it now uses an installed Roboto
    Condensed, or the sans-serif fallback. To bundle it, change the src of the @font-face rule to
    url("assets/fonts/roboto-condensed-latin.woff2") format("woff2"), local("Roboto Condensed").
    Until you plug in clips, the two hatch stand-ins, the tag and the fade to black still play.
  WHEN TO USE: An end title over archive film that fades to black. Pick another when the film does not end on a
    shot, or the ending needs no label.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Roboto Condensed"; font-style: normal; font-weight: 500; font-display: block; src: local("Roboto Condensed"); }
        /* Scene root: a full-frame black box under the film. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #000000; }
        .en-shot { position: absolute; inset: 0; transform-origin: 50% 50%; }
        .en-shot [data-media-kind="video"] { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.14) brightness(0.84); }
        /* A dark radial vignette over the film. */
        #en-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.62) 100%); }
        #en-tag { position: absolute; left: 118px; top: 776px; padding: 16px 22px; background: #e9b04a; font-family: "Roboto Condensed", sans-serif; font-weight: 500; font-size: 50px; line-height: 1.2; letter-spacing: 0.02em; color: #15110a; white-space: nowrap; transform-origin: 0 50%; }
        /* A full-frame black layer that starts hidden and fades in for the close. */
        #en-black { position: absolute; inset: 0; background: #000000; }
      </style>
      <div id="root" data-composition-id="ending" data-width="1920" data-height="1080">
        <!-- The wreck from the air the next day; the second shot starts on "ends in a New Jersey field". -->
        <div class="en-shot" id="en-a" data-layout-allow-overflow>
          <img id="en-a-video" data-start="0" data-duration="2.71" data-track-index="1" src="data:image/svg+xml,%3C!--e1.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/e1.mp4%3C/text%3E%3C/svg%3E" data-media="footage/e1.mp4" data-media-kind="video" alt="" />
        </div>
        <div class="en-shot" id="en-b" data-layout-allow-overflow>
          <img id="en-b-video" data-start="2.71" data-hf-media-start-basis="local" data-duration="4.0" data-track-index="2" src="data:image/svg+xml,%3C!--e2.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/e2.mp4%3C/text%3E%3C/svg%3E" data-media="footage/e2.mp4" data-media-kind="video" alt="" />
        </div>
        <div id="en-vig"></div>
        <div id="en-tag">THE END OF AN AGE</div>
        <div id="en-black"></div>
      </div>
      <script>
        /* Setup: the scene timeline, paused so the host seeks it; the black layer starts hidden. */
        const tl = gsap.timeline({ paused: true });
        gsap.set("#en-black", { opacity: 0 });
        /* The two shots, each with a slow push, meet at 2.71 s. */
        tl.fromTo("#en-a", { scale: 1.02 }, { scale: 1.06, duration: 2.71, ease: "none" }, 0);
        tl.fromTo("#en-b", { scale: 1.02 }, { scale: 1.09, duration: 4.0, ease: "none" }, 2.71);
        tl.fromTo("#en-tag", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 2.85);
        // The film falls to black under the last of the music.
        tl.to("#en-black", { opacity: 1, duration: 1.1, ease: "power1.in" }, 5.3);
        window.__timelines["ending"] = tl;
      </script>
    </template>
  </body>
</html>
