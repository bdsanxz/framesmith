<!doctype html>
<!--
  GUIDE: index.html (composition id "main"), the whole film. The direcfy skill's scripts/deep-tracery-build.py rewrites
    this file and compositions/ from cut.json on every build, so a hand edit here is lost unless the same change is made
    in that script or in cut.json.
  WHAT: the whole film, 571.267 s (data-duration on #root; 1920 x 1080 at 30 fps), in the design tracery style: a
    presenter talks to camera, cut out of his room and punched in and out over 35 stretches; the scenes mount from
    compositions/ on top of him; clip pictures are cut in with their own sound (the b-roll pictures are silent); a music bed and short sound
    effects run under all of it. The host plays this file as the root, with the id "main".
  STRUCTURE: back to front: #room (z 1, the backdrop photo img.backdrop, dimmed), #shade (z 2, a dark radial fall-off),
    back-01 and back-02 (slots, z 3), #aroll (z 4, the presenter: img.aroll a-00 to a-34), full-01 to full-04 (slots,
    z 5), img.brollvid and img.clipvid (z 6), over-01 to over-04 (slots, z 7), chapters and end (slots, z 8), seams
    (slot, z 9); the sound slots come last as comments. The timeline is the paused gsap timeline "main" in the script.
    Two row lists, P("#aroll") and P("#room"), 128 rows each, move the presenter and the room together for each framing
    (scale 1.0 is wide, 1.14 medium, 1.30 to 1.34 close, 1.51 closest; the room uses 1.05 to 1.28). Then 13 tl.fromTo
    calls give each b-roll picture a slow zoom from scale 1.02 to an end scale of 1.04 to 1.08 over its own length (88.3 s to 556.4 s).
  CUSTOMIZE: the film is driven by cut.json (aroll.look sets the presenter's look; the timings and framings come from the
    build). After a new build, set the music level again by running the direcfy skill's scripts/duck-under-voice.py on
    this file. Numbers that must change together: an a-NN slot's data-start and data-duration with the t and d of its
    row in P("#aroll") and in P("#room") (both lists use the same times); that slot's voice sound with its from and for
    values; the #root data-duration (571.267) with the end slot (data-start 562.967 plus data-duration 8.3). Visual knobs:
    #aroll filter (brightness 0.9, contrast 1.06, saturate 0.94), #room filter (brightness 0.56, contrast 1.14,
    saturate 0.64), the #shade gradient stops, the .clipvid frame (1280 x 720 at left 320, top 56, radius 34), and
    .brollvid.gray (black and white).
  MEDIA: no media file is bundled. Every slot below shows a labeled hatch stand-in, or silence, until you plug in a file.
    - Photo, img.backdrop in #room (z 1, no data-media-kind): the backdrop picture behind him, 3840 x 2160 scaled by
      0.5 to fill the frame. It was assets/backdrop.jpg. Shown now: a stand-in labeled assets/backdrop.jpg. Plug in: set
      the src of img.backdrop to your photo at that path, or to any 16:9 photo.
    - Presenter, 35 video slots img.aroll, a-00 to a-34, in #aroll (z 4): each showed a stretch of
      footage/aroll.subject.webm, the presenter cut out of his room, starting data-media-start seconds into the file and
      lasting data-duration seconds from data-start; the stretches run in order from 0 s to 560.6 s. Shown now: a
      stand-in labeled footage/aroll.subject.webm. Plug in: for each slot, replace the img with a video element that
      keeps its id, class and data attributes, for example one with id="a-00", class="aroll", data-start="0.0", data-duration="7.7333", data-media-start="0.0", data-track-index="0", data-media-kind="video", src set to your cut-out file, muted and playsinline, and repeat with each slot's own values. Use one cut-out file with transparency for
      all 35, so the room shows around him.
    - Clip pictures, 6 video slots img.clipvid in the root (z 6): v-5 (footage/c01.mp4, from 28.4666 s for 8.0 s), v-10
      (c02, 53.5333 s, 5.1 s), v-49 (c03, 221.7 s, 7.1 s), v-89 (c05, 450.8666 s, 7.2 s), v-93 (c04, 476.8 s, 6.9 s),
      v-103 (c06, 509.5666 s, 5.4 s). Each was a clip from someone else, shown in a rounded 1280 x 720 frame (.clipvid).
      Shown now: a stand-in in that frame, labeled with the clip path. Plug in: turn each img into a video element with
      its own id, class and data attributes, the same way as the presenter slots, with src set to your clip file. The
      sound comes from the matching voice-clip slot, so the video stays muted.
    - B-roll pictures, 13 video slots img.brollvid in the root (z 6): v-17 (footage/b10.mp4, 88.3 s, 3.9666 s), v-21
      (b04, 101.4333 s, 2.8 s), v-22 (b01, 104.2333 s, 5.0667 s, gray), v-23 (b08, 109.3 s, 3.3333 s), v-26 (b06,
      118.2666 s, 2.6667 s), v-31 (b12, 144.7 s, 1.7 s, gray), v-37 (b02, 170.1 s, 4.0 s), v-43 (b11, 190.5666 s,
      4.9334 s), v-50 (b13, 231.5666 s, 3.8334 s), v-69 (b03, 325.4666 s, 2.7 s), v-77 (b05, 378.7 s, 6.6333 s, gray),
      v-83 (b07, 412.9 s, 7.0 s), v-112 (b14, 556.4 s, 2.3333 s, gray). Each fills the frame (object-fit cover) and is
      dimmed by .brollvid; the gray ones use .brollvid.gray (black and white). Shown now: a stand-in. Plug in: as for the
      clip pictures, with src set to the file named in its data-media value. No sound slot is listed for them, so they
      play silent.
    - Voice, 13 sound slots voice-00 to voice-12 (SOUND SLOT comments, track 40 to 44, volume 1): each played
      footage/aroll.mp4, the presenter's own rough cut with his voice, which is not bundled. Shown now: silence. Plug in:
      add an audio element with the id and data values from its comment, for example one with id="voice-00", data-start="0.0", data-duration="11.2333", data-media-start="0.0", data-track-index="40" and data-volume="1", and src set to your recording of the same take.
    - Clip sound, 6 sound slots voice-clip-5 (for c01), voice-clip-10 (c02), voice-clip-49 (c03), voice-clip-89 (c05),
      voice-clip-93 (c04) and voice-clip-103 (c06): each played the sound of its clip at a volume of 0.25 to 1.07. Shown
      now: silence. Plug in: an audio element with the id and values from its comment, and src set to the clip's own
      audio file.
    - Music bed, 1 sound slot with the id bed: assets/audio/bed.mp3, the music under the whole film (from 0 s for 571.267 s,
      volume 1, track 70). Its volume lanes sat in data-automation on the old element and are not kept here. Shown now:
      silence. Plug in: an audio element with id="bed", src set to your music file, data-start="0", data-duration="571.267", data-track-index="70" and data-volume="1". Draw the volume dips again with the hyperframes-audio skill, or lower the bed under the
      voice with the direcfy skill's scripts/duck-under-voice.py.
    - Sound effects, 36 sound slots sfx-0 to sfx-35 (times, volumes and tracks are in their SOUND SLOT comments): sfx-0 to
      sfx-6 played assets/sfx/whoosh-short.mp3 (0.57 s each); sfx-7, sfx-12, sfx-16, sfx-21, sfx-25 and sfx-30 played
      assets/sfx/impact-bass-1.mp3 (1.9 s each); sfx-8 to sfx-10, sfx-13, sfx-14, sfx-17 to sfx-19, sfx-22, sfx-23,
      sfx-26 to sfx-28 and sfx-31 to sfx-34 played assets/sfx/typing.mp3 (0.22 to 1.0 s each, from 0.45 s into the file);
      sfx-11, sfx-15, sfx-20, sfx-24, sfx-29 and sfx-35 played assets/sfx/riser.mp3 (2.2 s each, from 0.82 s into the
      file). Shown now: silence. Plug in: one audio element per id, with its values from its comment and src set to your
      whoosh, impact, typing or riser file.
    - Font: none. This file sets no font and shows no words of its own; the text comes from the scenes.
    - CSS picture: none. No rule here uses url(); #room and #shade are a colour filter and a gradient.
  WHEN TO USE: a presenter explainer: a talking head dressed with text and pictures timed to his own words, in the deep
    tracery style (references/deep-tracery.md). For a narrated film without a presenter, use another style; to change one
    scene, edit its sub-composition rather than this file.
-->

    <!-- Styles: the stage, the presenter and room layers, the shade, and the frames of the picture and clip slots. -->
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; background: #050505; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050505; }
      /* The presenter: one wrapper that every punch-in moves; the clip under it is never touched.
         Cut out of his room he stands apart from the backdrop (#room), and what is behind him lies between the two. */
      #aroll, #room { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #aroll { filter: brightness(0.9) contrast(1.06) saturate(0.94); z-index: 4; }
      #room { filter: brightness(0.56) contrast(1.14) saturate(0.64); z-index: 1; }
      .aroll { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .backdrop { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; object-fit: cover; transform: scale(0.5); transform-origin: 0 0; }
      /* The room falls dark around him, so white type reads on any wall. */
      #shade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 62% 78% at 50% 42%, rgba(6, 5, 4, 0) 42%, rgba(6, 5, 4, 0.36) 74%, rgba(6, 5, 4, 0.7) 100%); }
      .brollvid { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 6; filter: brightness(0.62) contrast(1.1) saturate(0.9); }
      .brollvid.gray { filter: grayscale(1) brightness(0.55) contrast(1.2); }
      /* A clip from someone else: a rounded frame on black, as on an old television. */
      .clipvid { position: absolute; left: 320px; top: 56px; width: 1280px; height: 720px; object-fit: cover; border-radius: 34px; z-index: 6; filter: saturate(0.92) contrast(1.04); }
    </style>
