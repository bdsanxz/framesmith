<!doctype html>
<!--
  GUIDE: compositions/archduke.html (composition id "archduke")
  WHAT: Mounted at 7.27 s for 4.73 s, on the Cantonese narration's line naming the Archduke. The
    Archduke's printed cut-out whips in from the left at 7.27 s, smeared with motion blur, and lands
    with a slight tilt by 7.67 s. A hand-drawn teal stroke runs under it from 7.82 s, and a teal
    tape strip is pressed on at 7.8 s. The name 斐迪南大公 (Archduke Ferdinand) comes in out of focus at
    7.88 s and sharpens; its marker draws under 斐迪南 at 8.37 s. The role line 奧匈帝國皇位繼承人 (heir to the
    Austria-Hungary throne) starts typing at 9.66 s.
  STRUCTURE: Back to front: #ad-sea (the sea chart, mirrored with scaleX(-1)), #ad-land and #ad-card
    (torn paper pieces), #ad-person (the portrait wrapper; its img carries the blur tween),
    #ad-stroke (an SVG path drawn with a dash offset), #ad-tape, #ad-name (#ad-name-bg,
    #ad-name-text with the .ad-u span carrying the marker), and #ad-role (#ad-role-bg and
    #ad-role-text). All of them sit inside #ad-cam, which drifts. Timeline (local seconds): the
    portrait x -950 to 0 and rotation -5 to -1 over 0.4 s from 0; its image blur 22 px to 0 over 0.4
    s; the stroke at 0.55 s over 0.3 s; the tape at 0.53 s over 0.15 s; the name at 0.61 s over 0.3
    s (blur 10 px, scale 1.08 to 1); the marker at 1.1 s over 0.3 s; the role strip at 2.34 s and
    typing at 2.39 s (8 per second); the camera scales 1 to 1.05 over 4.73 s.
  CUSTOMIZE: Name: the text of #ad-name-text, the span around 斐迪南 with the marker and the 大公 after
    it. Role: the text of #ad-role-text. Colours: dusty-rose sea #d6a59a (#root background), land
    #e9d6cb, card #e4dcd7 with bar #36292f, name and role strips #fdfbfa, name ink #22141a, role ink
    #291a20, teal #2f9a86 for tape, stroke and marker, portrait shadow rgba(43, 8, 22, 0.4). Fonts:
    the name is Noto Sans HK at weight 900 (104 px) and the role is Noto Serif HK at weight 600 (40
    px); the subsets only hold the characters on screen. Positions match the English film: portrait
    110,150 px (866x1000), stroke 420,610 px, tape 1010,330 px, name 960,380 px, role 1000,560 px.
    Timings are local seconds in the script.
  MEDIA: No media file is bundled. This file has two photo slots and two font slots, and no sound or
    CSS image slot (the torn edges are an SVG filter, not an image). (1) Photo: the img inside #ad-person
    showed assets/generated/ff.png, a paper-sticker cut-out of the Archduke made from a public domain
    Wikimedia Commons photo with cutout.py and paper-cutout.py. It now shows a labeled hatch stand-in in
    the same 866 by 1000 px box. To plug in your own cut-out, set that img's src to your file (for example
    assets/generated/ff.png); a licensed portrait cut out to the same size with the paper border and shadow
    works too. (2) Photo: the img #ad-sea showed assets/generated/sea.jpg, a generated dusty-rose sea-chart
    paper texture. It now shows a labeled hatch stand-in, and the #d6a59a background of #root shows through.
    To plug in your own chart, set that img's src to your file. (3) Font: the @font-face for Noto Sans HK
    (weight 900, used by #ad-name-text) and (4) the @font-face for Noto Serif HK (weight 600, used by
    #ad-role-text) declare src: local() in place of the bundled subsets assets/fonts/noto-sans-hk-subset.woff2
    and assets/fonts/noto-serif-hk-subset.woff2. Without them the text falls back to sans-serif and serif. To
    plug in the files, put url("assets/fonts/noto-sans-hk-subset.woff2") format("woff2") in front of local() in
    the Noto Sans HK rule, and the matching serif file in the Noto Serif HK rule.
  WHEN TO USE: Introducing a person by a cut-out portrait with a name and a one-line role, when the
    sentence names them. Pick a different treatment for a group photo (cut-outs do not work well on
    crowds) or for a person whose role needs more than one line.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Chinese faces, declared with local() in place of the bundled subsets that held only the characters on screen. */
        @font-face { font-family: "Noto Sans HK"; font-style: normal; font-weight: 900; font-display: block; src: local("Noto Sans HK"); }
        @font-face { font-family: "Noto Serif HK"; font-style: normal; font-weight: 600; font-display: block; src: local("Noto Serif HK"); }
        /* The frame: the dusty-rose sea-chart ground, clipped to the stage. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #d6a59a; }
        /* The camera wrapper: the pieces move together, scaled from the point 1250px 460px. */
        #ad-cam { position: absolute; inset: 0; transform-origin: 1250px 460px; }
        /* The sea chart: an oversized image, mirrored, so the slow drift never shows an edge. */
        #ad-sea { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; transform: scaleX(-1); }
        /* Torn paper: the SVG turbulence filter displaces the edge of any piece marked .ad-torn. */
        .ad-torn { filter: url(#ad-tear); }
        /* The paper land strip and the blank card behind the portrait. */
        #ad-land { position: absolute; left: 1350px; top: 880px; width: 700px; height: 260px; background: #e9d6cb; transform: rotate(-3deg); }
        #ad-card { position: absolute; left: 1560px; top: 640px; width: 250px; height: 300px; background: #e4dcd7; transform: rotate(-4deg); }
        #ad-card::before { content: ""; position: absolute; left: 28px; top: 30px; width: 190px; height: 14px; background: #36292f; }
        /* The printed cut-out (paper-cutout.py): a paper shadow on the wrapper, motion blur on the image. */
        #ad-person { position: absolute; left: 110px; top: 150px; width: 866px; height: 1000px; filter: drop-shadow(10px 14px 12px rgba(43, 8, 22, 0.4)); }
        #ad-person img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 0; }
        /* The teal hand-drawn stroke: an SVG line drawn on with a dash offset. */
        #ad-stroke { position: absolute; left: 420px; top: 610px; width: 420px; height: 60px; overflow: visible; }
        /* The name: a paper strip with the Chinese name typed in it, and a marker under the first word. */
        #ad-name { position: absolute; left: 960px; top: 380px; transform: rotate(-2deg); }
        #ad-name-bg { position: absolute; inset: 0; background: #fdfbfa; box-shadow: 0 8px 14px rgba(51, 5, 25, 0.28); }
        #ad-name-text { position: relative; padding: 6px 30px 10px; font-family: "Noto Sans HK", sans-serif; font-weight: 900; font-size: 104px; line-height: 1.15; color: #22141a; white-space: nowrap; }
        .ad-u { position: relative; display: inline-block; }
        /* Marker underline: a rounded red bar wiped on from the left (an SVG stroke with pathLength
           breaks into dashes once the SVG is stretched, so a plain bar is the reliable mark). */
        .ad-mark { position: absolute; left: -6px; right: -6px; bottom: 2px; height: 10px; border-radius: 5px; background: #2f9a86; transform: rotate(-1.2deg); transform-origin: 0 50%; }
        /* The teal tape strip that holds the name strip in place. */
        #ad-tape { position: absolute; left: 1010px; top: 330px; width: 120px; height: 30px; background: #2f9a86; transform: rotate(-7deg); }
        /* The role: a smaller typed strip under the name. */
        #ad-role { position: absolute; left: 1000px; top: 560px; transform: rotate(-1deg); }
        #ad-role-bg { position: absolute; inset: 0; background: #fdfbfa; }
        #ad-role-text { position: relative; padding: 8px 18px; font-family: "Noto Serif HK", serif; font-weight: 600; font-size: 40px; line-height: 1.2; color: #291a20; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="archduke" data-width="1920" data-height="1080">
        <!-- The torn-edge filter used by the paper pieces. -->
        <svg width="0" height="0" style="position:absolute">
          <filter id="ad-tear"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="9" /><feDisplacementMap in="SourceGraphic" scale="14" /></filter>
        </svg>
        <div id="ad-cam" data-layout-allow-overflow>
          <img id="ad-sea" src="data:image/svg+xml,%3C!--sea.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'649' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/sea.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/sea.jpg" alt="" />
          <div id="ad-land" class="ad-torn"></div>
          <div id="ad-card" class="ad-torn"></div>
          <div id="ad-person" data-layout-allow-overflow><img src="data:image/svg+xml,%3C!--ff.png--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'630' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/ff.png%3C/text%3E%3C/svg%3E" data-media="assets/generated/ff.png" alt="" /></div>
          <svg id="ad-stroke" viewBox="0 0 420 60"><path d="M 6 40 C 120 22, 260 30, 414 14" fill="none" stroke="#2f9a86" stroke-width="14" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" /></svg>
          <div id="ad-tape"></div>
          <!-- The name strip: 斐迪南 with the marker, followed by 大公, on one paper strip. -->
          <div id="ad-name">
            <div id="ad-name-bg" class="ad-torn"></div>
            <div id="ad-name-text"><span class="ad-u">斐迪南<i class="ad-mark"></i></span>大公</div>
          </div>
          <!-- The role strip, typed on under the name. -->
          <div id="ad-role">
            <div id="ad-role-bg" class="ad-torn"></div>
            <div id="ad-role-text">奧匈帝國皇位繼承人</div>
          </div>
        </div>
      </div>
      <script>
        /* Setup: this scene's paused timeline. */
        const tl = gsap.timeline({ paused: true });
        /* Helper: types a text element one character at a time, from a start time and a rate. */
        function typeOn(sel, t, cps) {
          const el = document.querySelector(sel);
          const text = el.textContent;
          el.textContent = "";
          [...text].forEach((ch, i) => {
            const s = document.createElement("span");
            s.textContent = ch;
            s.style.display = "none";
            el.appendChild(s);
            tl.set(s, { display: "inline" }, t + i / cps);
          });
        }
        // The portrait whips in from the left, smeared with motion blur, and lands with a slight tilt.
        tl.fromTo("#ad-person", { x: -950, rotation: -5 }, { x: 0, rotation: -1, duration: 0.4, ease: "power3.out" }, 0);
        tl.fromTo("#ad-person img", { filter: "blur(22px)" }, { filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0);
        tl.to("#ad-stroke path", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.55);
        // The name arrives out of focus on 斐迪南 (7.88 s) and sharpens; tape first, then the strip.
        tl.fromTo("#ad-tape", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: "back.out(2)" }, 0.53);
        tl.fromTo("#ad-name", { opacity: 0, scale: 1.08, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 0.61);
        tl.fromTo("#ad-name .ad-mark", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.1);
        // The role types on with 奧匈帝國 (9.66 s), one character per spoken syllable.
        tl.fromTo("#ad-role", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 2.34);
        typeOn("#ad-role-text", 2.39, 8);
        tl.fromTo("#ad-cam", { scale: 1 }, { scale: 1.05, duration: 4.73, ease: "sine.inOut" }, 0);
        /* Registration: the host finds this timeline by the composition id "archduke". */
        window.__timelines["archduke"] = tl;
      </script>
    </template>
  </body>
</html>
