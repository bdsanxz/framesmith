<!doctype html>
<!--
  GUIDE: compositions/end.html (composition id "end")
  WHAT: The closing card, 2s long, mounted at 14s on track 0 by index.html. It lands on the final
    impact (the impact-bass-1 tag at 13.88s, peaking at 14.0s). On a full green frame, the
    heavy black line "EVERY SOUND GETS ITS MOMENT." slams in from 1.25 times its size and fades
    in over 0.25s, then holds until the piece ends at 16s.
  STRUCTURE: #root (absolute, full frame, #3CE6AC background, centred flex) holds #end-line
    (130px, weight 900, black, centred, max-width 1500px, line-height 0.95). Timeline: one
    tl.fromTo on #end-line from scale 1.25 and opacity 0 to scale 1 and opacity 1, 0.25s,
    expo.out, starting at 0. After that tween the text holds still.
  CUSTOMIZE: The line is the text inside #end-line; keep it under 1500px wide or let it wrap. The
    colours are #3CE6AC for the background and #000000 for the text; the size is 130px. The hit
    timing is the 0.25s duration and the start at 0; the final sound is placed in index.html
    (sfx-impact-end at 13.88), so move the two together. The font is Inter, one of the fonts
    HyperFrames bundles, so no font file is needed.
  MEDIA: No media file is bundled. The file has no slots: the card is text on a colour, with no picture,
    video or font file. The closing impact sound is played by index.html, not by this file. Inter is named
    in the root's font stack, and HyperFrames bundles it, so nothing is to be plugged in here.
  WHEN TO USE: A closing slogan or title card that should land on the last sound hit of a
    piece. Pick another ending when the piece has no final hit or when the close needs several
    lines of text.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Stage: full green frame with the end line centred on it. */
        #root { position: absolute; inset: 0; background: #3CE6AC; display: flex; align-items: center; justify-content: center; font-family: "Inter", sans-serif; }
        /* End line: heavy black centred type, wrapping inside 1500px. */
        #end-line { font-size: 130px; font-weight: 900; letter-spacing: -0.04em; color: #000000; text-align: center; line-height: 0.95; max-width: 1500px; }
      </style>
      <!-- Root stage for this composition, sized 1920x1080 for the host. -->
      <div id="root" data-composition-id="end" data-width="1920" data-height="1080">
        <!-- The closing line, slammed in by the single tween in the script. -->
        <div id="end-line">EVERY SOUND GETS ITS MOMENT.</div>
      </div>
      <script>
        /* Setup: one paused GSAP timeline that the host seeks. */
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#end-line", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "expo.out" }, 0);
        /* Register the timeline under the composition id so the host can find and seek it. */
        window.__timelines["end"] = tl;
      </script>
    </template>
  </body>
</html>
