<!doctype html>
<!--
  GUIDE: compositions/c3-01-physicians.html (composition id "c3-01-physicians")
  WHAT: Beat 1 of chapter 3, on the physicians. The narration (Indonesian "Menurut Waller, para
    tabib ...") says the physicians ruled out the stars and named a natural illness of overheated
    blood. For 2.42 s the picture is an engraving of surgeons from Brunschwig's Cirurgia (Strasbourg,
    1497). It then cuts to a zodiac man from Reisch's Margarita philosophica (1503), with a caption
    naming the source. The beat runs 5.94 s; index.html mounts it at 294.8 s, under narration clip
    voice-s31.
  STRUCTURE: Two stacked layers in #root, back to front: #c301physicians-a (the surgeons, an img from
    cirurgia-close.jpg) and #c301physicians-b (the zodiac man, zodiac.jpg). Each is a .dr-shot wrapper,
    so the push runs on the wrapper and the grade on the image. The caption #c301physicians-b-cap is
    a sibling of the layers. The timeline (window.__timelines["c3-01-physicians"]) pushes layer a
    from scale 1.014 to 1.056 over 2.42 s. At 2.42 s layer b is cut in (opacity 0 to 1 over 0.001 s),
    the caption appears with it, and layer b pushes from 1.014 to 1.073 over 3.52 s.
  CUSTOMIZE: Each picture's file is named by data-media on its img (#c301physicians-a-img and
    #c301physicians-b-img); set the src to swap in your own (see MEDIA). The caption is
    the two lines inside #c301physicians-b-cap, split by the br tag; its place comes from .dr-cap (left
    207 px, top 800 px, 30 px Arimo). The cut time 2.42 s appears in the length of the first push, the
    start of the second push, and both cut-in tweens; change them together. The total is the 5.94 s
    data-duration in index.html. The push sizes are the scale values in the two fromTo calls. The grade
    is each img's data-color-grading JSON; the zodiac adds exposure -0.25 so its caption can be read.
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. It has no sound, no
    video and no CSS image.
    1. The surgeons, img #c301physicians-a-img (inside #c301physicians-a, shown 0 to 2.42 s). It showed an
       engraving of surgeons from Brunschwig's Cirurgia (Strasbourg, 1497). It now shows a faint hatch
       stand-in labeled "PHOTO: assets/generated/cirurgia-close.jpg". To plug in your picture, set the img's
       src to your file (for example assets/generated/cirurgia-close.jpg). The data-media attribute only names
       the expected path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The zodiac man, img #c301physicians-b-img (inside #c301physicians-b, cut in at 2.42 s, with the caption
       #c301physicians-b-cap). It showed a zodiac man from Reisch's Margarita philosophica (1503). It now shows
       a stand-in labeled "PHOTO: assets/generated/zodiac.jpg". To plug in your picture, set the img's src to
       your file. Its grade adds exposure -0.25 so the caption reads.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap. It was a bundled woff2 file
       (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it is installed,
       otherwise the sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: a two-picture beat where the second picture's source must be named on screen, cut in on
    a word of the narration. Pick another pattern for one picture (use c3-02), a diagram (c3-03), or a
    film clip (c3-09).
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* The caption font, Arimo, is read from the installed fonts with local("Arimo"); no font file is bundled. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        /* The root is the 1920 by 1080 frame in dark slate (#0f1518), behind every layer. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* The caption: where the picture comes from, two plain white lines. */
        .dr-cap { position: absolute; left: 207px; top: 800px; font-family: "Arimo", sans-serif; font-weight: 400; font-size: 30px; line-height: 38px; color: #eef1ee; text-shadow: 0 0 4px #0a0c0d, 0 0 9px #0a0c0d, 0 0 18px #0a0c0d, 0 0 34px rgba(10, 12, 13, 0.85); white-space: nowrap; }
      </style>
      <!-- "Menurut Waller, para tabib ..." (294.80 s): cirurgia-close from the start; zodiac + caption on "penjelasan" (297.22 s). -->
      <div id="root" data-composition-id="c3-01-physicians" data-width="1920" data-height="1080">
        <!-- Layers 1 and 2 are stacked: the surgeons first, then the zodiac man, cut in at 2.42 s with its caption. -->
        <div class="dr-shot" id="c301physicians-a" data-layout-allow-overflow><img id="c301physicians-a-img" src="data:image/svg+xml,%3C!--cirurgia-close.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'858' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/cirurgia-close.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/cirurgia-close.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-shot" id="c301physicians-b" data-layout-allow-overflow><img id="c301physicians-b-img" src="data:image/svg+xml,%3C!--zodiac.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'706' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/zodiac.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/zodiac.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05,"exposure":-0.25},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-cap" id="c301physicians-b-cap">Manusia zodiak<br />Gregor Reisch, Margarita philosophica, 1503</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        /* Phase 1, 0 to 2.42 s: the surgeons' still pushes in; phase 2 cuts in the zodiac man and its caption at 2.42 s and pushes it on. */
        tl.fromTo("#c301physicians-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.056, x: 6, y: -2, duration: 2.42, ease: "none" }, 0.0);
        tl.fromTo("#c301physicians-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.073, x: -5, y: 3, duration: 3.52, ease: "none" }, 2.42);
        gsap.set("#c301physicians-b", { opacity: 0 });
        tl.to("#c301physicians-b", { opacity: 1, duration: 0.001 }, 2.42);
        gsap.set("#c301physicians-b-cap", { opacity: 0 });
        tl.to("#c301physicians-b-cap", { opacity: 1, duration: 0.001 }, 2.42);
        window.__timelines["c3-01-physicians"] = tl;
      </script>
    </template>
  </body>
</html>
