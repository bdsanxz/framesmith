<!doctype html>
<!--
  GUIDE: compositions/c2-12-must-cure.html (composition id "c2-12-must-cure")
  WHAT: The twelfth and last beat of chapter 2, 4.14 s, from 286.46 s in index.html, narrated by segment s30
    (opening "Dan bagi dewan kota", and for the city council). A single picture, schilling, pushes slowly
    for the whole beat, with the caption "Sidang dewan kota Luzern" (session of the Lucerne city council)
    and "Kronik Diebold Schilling, 1513" (chronicle of Diebold Schilling, 1513). The caption is shown from
    the start and stays to the end.
  STRUCTURE: #root holds one .dr-shot wrapper, #c212mustcure-a, and the caption #c212mustcure-a-cap (.dr-cap).
    The timeline has one tween: the picture pushes from scale 1.014 to 1.082 over 4.14 s from time 0. The
    caption has no tween, so it stays visible throughout.
  CUSTOMIZE: the picture's file is named by data-media on #c212mustcure-a-img (schilling.jpg); set its src to
    swap in your own (see MEDIA). The caption text is the two
    lines in #c212mustcure-a-cap; its position is in .dr-cap (left 207 px, top 800 px). The push amounts are in
    the tween; keep its duration equal to data-duration (4.14 in index.html). Grade is in data-color-grading.
  MEDIA: no media file is bundled. This file has one photo slot and one font slot. It has no sound, no
    video and no CSS image.
    1. The picture, img #c212mustcure-a-img (inside #c212mustcure-a, held for the whole 4.14 s). It showed
       the picture of a council session from the 1513 chronicle of Diebold Schilling (schilling.jpg). It now
       shows a faint hatch stand-in labeled "PHOTO: assets/generated/schilling.jpg". To plug in your picture,
       set the img's src to your file (for example assets/generated/schilling.jpg). The data-media attribute
       only names the expected path; it loads nothing. The img's data-color-grading still grades your picture.
       Keep the caption's credit to the 1513 chronicle of Diebold Schilling.
    2. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap for the caption. It was a
       bundled woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it
       is installed, otherwise the sans-serif fallback of the font stack. To plug in your font, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: a one-picture closing beat with a source caption, such as the last beat of a section. Pick
    another pattern when the beat needs cuts or a figure.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* The font: Arimo, read from the installed fonts with local("Arimo") for the caption; no font file is bundled. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* The caption: where the picture comes from, two plain white lines. */
        .dr-cap { position: absolute; left: 207px; top: 800px; font-family: "Arimo", sans-serif; font-weight: 400; font-size: 30px; line-height: 38px; color: #eef1ee; text-shadow: 0 0 4px #0a0c0d, 0 0 9px #0a0c0d, 0 0 18px #0a0c0d, 0 0 34px rgba(10, 12, 13, 0.85); white-space: nowrap; }
      </style>
      <!-- "Dan bagi dewan kota, ..." (286.46 s): schilling + caption from the start. -->
      <div id="root" data-composition-id="c2-12-must-cure" data-width="1920" data-height="1080">

        <div class="dr-shot" id="c212mustcure-a" data-layout-allow-overflow><img id="c212mustcure-a-img" src="data:image/svg+xml,%3C!--schilling.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'763' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/schilling.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/schilling.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <!-- The source caption, shown for the whole beat. -->
        <div class="dr-cap" id="c212mustcure-a-cap">Sidang dewan kota Luzern<br />Kronik Diebold Schilling, 1513</div>
      </div>
      <script>
        /* Timeline: one push across the whole 4.14 s beat. */
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#c212mustcure-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.082, x: 6, y: -2, duration: 4.14, ease: "none" }, 0.0);
        window.__timelines["c2-12-must-cure"] = tl;
      </script>
    </template>
  </body>
</html>
