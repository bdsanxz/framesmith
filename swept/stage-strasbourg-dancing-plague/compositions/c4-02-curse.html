<!doctype html>
<!--

  WHAT: A ten-second beat with no words on screen: three stills, each a hard cut from the one
    before. It opens on a cathedral picture (civ-cathedral.jpg) pushed slowly in. At 4.46
    seconds it cuts to a Saint Vitus carving (vitus-kettle.jpg) on the narration word "kutukan"
    (curse), and at 6.69 seconds it cuts to a grotto picture (grotto2.jpg) on "Karena"
    (because). It plays from 410.82 seconds in index.html, in chapter 4 just after the question
    of c4-01, and lasts 10.02 seconds.
  STRUCTURE: Three img layers, each in its own .dr-shot wrapper, stacked in source order:
    #c402curse-a at the back, then #c402curse-b and #c402curse-c. Layers b and c are set to
    opacity 0 at the start and shown at their cut times with a 0.001 second tween. Timeline: a
    scales 1.014 to 1.087 with a small x and y drift from 0 to 4.46 seconds; b scales 1.014 to
    1.053 from 4.46 for 2.23 seconds; c scales 1.014 to 1.070 from 6.69 for 3.33 seconds. There
    is no text, no marker and no transition.
  CUSTOMIZE: Each picture's file is named by data-media on the img tags with ids c402curse-a-img,
    c402curse-b-img and c402curse-c-img; set the src of each to swap in your own (see MEDIA). The cut times 4.46 and 6.69 seconds are in the tl

    data-duration of c4-02-curse-slot in index.html. Each push is set by its scale end values
    and its x and y offsets. The grade is each img's data-color-grading attribute: contrast 0.1,
    saturation -0.32, blacks -0.22, temperature -0.05, a teal shadow tint, a warm highlight
    tint, vignette 0.2 and grain 0.08. The Arimo font is declared but unused, since the file has
    no text.
  MEDIA: no media file is bundled. This file has three photo slots and one font slot. It has no sound, no
    video and no CSS image.
    1. The cathedral picture, img #c402curse-a-img (inside #c402curse-a, shown from the start to 4.46 seconds).
       It showed a picture of the cathedral (civ-cathedral.jpg). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/civ-cathedral.jpg". To plug in your picture, set the img's src to your file (for
       example assets/generated/civ-cathedral.jpg). The data-media attribute only names the expected path; it
       loads nothing. The img's data-color-grading still grades your picture.
    2. The Saint Vitus carving, img #c402curse-b-img (inside #c402curse-b, cut in at 4.46 seconds). It showed a
       Saint Vitus carving in a kettle (about 1500) (vitus-kettle.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/vitus-kettle.jpg". To plug in your picture, set the img's src to your file.
    3. The grotto picture, img #c402curse-c-img (inside #c402curse-c, cut in at 6.69 seconds). It showed the grotto
       lithograph of 1828 (grotto2.jpg). It now shows a stand-in labeled "PHOTO: assets/generated/grotto2.jpg". To
       plug in your picture, set the img's src to your file.
    4. The font, the @font-face for "Arimo" (weights 400 to 700). No element in this file uses it, so nothing is
       drawn with it and no file is needed. If you add text, add url("your-font.woff2") format("woff2") to the src
       list of that @font-face.
  WHEN TO USE: a sentence answered by three pictures in turn, cut on the words, with no
    caption. Pick a layout with a caption (see c4-03 or c4-06) when the viewer needs a name or
    a source.
-->
