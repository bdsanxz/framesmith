<!doctype html>
<!--
  GUIDE: compositions/c2-08-deaths.html (composition id "c2-08-deaths")
  WHAT: The eighth beat of chapter 2, 6.42 s, from 253.1 s in index.html, narrated by segment s26
    (opening "Satu kronik bahkan menyebut", one chronicle even names). A picture, deathdance2, is shown
    from 0 to 3.92 s with a slow push. Then stras-wide2, a wide picture, is cut in at 3.92 s with the
    red figure "15 kematian sehari menurut satu kronik" (15 deaths a day according to one chronicle)
    set over it in two lines.
  STRUCTURE: #root holds two .dr-shot wrappers, #c208deaths-a and #c208deaths-b, and the red figure
    #c208deaths-b-fig (.dr-figure, a full-width text box). The timeline pushes picture a from scale
    1.014 to 1.079 over 3.92 s. At 3.92 s picture b is cut in by opacity and pushes over 2.5 s, and the
    figure is shown at the same moment.
  CUSTOMIZE: each picture's file is named by data-media on its img (deathdance2.jpg, stras-wide2.jpg); set
    the src to swap in your own (see MEDIA). The figure
    text is its two lines (br). Its height is the inline top 84 px, and its position is the inline left
    -440 px: the box is 1920 px wide, so the text centres near x 520 instead of the frame centre. Change
    left to move it. Colour and glow are in .dr-figure. The cut time 3.92 appears in several tweens; change
    them together and keep the end inside data-duration (6.42 in index.html).
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. It has no sound, no
    video and no CSS image.
    1. The first picture, img #c208deaths-a-img (inside #c208deaths-a, shown 0 to 3.92 s). It showed a dance
       picture (deathdance2.jpg). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/deathdance2.jpg". To plug in your picture, set the img's src to your file (for
       example assets/generated/deathdance2.jpg). The data-media attribute only names the expected path; it
       loads nothing. The img's data-color-grading still grades your picture.
    2. The wide picture, img #c208deaths-b-img (inside #c208deaths-b, cut in at 3.92 s, under the red figure
       #c208deaths-b-fig, which is plain text). It showed a wide picture (stras-wide2.jpg). It now shows a
       stand-in labeled "PHOTO: assets/generated/stras-wide2.jpg". To plug in your picture, set the img's src
       to your file.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-figure for the red figure. It was
       a bundled font file. It now reads local("Arimo"): the face is used if it is installed, otherwise the
       sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: a picture beat with one red number over a second picture, the same pattern as the first
    beat of chapter 2 (c2-01-begins.html). Pick another pattern when the figure must sit beside the
    people shown, or the picture needs motion.
-->
