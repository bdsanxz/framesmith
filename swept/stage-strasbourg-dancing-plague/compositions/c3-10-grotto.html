<!doctype html>
<!--
  GUIDE: compositions/c3-10-grotto.html (composition id "c3-10-grotto")
  WHAT: Beat 10 of chapter 3, on the shrine. The narration (Indonesian "Di sana, di sebuah ...") places the
    story at the shrine above Saverne. Three pictures follow each other: Müller's drawing of the Saint Vitus
    chapel near Saverne (about 1820) from 0 s; the grotto lithograph of 1828 cut in at 3.13 s, captioned
    until 4.95 s; and a carved Saint Vitus group from the Saverne chapel (about 1518) cut in at 4.95 s with
    its own caption. The beat runs 7.22 s; index.html mounts it at 374.5 s, under narration clip voice-s40.
  STRUCTURE: Three stacked layers in #root, back to front: #c310grotto-a (chapel2.jpg), #c310grotto-b
    (grotto.jpg, caption #c310grotto-b-cap) and #c310grotto-c (statue.jpg, caption #c310grotto-c-cap). Each
    is a .dr-shot wrapper. The timeline (window.__timelines["c3-10-grotto"]) pushes layer a from 1.014 to
    1.067 over 3.13 s. At 3.13 s it cuts in layer b with its caption and pushes it from 1.014 to 1.046 over
    1.82 s; the caption is hidden at 4.95 s. At 4.95 s it cuts in layer c with its caption and pushes it
    from 1.014 to 1.053 over 2.27 s.
  CUSTOMIZE: Each picture's file is named by data-media on its img tag (chapel2.jpg, grotto.jpg, statue.jpg);
    set the src to swap in your own (see MEDIA). The captions are the two lines in each caption
    div, split by br. The caption places come from .dr-cap (left 207 px, top 800 px, 30 px Arimo). The cut
    times 3.13 and 4.95 must match the ends of the layers before them, and the caption end at 4.95 is its own
    tween, so change them together. The total is the 7.22 s data-duration in index.html.
  MEDIA: no media file is bundled. This file has three photo slots and one font slot. It has no sound, no
    video and no CSS image.
    1. Müller's drawing of the chapel, img #c310grotto-a-img (inside #c310grotto-a, shown 0 to 3.13 s). It showed
       the Saint Vitus chapel near Saverne (about 1820) (chapel2.jpg). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/chapel2.jpg". To plug in your picture, set the img's src to your file (for example
       assets/generated/chapel2.jpg). The data-media attribute only names the expected path; it loads nothing. The
       img's data-color-grading still grades your picture.
    2. The grotto lithograph, img #c310grotto-b-img (inside #c310grotto-b, cut in at 3.13 s, with the caption
       #c310grotto-b-cap until 4.95 s). It showed the grotto lithograph of 1828 (grotto.jpg). It now shows a stand-in
       labeled "PHOTO: assets/generated/grotto.jpg". To plug in your picture, set the img's src to your file.
    3. The carved group, img #c310grotto-c-img (inside #c310grotto-c, cut in at 4.95 s, with the caption
       #c310grotto-c-cap). It showed the carved Saint Vitus group from the Saverne chapel (about 1518) (statue.jpg).
       It now shows a stand-in labeled "PHOTO: assets/generated/statue.jpg". To plug in your picture, set the img's
       src to your file. Whether this carving is the one the dancers stood under is not known, so the caption does
       not claim it.
    4. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap for both captions. It was a bundled
       woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it is installed,
       otherwise the sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: a place followed by two of its objects, each captioned with its source, for a shrine or a
    building. Pick c3-01 for one picture with a caption.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* The caption font, Arimo, is read from the installed fonts with local("Arimo"); no font file is bundled. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        /* The root is the 1920 by 1080 frame in dark slate (#0f1518), behind every layer. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* The caption: where the picture comes from, two plain white lines. */
        .dr-cap { position: absolute; left: 207px; top: 800px; font-family: "Arimo", sans-serif; font-weight: 400; font-size: 30px; line-height: 38px; color: #eef1ee; text-shadow: 0 0 4px #0a0c0d, 0 0 9px #0a0c0d, 0 0 18px #0a0c0d, 0 0 34px rgba(10, 12, 13, 0.85); white-space: nowrap; }
      </style>
      <!-- "Di sana, di sebuah ..." (374.50 s): chapel2 from the start; grotto + caption on "para" (377.63 s); statue + caption on "patung" (379.45 s). -->
      <div id="root" data-composition-id="c3-10-grotto" data-width="1920" data-height="1080">
        <!-- Layers 1 to 3 are stacked in order; the grotto and the carving each carry a caption while they are shown. -->
        <div class="dr-shot" id="c310grotto-a" data-layout-allow-overflow><img id="c310grotto-a-img" src="data:image/svg+xml,%3C!--chapel2.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'725' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/chapel2.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/chapel2.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-shot" id="c310grotto-b" data-layout-allow-overflow><img id="c310grotto-b-img" src="data:image/svg+xml,%3C!--grotto.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'706' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/grotto.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/grotto.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-cap" id="c310grotto-b-cap">Gua Santo Vitus di atas Saverne<br />Litografi Arnout dan Bichebois, 1828</div>
        <div class="dr-shot" id="c310grotto-c" data-layout-allow-overflow><img id="c310grotto-c-img" src="data:image/svg+xml,%3C!--statue.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'706' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/statue.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/statue.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-cap" id="c310grotto-c-cap">Santo Vitus dalam kuali (kanan)<br />Ukiran kayu dari kapel Saverne, sekitar 1518</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        /* Phase 1, 0 to 3.13 s: the chapel still pushes in; phase 2 cuts in the grotto with its caption at 3.13 s, and the caption ends at 4.95 s. */
        /* Phase 3, from 4.95 s: the carved group is cut in with its own caption and pushes to the end of the beat. */
        tl.fromTo("#c310grotto-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.067, x: 6, y: -2, duration: 3.13, ease: "none" }, 0.0);
        tl.fromTo("#c310grotto-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.046, x: -5, y: 3, duration: 1.82, ease: "none" }, 3.13);
        gsap.set("#c310grotto-b", { opacity: 0 });
        tl.to("#c310grotto-b", { opacity: 1, duration: 0.001 }, 3.13);
        gsap.set("#c310grotto-b-cap", { opacity: 0 });
        tl.to("#c310grotto-b-cap", { opacity: 1, duration: 0.001 }, 3.13);
        tl.to("#c310grotto-b-cap", { opacity: 0, duration: 0.001 }, 4.95);
        tl.fromTo("#c310grotto-c", { scale: 1.014, x: -4, y: -3 }, { scale: 1.053, x: 4, y: 3, duration: 2.27, ease: "none" }, 4.95);
        gsap.set("#c310grotto-c", { opacity: 0 });
        tl.to("#c310grotto-c", { opacity: 1, duration: 0.001 }, 4.95);
        gsap.set("#c310grotto-c-cap", { opacity: 0 });
        tl.to("#c310grotto-c-cap", { opacity: 1, duration: 0.001 }, 4.95);
        window.__timelines["c3-10-grotto"] = tl;
      </script>
    </template>
  </body>
</html>
