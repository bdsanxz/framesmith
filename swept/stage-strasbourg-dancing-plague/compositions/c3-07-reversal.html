<!doctype html>
<!--
  GUIDE: compositions/c3-07-reversal.html (composition id "c3-07-reversal")
  WHAT: Beat 7 of chapter 3, on the council's change of course. The narration (Indonesian "Dewan pun
    berbalik arah ...") says the council turned round. Three stills follow each other without captions:
    the council of Lucerne in Schilling's chronicle (1513) from 0 s, Amman's carpenter (1568) cut in at
    2.72 s, and Hondius's bagpipers plate (1642) cut in at 4.21 s. The first picture is Lucerne's council,
    not Strasbourg's, because no picture of Strasbourg's council was found. The beat runs 8.66 s;
    index.html mounts it at 347.4 s, under narration clip voice-s37.
  STRUCTURE: Three stacked layers in #root, back to front: #c307reversal-a (schilling-close.jpg), -b
    (carpenter2.jpg) and -c (piper-left.jpg). Each is a .dr-shot wrapper. The timeline
    (window.__timelines["c3-07-reversal"]) pushes layer a from 1.014 to 1.060 over 2.72 s. It cuts in layer
    b at 2.72 s and pushes it to 1.041 over 1.49 s, then cuts in layer c at 4.21 s and pushes it to 1.087
    over 4.45 s.
  CUSTOMIZE: Each picture's file is named by data-media on its img tag (schilling-close.jpg, carpenter2.jpg,
    piper-left.jpg); set the src to swap in your own (see MEDIA). The push sizes are the scale values in
    the three fromTo calls. The cut times 2.72 and 4.21 must match the ends of the layers before them (2.72
    plus 1.49 is 4.21), and the total is the 8.66 s data-duration in index.html. The grade is the
    data-color-grading JSON on each img. There are no caption divs here; to add one, copy the .dr-cap rule and
    markup from c3-01-physicians.html.
  MEDIA: no media file is bundled. This file has three photo slots. It has no sound, no video and no CSS
    image. The Arimo font is declared, but no element uses it, so no font file is needed.
    1. The council, img #c307reversal-a-img (inside #c307reversal-a, shown 0 to 2.72 s). It showed the council
       of Lucerne in Schilling's chronicle (1513). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/schilling-close.jpg". To plug in your picture, set the img's src to your file
       (for example assets/generated/schilling-close.jpg). The data-media attribute only names the expected
       path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The carpenter, img #c307reversal-b-img (inside #c307reversal-b, cut in at 2.72 s). It showed Amman's
       carpenter (1568). It now shows a stand-in labeled "PHOTO: assets/generated/carpenter2.jpg". To plug in
       your picture, set the img's src to your file.
    3. The bagpipers, img #c307reversal-c-img (inside #c307reversal-c, cut in at 4.21 s). It showed Hondius's
       bagpipers plate (1642). It now shows a stand-in labeled "PHOTO: assets/generated/piper-left.jpg". To plug
       in your picture, set the img's src to your file.
  WHEN TO USE: a sequence of three stills that are not sourced on screen, for a beat that only needs pictures
    of people and a council. Pick c3-01 when the source must be named.
-->
