<!doctype html>
<!--
  GUIDE: compositions/c1-09-omens.html (composition id "c1-09-omens")
  WHAT: A beat on the omens and the disasters that people read as signs. It opens on a stock clip of
    clouds crossing the sky, then cuts to two pictures of Durer's Opening of the Fifth and Sixth
    Seals (about 1497): seals-people.jpg at 2.02 s and seals-top.jpg at 4.31 s.
    Each shot pushes slowly. It runs 7.86 s; index.html mounts it as c1-09-omens-slot at
    144.72 s.
  STRUCTURE: three .dr-shot wrappers in document order: #c109omens-a (the clouds clip, a video slot that is now a still stand-in),
    #c109omens-b (seals-people.jpg) and #c109omens-c (seals-top.jpg). No text sits over them. The
    paused GSAP timeline, registered as window.__timelines["c1-09-omens"], pushes the clip from 0 s
    (scale 1.0 to 1.035 over 2.02 s); at 2.02 s it shows the people picture and pushes it (scale
    1.014 to 1.053 over 2.29 s); at 4.31 s it shows the top picture and pushes it (scale 1.014 to
    1.073 over 3.55 s). Each picture covers the one before it.
  CUSTOMIZE: the cut times 2.02 and 4.31 and the push amounts are in the tweens. The video's
    data-duration (2.02) must match the first tween and the cut to the people picture. The last tween
    ends at 7.86 s, which must match the data-duration that index.html gives c1-09-omens-slot. The
    clip's grade and the two pictures' grades are the data-color-grading JSON on each element. There
    is no caption here; a caption would be a copy of the .dr-cap rule from c1-05-hardship.html.
  MEDIA: no media file is bundled. This file has one video slot, two photo slots and one font slot.
    It has no sound and no CSS image.
    1. The clouds clip, the video slot img #c109omens-a-video (inside #c109omens-a, on screen from 0 s for
       2.02 s; data-start 0.0, data-duration 2.02, data-track-index 1, data-media-kind="video"). It showed
       a stock clip of clouds crossing the sky (footage/v02.mp4), muted. It now shows a faint hatch
       stand-in labeled "VIDEO: footage/v02.mp4", which does not move. To plug in your clip, turn this img
       back into a video element with src set to your file, muted and playsinline. Keep the id c109omens-a-video, the data-start, data-duration and data-track-index attributes,
       the data-color-grading attribute and data-media-kind="video", so the [data-media-kind="video"] CSS
       rule still matches. Set the clip's length to the data-duration (2.02 s) and keep the tween.
    2. The people picture, img #c109omens-b-img (inside #c109omens-b, which cuts in at 2.02 s). It showed
       Durer's Opening of the Fifth and Sixth Seals (about 1497), the people part. It now shows a stand-in
       labeled "PHOTO: assets/generated/seals-people.jpg". To plug in your picture, set the img's src to
       your file (for example assets/generated/seals-people.jpg). The data-media attribute only names the
       expected path; it loads nothing. The img's data-color-grading still grades your picture.
    3. The top picture, img #c109omens-c-img (inside #c109omens-c, which cuts in at 4.31 s). It showed the
       top part of the same woodcut. It now shows a stand-in labeled "PHOTO: assets/generated/seals-top.jpg".
       To plug in your picture, set the img's src to your file.
    4. The font, the @font-face for "Arimo" (weights 400 to 700). No element in this file uses it, so
       nothing is drawn with it and no file is needed. If you add a caption, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: a beat about signs, weather or a disaster, with a sky or a clip first and then pictures
    of the scene. Pick another composition when the beat needs a caption or a dated source.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>

        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }

        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }

      </div>
      <script>
        /* The timeline: the clip push, then the two seals pictures, each cut in and pushed. */
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#c109omens-a", { scale: 1.0 }, { scale: 1.035, duration: 2.02, ease: "none" }, 0.0);
        tl.fromTo("#c109omens-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.053, x: -5, y: 3, duration: 2.29, ease: "none" }, 2.02);

        gsap.set("#c109omens-c", { opacity: 0 });
        tl.to("#c109omens-c", { opacity: 1, duration: 0.001 }, 4.31);
        window.__timelines["c1-09-omens"] = tl;
