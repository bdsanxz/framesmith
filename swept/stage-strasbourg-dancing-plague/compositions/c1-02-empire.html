<!doctype html>
<!--
  GUIDE: compositions/c1-02-empire.html (composition id "c1-02-empire")
  WHAT: The second beat of chapter 1, on Strasbourg's place in the empire. It opens on a picture of
    Maximilian I with the lower third "Maximilian I" and "Kaisar Romawi Suci" (Holy Roman Emperor).
    At 3.45 s it cuts to a plan of the city (civ-north.jpg), and at 5.26 s to a city view from the
    Nuremberg Chronicle with the red year 1262 over it. It runs 8.34 s; index.html mounts it as
    c1-02-empire-slot at 83.22 s.
  STRUCTURE: back to front by id: #c102empire-a (the portrait, with the lower third #c102empire-a-l3
    on top), #c102empire-b (the plan), #c102empire-c (the city view) and #c102empire-c-name (the red
    year, a .dr-name). The paused GSAP timeline, registered as window.__timelines["c1-02-empire"],
    pushes the portrait from 0 s (scale 1.014 to 1.071 over 3.45 s) and hides the lower third at
    3.45 s. It pushes the plan from 3.45 s (to 1.046 over 1.81 s), then from 5.26 s pushes the city
    view (to 1.066 over 3.08 s) and shows the red year.
  CUSTOMIZE: the lower third text is in the markup: "Maximilian I" (bold, 44 px) and "Kaisar Romawi
    Suci, 1508-1519" (italic, 30 px). Its place is left 207 px and top 826 px in the .dr-l3 rule, and
    its colour is #f04a2e. The red year is the text "1262" with top 600 px and font-size 250 px set
    inline; its colour comes from .dr-name. The push amounts and the cut times 3.45 and 5.26 are in
    the tweens. The last tween ends at 8.34 s, which must match the data-duration that index.html
    gives c1-02-empire-slot. Each picture's grade is the data-color-grading JSON on its img.
  MEDIA: no media file is bundled. This file has three photo slots and one font slot. It has no sound
    and no CSS image.
    1. The portrait, img #c102empire-a-img (inside #c102empire-a, under the lower third). It showed a
       portrait of Maximilian I (Durer, 1519). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/maximilian.jpg". To plug in your picture, set the img's src to your file
       (for example assets/generated/maximilian.jpg). The data-media attribute only names the expected
       path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The plan, img #c102empire-b-img (inside #c102empire-b, which cuts in at 3.45 s). It showed the
       Braun and Hogenberg plan of Strasbourg (1572). It now shows a stand-in labeled
       "PHOTO: assets/generated/civ-north.jpg". To plug in your picture, set the img's src to your file.
    3. The city view, img #c102empire-c-img (inside #c102empire-c, which cuts in at 5.26 s). It showed
       Strasbourg in the Nuremberg Chronicle (1493). It now shows a stand-in labeled
       "PHOTO: assets/generated/stras-city2.jpg". To plug in your picture, set the img's src to your file.
    4. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-name and .dr-l3. It was a
       bundled font file. It now reads local("Arimo"): the face is used if it is installed, otherwise the
       sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
    The red year and the lower third are plain text and need no file.
  WHEN TO USE: a beat that names a ruler, then shows a plan and a city view with one year in red.
    Pick another composition when the beat names no date to show.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* The font: Arimo, read from the installed fonts with local("Arimo"); no font file is bundled. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* The big red name: on screen from the first frame of its shot, no animation. */
        .dr-name { position: absolute; left: 0; width: 1920px; text-align: center; font-family: "Arimo", sans-serif; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; color: rgba(198, 58, 36, 0.92); text-shadow: 0 0 22px rgba(198, 58, 36, 0.4); white-space: nowrap; }
        /* The lower third: name in red bold, role in red bold italic, no box. */
        .dr-l3 { position: absolute; left: 207px; top: 826px; font-family: "Arimo", sans-serif; font-weight: 700; color: #f04a2e; text-shadow: 0 0 6px #0a0c0d, 0 0 18px #0a0c0d; white-space: nowrap; }
        .dr-l3 b { display: block; font-size: 44px; line-height: 50px; }
        .dr-l3 i { display: block; font-size: 30px; line-height: 38px; }
      </style>
      <!-- "Kota ini bagian dari ..." (83.22 s): maximilian + lower third Maximilian I from the start; civ-north on "tetapi" (86.67 s); stras-city2 + red name 1262 on "sejak" (88.48 s). -->
      <div id="root" data-composition-id="c1-02-empire" data-width="1920" data-height="1080">
        <!-- The portrait shot: Maximilian I, with its lower third on top. -->

        <div class="dr-l3" id="c102empire-a-l3"><b>Maximilian I</b><i>Kaisar Romawi Suci, 1508–1519</i></div>
        <!-- The plan shot, which cuts in at 3.45 s. -->
        <div class="dr-shot" id="c102empire-b" data-layout-allow-overflow><img id="c102empire-b-img" src="data:image/svg+xml,%3C!--civ-north.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'763' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/civ-north.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/civ-north.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <!-- The city view, with the red year that appears over it at 5.26 s. -->
        <div class="dr-shot" id="c102empire-c" data-layout-allow-overflow><img id="c102empire-c-img" src="data:image/svg+xml,%3C!--stras-city2.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'801' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/stras-city2.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/stras-city2.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-name" id="c102empire-c-name" style="top: 600px; font-size: 250px;">1262</div>
      </div>
      <script>
        /* The timeline: the portrait push, then the plan, then the city view and its red year. */
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#c102empire-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.071, x: 6, y: -2, duration: 3.45, ease: "none" }, 0.0);
        tl.to("#c102empire-a-l3", { opacity: 0, duration: 0.001 }, 3.45);
        tl.fromTo("#c102empire-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.046, x: -5, y: 3, duration: 1.81, ease: "none" }, 3.45);
        gsap.set("#c102empire-b", { opacity: 0 });
        tl.to("#c102empire-b", { opacity: 1, duration: 0.001 }, 3.45);
        tl.fromTo("#c102empire-c", { scale: 1.014, x: -4, y: -3 }, { scale: 1.066, x: 4, y: 3, duration: 3.08, ease: "none" }, 5.26);
        gsap.set("#c102empire-c", { opacity: 0 });
        tl.to("#c102empire-c", { opacity: 1, duration: 0.001 }, 5.26);
        gsap.set("#c102empire-c-name", { opacity: 0 });
        tl.to("#c102empire-c-name", { opacity: 1, duration: 0.001 }, 5.26);
        window.__timelines["c1-02-empire"] = tl;
      </script>
    </template>
  </body>
</html>
