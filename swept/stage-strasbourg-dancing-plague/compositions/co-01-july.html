<!doctype html>
<!--
  GUIDE: compositions/co-01-july.html (composition id "co-01-july")
  WHAT: The first narrated beat of the cold open, 7.94 s long, mounted by index.html at 8.0 s on the
    line "Pada bulan Juli seribu ...". An engraved view of Strasbourg (stras-wide.jpg) carries a large
    red "1518" while it slowly pushes in. At 3.64 s (11.64 s in the film) the red number is removed and
    a second picture of dancers (hon-left.jpg) takes over, with a two-line white caption that names its
    source. The file has no sound; the narration and the music are mounted by index.html. Its two
    pictures are not bundled, so each shows as a faint hatched stand-in with a label naming its file
    until you add the file (see MEDIA); the red number and the caption still show over it.
  STRUCTURE: Layers back to front: #co01july-a (.dr-shot, first picture), #co01july-a-name (.dr-name,
    the red "1518"), #co01july-b (.dr-shot, second picture, hidden at the start), #co01july-b-cap
    (.dr-cap, caption). Timeline (gsap, paused): from 0 s for 3.64 s, #co01july-a scales 1.014 to 1.074
    and drifts x -6 to 6 and y 2 to -2 with ease none. At 3.64 s #co01july-a-name is hidden, and
    #co01july-b and #co01july-b-cap appear at once. From 3.64 s for 4.3 s, #co01july-b scales 1.014 to
    1.085 with the opposite drift.
  CUSTOMIZE: Picture files: the src of img#co01july-a-img and img#co01july-b-img. Red number: the text of
    #co01july-a-name, with inline top 330px and font-size 250px; its colour rgba(198, 58, 36, 0.92) is
    set in .dr-name. Caption: the text of #co01july-b-cap, placed at left 207px and top 800px in .dr-cap,
    colour #eef1ee. Grade: data-color-grading on each img (contrast 0.1, saturation -0.32, blacks -0.22,
    temperature -0.05, vignette 0.2, grain 0.08); the second picture adds exposure -0.25. The cut at 3.64 s
    is repeated in every tween and must stay the same in each. The length 7.94 s (3.64 + 4.3) must match
    data-duration of co-01-july-slot in index.html.
  MEDIA: No media file is bundled in this composition. It has two photo slots and one font slot, and
    no sound, video or CSS image slot.
    1. Photo, first picture: the img #co01july-a-img inside #co01july-a (the engraved view of
       Strasbourg). It showed assets/generated/stras-wide.jpg. Now it shows the hatched stand-in
       naming that path (data-media), with the grade in its data-color-grading kept. To plug in: set
       src="assets/generated/stras-wide.jpg" on that img.
    2. Photo, second picture: the img #co01july-b-img inside #co01july-b, hidden until 3.64 seconds
       (the engraving of dancers). It showed assets/generated/hon-left.jpg. Now it shows the
       hatched stand-in naming that path (data-media). To plug in: set
       src="assets/generated/hon-left.jpg" on that img.
    If a picture is missing, the #root ground (#0f1518) and the red number and caption still show,
    or use a free licensed old engraving of the same subject from Wikimedia Commons.
    3. Font: Arimo, in the @font-face rule at the top of the style block. It was the bundled file
       assets/fonts/arimo-latin.woff2, which drew the red number and the caption. Now the rule reads
       src: local("Arimo"), so they use Arimo only when it is installed; otherwise the sans-serif in
       the font stack. To plug in: add url("assets/fonts/arimo-latin.woff2") format("woff2") to the
       src list of that rule.
  WHEN TO USE: A short beat that states a year or number in large red type over an old picture, then cuts
    to a second picture whose source is printed under it. Pick another file when a picture must move on its
    own, when a video clip is needed, or when a framed portrait is wanted.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Fonts and stage: the Arimo face is local only, and the root fills the frame on a near-black slate ground. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* The big red name: on screen from the first frame of its shot, no animation. */
        .dr-name { position: absolute; left: 0; width: 1920px; text-align: center; font-family: "Arimo", sans-serif; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; color: rgba(198, 58, 36, 0.92); text-shadow: 0 0 22px rgba(198, 58, 36, 0.4); white-space: nowrap; }
        /* The caption: where the picture comes from, two plain white lines. */
        .dr-cap { position: absolute; left: 207px; top: 800px; font-family: "Arimo", sans-serif; font-weight: 400; font-size: 30px; line-height: 38px; color: #eef1ee; text-shadow: 0 0 4px #0a0c0d, 0 0 9px #0a0c0d, 0 0 18px #0a0c0d, 0 0 34px rgba(10, 12, 13, 0.85); white-space: nowrap; }
      </style>
      <!-- "Pada bulan Juli seribu ..." (8.00 s): stras-wide + red name 1518 from the start; hon-left + caption on "seorang" (11.64 s). -->
      <div id="root" data-composition-id="co-01-july" data-width="1920" data-height="1080">
        <!-- The first picture: a wrapper that carries the push, while its img carries the grade. -->
        <div class="dr-shot" id="co01july-a" data-layout-allow-overflow><img id="co01july-a-img" src="data:image/svg+xml,%3C!--stras-wide.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'782' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/stras-wide.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/stras-wide.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <!-- The red year, on screen from the first frame over the first picture and removed at the cut. -->
        <div class="dr-name" id="co01july-a-name" style="top: 330px; font-size: 250px;">1518</div>
        <!-- The second picture, hidden until the cut at 3.64 s. -->
        <div class="dr-shot" id="co01july-b" data-layout-allow-overflow><img id="co01july-b-img" src="data:image/svg+xml,%3C!--hon-left.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'744' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/hon-left.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/hon-left.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05,"exposure":-0.25},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <!-- The two-line caption that names the second picture's source. -->
        <div class="dr-cap" id="co01july-b-cap">Para penari di Molenbeek, dekat Brussel, tahun 1564<br />Ukiran Hendrick Hondius, 1642, dari gambar Pieter Bruegel</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        /* Phase 1 (0 to 3.64 s): the first picture pushes in while the red number stays on. */
        tl.fromTo("#co01july-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.074, x: 6, y: -2, duration: 3.64, ease: "none" }, 0.0);
        /* The cut at 3.64 s: the red number is removed. */
        tl.to("#co01july-a-name", { opacity: 0, duration: 0.001 }, 3.64);
        /* Phase 2 (from 3.64 s): the second picture is shown and pushes in. */
        tl.fromTo("#co01july-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.085, x: -5, y: 3, duration: 4.3, ease: "none" }, 3.64);
        /* Setup for phase 2: the second picture and its caption start hidden. */
        gsap.set("#co01july-b", { opacity: 0 });
        tl.to("#co01july-b", { opacity: 1, duration: 0.001 }, 3.64);
        gsap.set("#co01july-b-cap", { opacity: 0 });
        tl.to("#co01july-b-cap", { opacity: 1, duration: 0.001 }, 3.64);
        /* Registration: the host finds this timeline by the id co-01-july. */
        window.__timelines["co-01-july"] = tl;
      </script>
    </template>
  </body>
</html>
