    all use the prefix c210nodeaths; keep them consistent in the markup and the script. Specklin is graded
    with an exposure of -0.25.

    video and no CSS image.
    1. The first picture, img #c210nodeaths-a-img (inside #c210nodeaths-a, shown 0 to 5.26 s, under the

       "PHOTO: assets/generated/brant2.jpg". To plug in your picture, set the img's src to your file (for

    the next picture. Pick another pattern when the film does not name people.
