<!doctype html>
<!--
  GUIDE: compositions/c4-09-belief.html (composition id "c4-09-belief")
  WHAT: About 11.9 seconds on belief in the curse. It opens on a picture of peasants
    (peasants2.jpg) pushed slowly in, cuts at 3.37 seconds to a panel painting of the martyrdom
    of Saint Vitus (vitusmart-wide2.jpg), and at 6.93 seconds to a woodcut of the pilgrimage to
    Mary at Regensburg (ostendorfer.jpg). A two-line caption under the woodcut names the
    pilgrimage and the woodcut's author and date, and stays until the end. It plays from 474.40
    seconds in index.html, on the narration "Warga yang lapar, sakit" (hungry and sick people).
  STRUCTURE: Three layers in #root, back to front: #c409belief-a (the first picture, from the
    start), #c409belief-b (the panel, shown from 3.37 seconds) and #c409belief-c (the woodcut,
    shown from 6.93 seconds), with the caption #c409belief-c-cap as a separate layer over the
    frame. Timeline: a scales 1.014 to 1.070 over 3.37 seconds; b scales 1.014 to 1.073 from 3.37
    for 3.56 seconds; c scales 1.014 to 1.096 from 6.93 for 5.01 seconds; the caption is shown at
    6.93 seconds with no end tween, so it runs to the composition end at 11.94 seconds.
  CUSTOMIZE: Each picture's file is named by data-media on the img tags with ids c409belief-a-img,
    c409belief-b-img and c409belief-c-img; set the src of each to swap in your own (see MEDIA). The cut times 3.37 and 6.93 seconds are the narration
    words "percaya" (believe) at 477.77 seconds and "Menurut" (according to) at 481.33 seconds.
    The caption is the two lines inside #c409belief-c-cap, split by a line break, in the .dr-cap
    style at left 207 px, top 800 px, 30 px Arimo, #eef1ee. Push ends and offsets are in the
    tl calls. The grade is the standard data-color-grading attribute on all three pictures. The
    11.94 second length must match data-duration of c4-09-belief-slot in index.html.
  MEDIA: no media file is bundled. This file has three photo slots and one font slot. It has no sound, no
    video and no CSS image.
    1. The first picture, img #c409belief-a-img (inside #c409belief-a, from the start to 3.37 seconds). It showed
       Durer's Three Peasants in Conversation (about 1497) (peasants2.jpg). It now shows a faint hatch stand-in
       labeled "PHOTO: assets/generated/peasants2.jpg". To plug in your picture, set the img's src to your file
       (for example assets/generated/peasants2.jpg). The data-media attribute only names the expected path; it
       loads nothing. The img's data-color-grading still grades your picture.
    2. The panel, img #c409belief-b-img (inside #c409belief-b, cut in at 3.37 seconds). It showed the Martyrdom of
       Saint Vitus, a panel of about 1450 (vitusmart-wide2.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/vitusmart-wide2.jpg". To plug in your picture, set the img's src to your file.
    3. The woodcut, img #c409belief-c-img (inside #c409belief-c, cut in at 6.93 seconds). It showed Michael
       Ostendorfer's woodcut of the pilgrimage to Mary at Regensburg (about 1520) (ostendorfer.jpg). It now shows a
       stand-in labeled "PHOTO: assets/generated/ostendorfer.jpg". To plug in your picture, set the img's src to
       your file. If you use another picture, write its own source into the caption, because the caption is a
       claim about the picture.
    4. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap for the caption #c409belief-c-cap.
       It was a bundled woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if
       it is installed, otherwise the sans-serif fallback of the font stack. To plug in your font, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: a three-picture montage on a sentence about belief, with a source line at the end.
    Pick another layout when each picture needs its own caption.
-->
<html>

        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }

        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .dr-cap { position: absolute; left: 207px; top: 800px; font-family: "Arimo", sans-serif; font-weight: 400; font-size: 30px; line-height: 38px; color: #eef1ee; text-shadow: 0 0 4px #0a0c0d, 0 0 9px #0a0c0d, 0 0 18px #0a0c0d, 0 0 34px rgba(10, 12, 13, 0.85); white-space: nowrap; }

      <script>

        const tl = gsap.timeline({ paused: true });
