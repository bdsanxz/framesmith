  WHAT: Beat 6 of chapter 3, on the result. The narration (Indonesian "Hasilnya berlawanan dengan harapan
    ...") says the result was the opposite of what was hoped. Four stills are cut in one after another,
    each with a slow push, and none carries a caption: Dürer's Bagpiper (1514) from 0 s, Hondius's
    procession plate (1642) at 2.38 s, the Martyrdom of Saint Vitus panel (about 1450) at 6.49 s, and
    Hondius's footbridge plate (1642) at 8.16 s. The beat runs 11.54 s; index.html mounts it at 335.86 s,
    under narration clip voice-s36.
  STRUCTURE: Four stacked layers in #root, back to front: #c306backfire-a (bagpiper.jpg), -b (pro-group3.jpg),
    -c (vitusmart-close2.jpg) and -d (hon-wide2.jpg). Each is a .dr-shot wrapper. The timeline
    (window.__timelines["c3-06-backfire"]) pushes layer a from 1.014 to 1.055 over 2.38 s. It cuts in layer
    b at 2.38 s and pushes it to 1.082 over 4.11 s, cuts in layer c at 6.49 s and pushes it to 1.044 over
    1.67 s, and cuts in layer d at 8.16 s, where it drifts from the right (x 6 to -6) to 1.070 over 3.38 s.
  CUSTOMIZE: Each picture's file is named by data-media on its img tag (bagpiper.jpg, pro-group3.jpg,
    vitusmart-close2.jpg, hon-wide2.jpg); set the src to swap in your own (see MEDIA). The push sizes are the scale values in
    the four fromTo calls, and the drift direction is the x and y values. Each cut time (2.38, 6.49, 8.16)
    must equal the end of the layer before it, and the total is the 11.54 s data-duration in index.html.
    The grade is the data-color-grading JSON on each img; saturation -0.32 and vignette 0.2 apply to all
    four. This file declares the Arimo font but shows no text, so it has no caption to change.
  MEDIA: no media file is bundled. This file has four photo slots. It has no sound, no video and no CSS
    image. The Arimo font is declared, but no element uses it, so no font file is needed.
    1. The bagpiper, img #c306backfire-a-img (inside #c306backfire-a, shown 0 to 2.38 s). It showed Dürer's
       Bagpiper (1514). It now shows a faint hatch stand-in labeled "PHOTO: assets/generated/bagpiper.jpg".
       To plug in your picture, set the img's src to your file (for example assets/generated/bagpiper.jpg).
       The data-media attribute only names the expected path; it loads nothing. The img's data-color-grading
       still grades your picture.
    2. The procession, img #c306backfire-b-img (inside #c306backfire-b, cut in at 2.38 s). It showed
       Hondius's procession plate (1642). It now shows a stand-in labeled
       "PHOTO: assets/generated/pro-group3.jpg". To plug in your picture, set the img's src to your file.
    3. The Saint Vitus panel, img #c306backfire-c-img (inside #c306backfire-c, cut in at 6.49 s). It showed the
       Martyrdom of Saint Vitus panel (about 1450). It now shows a stand-in labeled
       "PHOTO: assets/generated/vitusmart-close2.jpg". To plug in your picture, set the img's src to your file.
    4. The footbridge, img #c306backfire-d-img (inside #c306backfire-d, cut in at 8.16 s and drifting from the
       right). It showed Hondius's footbridge plate (1642). It now shows a stand-in labeled
       "PHOTO: assets/generated/hon-wide2.jpg". To plug in your picture, set the img's src to your file.
  WHEN TO USE: a quick run of four uncaptioned prints for a beat that names several sources in a row. Pick
    c3-01 when each picture needs its source on screen.
-->
