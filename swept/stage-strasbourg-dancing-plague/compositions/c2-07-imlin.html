<!doctype html>
<!--

    chronicle). A red line climbs through three points: 14 July with 1 dancer, one week with more than
    30 dancers, and one month with the count from the Imlin chronicle, which ends at the red figure
    400. The whole chart scales up slightly over the beat.

    #c207imlin-a-t1 to -t3 with their unit lines -u1 to -u3, and the red figure #c207imlin-a-n.
    Timeline: the wrapper scales 1.0 to 1.03 over 7.94 s; the line draws from 0.4 s to 5.09 s through its
    stroke-dashoffset; point 2 and its labels appear at 1.65 s; point 3 and its labels at 3.71 s; the red
    400 at 5.09 s. Point 1 and its labels are visible from the start.
  CUSTOMIZE: the numbers and words are the text of the labels, placed in pixels. The points are
    (470, 818.7), (860, 775.8) and (1500, 300) in both the path d and the circle centres, so move them
    together with their labels. The gridlines are 130 px apart and each stands for 100 dancers, with zero
    on the baseline at y 820. Colours: line #e0482c, axis rgba(233, 234, 226, 0.7), gridlines at 0.14
    alpha, labels #e9eae2. The class .dg-red (#e0482c) is defined, but no element here uses it. The
    timings 0.4, 1.65, 3.71 and 5.09 and the 7.94 s length follow the narration. The dash length 1200
    must be at least the length of the path.
  MEDIA: no media file is bundled. This file has one font slot and no picture, video, sound or CSS image.
    The chart is drawn in code (SVG paths and circles, and plain divs), so it needs no stand-in.
    1. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dg-label, .dg-small and
       .dr-figure. It was a bundled woff2 file (assets/fonts/arimo-latin.woff2), the only file this beat
       loaded. It now reads local("Arimo"): the face is used if it is installed, otherwise the sans-serif
       fallback of the font stack. To plug in your font, add url("your-font.woff2") format("woff2") to the
       src list of that @font-face.
  WHEN TO USE: a number that builds as the narration says it, with a few named points, in the
    documentary-room graphic style. Pick another approach for many data points, or for a chart the
    viewer should read whole from the start.
-->
