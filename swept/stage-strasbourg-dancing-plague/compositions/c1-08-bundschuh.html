    Upper Rhine. It opens on a woodcut of men pushing a cart uphill, held from the start, then at
    5.68 s cuts to the title woodcut of a Bundschuh pamphlet (1514). The red name
    "Bundschuh" sits across the frame from that cut on. It runs 8.18 s; index.html mounts it as
    c1-08-bundschuh-slot at 136.54 s.

    #c108bundschuh-b (the pamphlet), with the red name #c108bundschuh-b-name, a .dr-name placed
    after the pamphlet so it sits above it. The paused GSAP timeline, registered as
    window.__timelines["c1-08-bundschuh"], pushes the cart from 0 s (scale 1.014 to 1.106 over
    5.68 s). At 5.68 s it shows the pamphlet and the name and pushes the pamphlet (to 1.057 over
    2.5 s). The name is on screen from its first frame, with no animation.
  CUSTOMIZE: the name text is "Bundschuh" in the markup, with top 700 px and font-size 210 px set
    inline. Its colour and tracking come from .dr-name (rgba(198, 58, 36, 0.92), letter-spacing
    -0.01em). The push amounts and the cut time 5.68 s are in the tweens; the last tween ends at
    8.18 s, which must match the data-duration that index.html gives c1-08-bundschuh-slot. The grades
    are the data-color-grading JSON on each img.
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. The red name is
    plain text. It has no sound and no CSS image.
    1. The cart, img #c108bundschuh-a-img (inside #c108bundschuh-a, on screen from the start). It showed
       Hans Weiditz's woodcut of men pushing a cart (1531). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/cart.jpg". To plug in your picture, set the img's src to your file (for
       example assets/generated/cart.jpg). The data-media attribute only names the expected path; it loads
       nothing. The img's data-color-grading still grades your picture.
    2. The pamphlet, img #c108bundschuh-b-img (inside #c108bundschuh-b, which cuts in at 5.68 s). It showed
       the title woodcut of a Bundschuh pamphlet (1514). It now shows a stand-in labeled
       "PHOTO: assets/generated/bundschuh.jpg". To plug in your picture, set the img's src to your file.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-name for the red "Bundschuh".
       It was a bundled font file. It now reads local("Arimo"): the face is used if it is installed,
       otherwise the sans-serif fallback of the font stack. To plug in your font, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: a beat that names a movement or a group in one word, set in red over a picture of its
    period. Pick another composition when the name is too long to sit on one line.
-->
