<!--
  GUIDE: compositions/c3-09-wagons.html (composition id "c3-09-wagons")
  WHAT: Beat 9 of chapter 3, on the wagons. The narration (Indonesian "Kini penyakit itu ditangani ...") says
    how the illness was handled; the dancers were taken away by wagon to Saverne. The beat
    opens on a stock clip of a gothic nave for 3.72 s (not Strasbourg Cathedral), then cuts to Weiditz's men
    pushing a cart (1531), then to Merian's view of Zabern (Saverne, 1644) with its caption. It runs 8.26 s;
    index.html mounts it at 366.24 s, under narration clip voice-s39.
  STRUCTURE: Three stacked layers in #root, back to front: #c309wagons-a (a video slot, footage/v04.mp4, now a still stand-in),
    #c309wagons-b (cart.jpg) and #c309wagons-c (zabern.jpg, with the caption #c309wagons-c-cap). Each is a
    .dr-shot wrapper. The timeline (window.__timelines["c3-09-wagons"]) pushes the video from scale 1.0 to
    1.062 over 3.72 s, which is the clip's length. It cuts in layer b at 3.72 s and pushes it from 1.014 to
    1.061 over 2.8 s. It cuts in layer c at 6.52 s, pushes it from 1.014 to 1.045 over 1.74 s, and shows the
    caption at the same moment.
  CUSTOMIZE: The clip's file is named by data-media on the video slot #c309wagons-a-video, and its data-start 0.0
    and data-duration 3.72 set the clip window; to use your own clip, turn the slot back into a video (see MEDIA).
    The picture files are named by data-media on #c309wagons-b-img and #c309wagons-c-img; set their src to swap in
    your own. The cut times 3.72 and
    6.52 must match the ends of the layers before them, and the total is the 8.26 s data-duration in index.html.
    The caption is the two lines in #c309wagons-c-cap. The grade is the data-color-grading JSON on each media
    element; the Zabern still adds exposure -0.25.
  MEDIA: no media file is bundled. This file has one video slot, two photo slots and one font slot. It has
    no sound and no CSS image.
    1. The stock clip, video slot img #c309wagons-a-video (inside #c309wagons-a, from 0 s for 3.72 s; data-start
       0.0, data-duration 3.72, data-track-index 1, data-media-kind="video"). It showed a stock clip of a gothic
       nave, played muted (footage/v04.mp4). It now shows a faint hatch stand-in labeled "VIDEO: footage/v04.mp4",
       which does not move. To plug in your clip, turn this img back into a video:
       a video element with src="footage/v04.mp4", muted and playsinline with your file path in src. Keep the id
       c309wagons-a-video, the data-start, data-duration and data-track-index attributes, the data-color-grading
       attribute and data-media-kind="video", so the [data-media-kind="video"] CSS rule still matches. Keep
       data-duration at 3.72 s. If you have only a still of a nave, keep this img and set its src to the still; it
       holds for the same 3.72 s.
    2. The cart, img #c309wagons-b-img (inside #c309wagons-b, cut in at 3.72 s). It showed Weiditz's woodcut of
       men pushing a cart (1531). It now shows a stand-in labeled "PHOTO: assets/generated/cart.jpg". To plug in
       your picture, set the img's src to your file (for example assets/generated/cart.jpg). The data-media
       attribute only names the expected path; it loads nothing. The img's data-color-grading still grades your
       picture.
    3. The Zabern view, img #c309wagons-c-img (inside #c309wagons-c, cut in at 6.52 s, with the caption
       #c309wagons-c-cap). It showed Merian's view of Zabern (Saverne, 1644). It now shows a stand-in labeled
       "PHOTO: assets/generated/zabern.jpg". To plug in your picture, set the img's src to your file. Its grade
       adds exposure -0.25 so the caption reads.
    4. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap. It was a bundled woff2 file
       (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it is installed,
       otherwise the sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: a beat that opens on moving footage and then moves to stills, when a picture of a road or a
    journey is needed. Pick c3-02 when the whole beat should be stills.
-->
