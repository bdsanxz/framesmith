    with ease none. There is no cut in this file.

    values of the single tween. The length 6.3 s must match data-duration of co-06-invite-slot in index.html;

       that path (data-media), with its grade kept. To plug in: set src="assets/generated/hon-wide.jpg"
       on that img. If it is missing, use a solid #0f1518 ground (the #root colour) under the same

    2. Font: Arimo, in the @font-face rule at the top of the style block. It was a bundled file. Now
       the rule reads src: local("Arimo"), and this file draws no text, so the font is unused here.
       To plug in (only if you add text): add url("assets/fonts/arimo-latin.woff2") format("woff2")
       to the src list of that rule.
  WHEN TO USE: A single still that carries the narration to a close before a hard cut to a sting, with
    nothing printed on screen. Pick a file with text when the invitation has to be shown in writing.
-->
