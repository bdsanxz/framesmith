<!doctype html>
<!--
  GUIDE: compositions/c1-10-vitus.html (composition id "c1-10-vitus")
  WHAT: A beat on Saint Vitus, whose name the film sets in red, and on the dancers who were cursed.
    It opens on a wide picture of the Martyrdom of Saint Vitus (a panel of about 1450) held from
    the start. At 2.5 s it cuts to a carving of Saint Vitus in a kettle (about
    1500) with the red name "Santo Vitus" over it, and the name goes at 4.58 s. From 4.58 s a close
    view of the same panel shows, and from 6.17 s an engraving of the dancers of Kölbigk, with the
    caption "Para penari terkutuk dari Kölbigk" (the cursed dancers of Kölbigk), runs to the end at
    9.86 s. index.html mounts it as c1-10-vitus-slot at 152.58 s.
  STRUCTURE: four .dr-shot wrappers in document order: #c110vitus-a (the wide panel), #c110vitus-b
    (the carving) with its red name #c110vitus-b-name after it, #c110vitus-c (the close panel) and
    #c110vitus-d (the engraving) with its caption #c110vitus-d-cap after it. The paused GSAP timeline,
    registered as window.__timelines["c1-10-vitus"], pushes the wide panel from 0 s (scale 1.014 to
    1.057 over 2.5 s); from 2.5 s shows the carving and the name and pushes it (to 1.050 over 2.08 s);
    at 4.58 s hides the name and pushes the close panel (to 1.043 over 1.59 s) from 4.58 s; and from
    6.17 s shows the engraving and its caption and pushes it (to 1.075 over 3.69 s).
  CUSTOMIZE: the red name is the text "Santo Vitus", with top 660 px and font-size 220 px set inline.
    The caption text is in the markup: "Para penari terkutuk dari Kölbigk" on the first line and
    "Ukiran dalam kronik J. L. Gottfried, 1674" (an engraving in Gottfried's chronicle of 1674) on the
    second; its place is left 207 px and top 800 px in .dr-cap. The engraving's grade adds exposure
    -0.25 in its data-color-grading, so the white caption reads. The cut times 2.5, 4.58 and 6.17 are
    in the tweens. The last tween ends at 9.86 s, which must match the data-duration that index.html
    gives c1-10-vitus-slot.
  MEDIA: no media file is bundled. This file has four photo slots and one font slot. It has no sound
    and no CSS image.
    1. The wide panel, img #c110vitus-a-img (inside #c110vitus-a, on screen from the start). It showed the
       Martyrdom of Saint Vitus, a panel of about 1450. It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/vitusmart-wide.jpg". To plug in your picture, set the img's src to your
       file (for example assets/generated/vitusmart-wide.jpg). The data-media attribute only names the
       expected path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The carving, img #c110vitus-b-img (inside #c110vitus-b, which cuts in at 2.5 s; the red name is
       over it until 4.58 s). It showed a carving of Saint Vitus in a kettle (about 1500). It now shows a
       stand-in labeled "PHOTO: assets/generated/vitus.jpg". To plug in your picture, set the img's src to
       your file.
    3. The close panel, img #c110vitus-c-img (inside #c110vitus-c, which cuts in at 4.58 s). It showed a
       close view of the same panel. It now shows a stand-in labeled
       "PHOTO: assets/generated/vitusmart-close.jpg". To plug in your picture, set the img's src to your file.
    4. The engraving, img #c110vitus-d-img (inside #c110vitus-d, which cuts in at 6.17 s, with the caption
       #c110vitus-d-cap). It showed the dancers of Kölbigk, an engraving of 1674 set in a legend of about
       1020. It now shows a stand-in labeled "PHOTO: assets/generated/kolbeck.jpg". To plug in your picture,
       set the img's src to your file.
    5. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-name and .dr-cap. It was a
       bundled font file. It now reads local("Arimo"): the face is used if it is installed, otherwise the
       sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: a beat that names a saint or a place of worship in red, then shows a legend with a
    dated caption. Pick another composition when the beat names no saint or shows no legend.
-->
