<!doctype html>
<!--
  GUIDE: compositions/c2-05-sources.html (composition id "c2-05-sources")
  WHAT: The fifth beat of chapter 2, 12.5 s, from 220.8 s in index.html, narrated by segment s23
    (opening "Kita mengetahuinya dari catatan", we know it from the records). It shows four pictures
    and a short film clip in turn, each sourced on screen. A picture of the council decision carries
    the caption "Keputusan dewan kota Strasbourg, 2 Agustus 1518" (decision of the Strasbourg city
    council, 2 August 1518); the caption is removed at 3.17 s. From 3.17 s a short clip of a gothic
    church nave runs (footage/v03.mp4). Then a city market picture from 5.67 s, and from 9.22 s a
    wide city picture with a framed portrait of Daniel Specklin, named as the architect, and his name
    in red under it.
  STRUCTURE: #root holds four .dr-shot wrappers (#c205sources-a to -d). Shot a holds the caption
    #c205sources-a-cap. Shot b is a video slot (img #c205sources-b-video, footage/v03.mp4, shown as a
    still stand-in) with data-start 3.17 and data-duration 2.5. Shot d holds the framed portrait #c205sources-d-frame (.dr-frame, 364 by 454 px,
    12 px border) with its image #c205sources-d-face, and the name #c205sources-d-who (.dr-who).
    Timeline: a pushes 0 to 3.17 s and its caption is removed at 3.17 s; b pushes over 2.5 s from
    3.17 s; c is cut in at 5.67 s and pushes over 3.55 s; d is cut in at 9.22 s and pushes over 3.28 s,
    its face pushes slightly inside the frame, and the frame and name appear at 9.22 s.
  CUSTOMIZE: each picture's and the clip's file is named by data-media (ban-top.jpg, footage/v03.mp4,
    civ-market.jpg, civ-wide2.jpg, f-specklin.jpg); set the src of a picture, or turn the clip back into a
    video (see MEDIA). The caption text is in #c205sources-a-cap. The
    portrait frame sits at left 1338 px and top 236 px, its border colour is #e8765a. The name is set in
    .dr-who (left 1220 px, top 702 px, width 600 px, 44 px, colour #f04a2e). The cut times 3.17, 5.67 and
    9.22 must match the narration; the clip's data-start and data-duration must match the time the clip
    runs. The whole beat is data-duration 12.5 in index.html. Grades are in data-color-grading.
  MEDIA: no media file is bundled. This file has one video slot, four photo slots and one font slot. It
    has no sound and no CSS image.
    1. The first picture, img #c205sources-a-img (inside #c205sources-a, shown 0 to 3.17 s, under the
       caption #c205sources-a-cap, which is plain text). It showed ban-top.jpg, the picture the first
       caption is set on. It now shows a faint hatch stand-in labeled "PHOTO: assets/generated/ban-top.jpg".
       To plug in your picture, set the img's src to your file (for example assets/generated/ban-top.jpg).
       The data-media attribute only names the expected path; it loads nothing. The img's
       data-color-grading still grades your picture; it adds exposure -0.25 so the caption reads.
    2. The clip, video slot img #c205sources-b-video (inside #c205sources-b, from 3.17 s for 2.5 s;
       data-start 3.17, data-duration 2.5, data-track-index 1, data-media-kind="video"). It showed a short
       muted clip of the nave of a gothic church (footage/v03.mp4). It now shows a faint hatch stand-in
       labeled "VIDEO: footage/v03.mp4", which does not move. To plug in your clip, turn this img back into
       a video element (src="footage/v03.mp4", muted and playsinline) with your file path in src. Keep the
       id c205sources-b-video, the data-start, data-duration, data-track-index and
       data-hf-media-start-basis attributes, the data-color-grading attribute and data-media-kind="video",
       so the [data-media-kind="video"] CSS rule still matches. Keep data-duration at the clip's length (2.5 s).
       If you have only a still of the nave, keep this img and set its src to the still; it holds the same 2.5 s.
    3. The market picture, img #c205sources-c-img (inside #c205sources-c, shown from 5.67 s). It showed a
       city market picture (civ-market.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/civ-market.jpg". To plug in your picture, set the img's src to your file.
    4. The wide city picture, img #c205sources-d-img (inside #c205sources-d, from 9.22 s, behind the
       portrait). It showed a wide city picture (civ-wide2.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/civ-wide2.jpg". To plug in your picture, set the img's src to your file.
    5. The portrait, img #c205sources-d-face-img (inside #c205sources-d-face, in the frame
       #c205sources-d-frame). It showed a portrait of Daniel Specklin (f-specklin.jpg). It now shows a
       stand-in labeled "PHOTO: assets/generated/f-specklin.jpg". To plug in your portrait, set the img's src
       to your file. If you have no portrait, the frame and the name still show over the stand-in.
    6. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap and .dr-who. It was a
       bundled font file. It now reads local("Arimo"): the face is used if it is installed, otherwise the
       sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: a sourcing beat in which the film names its records and a person with a framed portrait.
    Pick another pattern when the people need no name or the beat has no clip.
-->
