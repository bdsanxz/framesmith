<!doctype html>
<!--
  GUIDE: compositions/co-04-council.html (composition id "co-04-council")
  WHAT: A 10.66 s beat of the cold open, mounted by index.html at 32.38 s, under the narration line that
    begins "Dewan kota memanggil para". Four still pictures follow one another with a slow push, each
    cut in hard at a fixed time: cirurgia.jpg from the start, pipers.jpg at 2.46 s (34.84 s in the film),
    vitus.jpg at 4.17 s (36.55 s) and civ-wide.jpg at 5.81 s (38.19 s). The cuts land on the words the
    narration names in its comment (menyewa, pertolongan, Peristiwa). No words are drawn on screen, and
    the file has no sound. None of the four pictures is bundled, so each shows as a faint hatched
    stand-in with a label naming its file until you add it (see MEDIA).
  STRUCTURE: Four .dr-shot layers in document order: #co04council-a (cirurgia), #co04council-b (pipers),
    #co04council-c (vitus), #co04council-d (civ-wide). Each later layer is hidden by gsap.set until its
    cut and then sits over the earlier ones. Timeline (gsap, paused): from 0 s for 2.46 s, -a scales
    1.014 to 1.056 with x -6 to 6 and y 2 to -2. From 2.46 s for 1.71 s, -b scales 1.014 to 1.045. From
    4.17 s for 1.64 s, -c scales 1.014 to 1.043 with x -4 to 4 and y -3 to 3. From 5.81 s for 4.85 s,
    -d scales 1.014 to 1.093 with x 6 to -6 and y 3 to -3. Each cut is a 0.001 s opacity tween to 1.
  CUSTOMIZE: The pictures: the src of img#co04council-a-img (cirurgia.jpg), img#co04council-b-img
    (pipers.jpg), img#co04council-c-img (vitus.jpg) and img#co04council-d-img (civ-wide.jpg). Cut times
    2.46, 4.17 and 5.81 are written in each shot's push tween and its opacity tween, so change them
    together. The push amounts are the scale and x and y values of each tween. The total length 10.66 s
    (5.81 + 4.85) must match data-duration of co-04-council-slot in index.html. Grade: data-color-grading
    on each img (contrast 0.1, saturation -0.32, blacks -0.22, temperature -0.05, vignette 0.2,
    grain 0.08). To add a picture, add a .dr-shot, a gsap.set hiding it, a cut tween, a push tween, and
    lengthen the slot.
  MEDIA: No media file is bundled in this composition. It has four photo slots and one font slot, and
    no sound, video or CSS image slot. Each photo is a graded still picture.
    1. Photo, first shot: the img #co04council-a-img inside #co04council-a (the cirurgia picture, from
       the start). It showed assets/generated/cirurgia.jpg. Now it shows the hatched stand-in naming
       that path (data-media), with its grade kept. To plug in: set src="assets/generated/cirurgia.jpg"
       on that img.
    2. Photo, second shot: the img #co04council-b-img inside #co04council-b (the pipers picture, cut
       in at 2.46 seconds). It showed assets/generated/pipers.jpg. Now it shows the stand-in naming that
       path. To plug in: set src="assets/generated/pipers.jpg" on that img.
    3. Photo, third shot: the img #co04council-c-img inside #co04council-c (the vitus picture, cut in
       at 4.17 seconds). It showed assets/generated/vitus.jpg. Now it shows the stand-in naming that
       path. To plug in: set src="assets/generated/vitus.jpg" on that img.
    4. Photo, fourth shot: the img #co04council-d-img inside #co04council-d (the civ-wide picture, cut
       in at 5.81 seconds). It showed assets/generated/civ-wide.jpg. Now it shows the stand-in naming
       that path. To plug in: set src="assets/generated/civ-wide.jpg" on that img.
    If a picture is missing, use a solid #0f1518 ground (the #root colour) under the same push, or a
    free licensed old woodcut or engraving of the same subject from Wikimedia Commons.
    5. Font: Arimo, in the @font-face rule at the top of the style block. It was a bundled file. Now
       the rule reads src: local("Arimo"), and this file draws no text, so the font is unused here.
       To plug in (only if you add text): add url("assets/fonts/arimo-latin.woff2") format("woff2")
       to the src list of that rule.
  WHEN TO USE: A beat that runs through several old pictures in turn, each cut in on a word of the
    narration, with no text on screen. Pick a file with captions when each picture must be named on
    screen, or a single-picture file when only one image is needed.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Fonts and stage: the Arimo face is local only, and the root fills the frame with the shots. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      </style>
      <!-- "Dewan kota memanggil para ..." (32.38 s): cirurgia from the start; pipers on "menyewa" (34.84 s); vitus on "pertolongan" (36.55 s); civ-wide on "Peristiwa" (38.19 s). -->
      <div id="root" data-composition-id="co-04-council" data-width="1920" data-height="1080">
        <!-- The four pictures, stacked in order; each later one is hidden until its cut. -->

        <div class="dr-shot" id="co04council-b" data-layout-allow-overflow><img id="co04council-b-img" src="data:image/svg+xml,%3C!--pipers.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'706' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/pipers.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/pipers.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-shot" id="co04council-c" data-layout-allow-overflow><img id="co04council-c-img" src="data:image/svg+xml,%3C!--vitus.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'687' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/vitus.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/vitus.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-shot" id="co04council-d" data-layout-allow-overflow><img id="co04council-d-img" src="data:image/svg+xml,%3C!--civ-wide.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'744' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/civ-wide.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/civ-wide.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        /* Phase 1 (0 to 2.46 s): the cirurgia picture pushes in from the start. */
        tl.fromTo("#co04council-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.056, x: 6, y: -2, duration: 2.46, ease: "none" }, 0.0);
        /* Phase 2 (2.46 s to 4.17 s): the pipers picture is cut in and pushes in. */
        tl.fromTo("#co04council-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.045, x: -5, y: 3, duration: 1.71, ease: "none" }, 2.46);
        gsap.set("#co04council-b", { opacity: 0 });
        tl.to("#co04council-b", { opacity: 1, duration: 0.001 }, 2.46);
        /* Phase 3 (4.17 s to 5.81 s): the vitus picture is cut in and pushes in. */
        tl.fromTo("#co04council-c", { scale: 1.014, x: -4, y: -3 }, { scale: 1.043, x: 4, y: 3, duration: 1.64, ease: "none" }, 4.17);
        gsap.set("#co04council-c", { opacity: 0 });
        tl.to("#co04council-c", { opacity: 1, duration: 0.001 }, 4.17);
        /* Phase 4 (from 5.81 s): the civ-wide picture is cut in and holds to the end while it pushes in. */
        tl.fromTo("#co04council-d", { scale: 1.014, x: 6, y: 3 }, { scale: 1.093, x: -6, y: -3, duration: 4.85, ease: "none" }, 5.81);
        gsap.set("#co04council-d", { opacity: 0 });
        tl.to("#co04council-d", { opacity: 1, duration: 0.001 }, 5.81);
        /* Registration: the host finds this timeline by the id co-04-council. */
        window.__timelines["co-04-council"] = tl;
      </script>
    </template>
  </body>
</html>
