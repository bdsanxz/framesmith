<!doctype html>
<!--
  GUIDE: compositions/c4-03-paracelsus.html (composition id "c4-03-paracelsus")
  WHAT: About 6.3 seconds introducing the physician Paracelsus. It opens on a portrait
    (paracelsus2b.jpg) pushed slowly in, with a red lower third that reads "Paracelsus" and,
    under it, "Tabib dan alkemis, 1493 to 1541" (physician and alchemist). At 2.32 seconds the
    lower third is removed and a closer view of the face (paracelsus-face.jpg) cuts in and is
    pushed in until the end. It plays from 420.84 seconds in index.html, on the narration
    "Paracelsus termasuk yang pertama", and lasts 6.26 seconds.
  STRUCTURE: Two layers in #root, back to front: #c403paracelsus-a (the first portrait in a
    .dr-shot, with the lower third #c403paracelsus-a-l3 on top of it) and #c403paracelsus-b
    (the closer portrait, hidden until 2.32 seconds). Timeline: a scales 1.014 to 1.054 with a
    small x and y drift over 2.32 seconds, and the lower third is set to opacity 0 at 2.32
    seconds; b scales 1.014 to 1.079 from 2.32 for 3.94 seconds and is shown at 2.32 with no
    fade. The lower third is a .dr-l3 block with a bold name line and a role line.
  CUSTOMIZE: The name is the b element and the role is the i element inside
    #c403paracelsus-a-l3. The lower third sits at left 207 px, top 826 px; its name is 44 px and
    its role line 30 px, both in #f04a2e with dark shadows, set in the .dr-l3 rules. The cut at
    2.32 seconds appears in three places: the end of a's push, the lower third's removal and
    the start of b, so change them together. The 6.26 second length must match data-duration of
    c4-03-paracelsus-slot in index.html. Each picture's file is named by data-media on
    the img tags with ids c403paracelsus-a-img and c403paracelsus-b-img; set the src to swap in your own. The grade of both is the standard
    data-color-grading attribute (contrast 0.1, saturation -0.32, blacks -0.22, temperature
    -0.05, vignette 0.2, grain 0.08).
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. It has no sound, no
    video and no CSS image.
    1. The first portrait, img #c403paracelsus-a-img (inside #c403paracelsus-a, shown from the start to 2.32
       seconds, under the lower third #c403paracelsus-a-l3, which is plain text). It showed a portrait of
       Paracelsus (paracelsus2b.jpg), a reproduction of the Hirschvogel portrait of 1540. It now shows a faint
       hatch stand-in labeled "PHOTO: assets/generated/paracelsus2b.jpg". To plug in your portrait, set the
       img's src to your file (for example assets/generated/paracelsus2b.jpg). The data-media attribute only
       names the expected path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The closer face, img #c403paracelsus-b-img (inside #c403paracelsus-b, cut in at 2.32 seconds). It showed a
       closer view of the face (paracelsus-face.jpg), a portrait after Quentin Matsys. It now shows a stand-in
       labeled "PHOTO: assets/generated/paracelsus-face.jpg". To plug in your picture, set the img's src to your
       file.
       The lower third names a person, so if you use a different portrait, change the name and role in
       #c403paracelsus-a-l3 to match the picture.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-l3 for the name and the role. It was
       a bundled woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it
       is installed, otherwise the sans-serif fallback of the font stack. To plug in your font, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: naming a person once with a short role line, then a closer view of the face on a
    word about them. Pick another layout when the name has to stay on screen for the whole beat
    (see c4-05) or when two people appear in one shot.
-->

        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#c403paracelsus-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.054, x: 6, y: -2, duration: 2.32, ease: "none" }, 0.0);
