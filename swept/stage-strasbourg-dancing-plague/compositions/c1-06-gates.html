<!doctype html>
<!--
  GUIDE: compositions/c1-06-gates.html (composition id "c1-06-gates")
  WHAT: A short beat on the peasants and vine growers who came to the city gates. Two graded pictures
    cut in one after the other with no text: a picture of peasants in conversation (peasants.jpg)
    from the start, and a view of a Strasbourg gate (stras-gate2.jpg) from 4.07 s. Both push slowly
    toward the frame's centre. It runs 7.22 s; index.html mounts it as c1-06-gates-slot at 121.46 s.
  STRUCTURE: two .dr-shot wrappers in document order: #c106gates-a (peasants) and #c106gates-b (gate).
    The paused GSAP timeline, registered as window.__timelines["c1-06-gates"], pushes the peasants
    from 0 s (scale 1.014 to 1.081 over 4.07 s), then shows the gate at 4.07 s and pushes it (scale
    1.014 to 1.067 over 3.15 s). The gate sits above the peasants, so there is no cut to hide.
  CUSTOMIZE: there is no text or overlay in this file. The push amounts (1.081 and 1.067) and the
    cut time 4.07 are in the tweens; the gate's end at 7.22 s must match the data-duration that
    index.html gives c1-06-gates-slot. The grades are the data-color-grading JSON on each img. To add
    a caption, copy the .dr-cap rule and markup from c1-05-hardship.html.
  MEDIA: no media file is bundled. This file has two photo slots and no sound, no video and no CSS
    image. A font face is declared but no element uses it.
    1. The peasants, img #c106gates-a-img (inside #c106gates-a, on screen from the start). It showed
       Durer's Three Peasants in Conversation (about 1497). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/peasants.jpg". To plug in your picture, set the img's src to your file
       (for example assets/generated/peasants.jpg). The data-media attribute only names the expected
       path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The gate, img #c106gates-b-img (inside #c106gates-b, which cuts in at 4.07 s). It showed a view of
       a Strasbourg gate from the Nuremberg Chronicle (1493). It now shows a stand-in labeled
       "PHOTO: assets/generated/stras-gate2.jpg". To plug in your picture, set the img's src to your file.
    3. The font, the @font-face for "Arimo" (weights 400 to 700). No element in this file uses it, so
       nothing is drawn with it and no file is needed. If you add a caption, the plug-in step is the same
       as for the font in c1-05-hardship.html: add url("your-font.woff2") format("woff2") to its src list.
  WHEN TO USE: a short beat that needs two pictures and no text, for a group of people or a place.
    Pick another composition when the beat needs a caption or a name.
-->

        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#c106gates-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.081, x: 6, y: -2, duration: 4.07, ease: "none" }, 0.0);

  </body>
</html>
