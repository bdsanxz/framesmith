<!doctype html>
<!--
  GUIDE: compositions/c4-05-hecker.html (composition id "c4-05-hecker")
  WHAT: About 10.7 seconds on the book that gave the disease its name. It opens on the wide title
    page of Justus Hecker's Die Tanzwuth (hecker-title-wide.jpg), with a large red "1832" across
    it for 4.11 seconds. It then cuts to an engraving of the dancers of Kolbigk (kolbeck2.jpg),
    with a framed portrait of Justus Hecker (f-hecker.jpg) and his name under the frame, both
    visible from 4.11 to 8.24 seconds. The last part is the title page again (hecker-title.jpg),
    with a yellow marker bar drawn across its top from 9.02 seconds. It plays from 434.80
    seconds in index.html, on the narration "Pada tahun seribu delapan", and lasts 10.74 seconds.
  STRUCTURE: Three layers in #root, back to front: #c405hecker-a (the wide title page, with the
    red year #c405hecker-a-name on top), #c405hecker-b (the engraving, with the frame
    #c405hecker-b-frame that holds the portrait #c405hecker-b-face, and the name
    #c405hecker-b-who), and #c405hecker-c (the title page again, with the marker
    #c405hecker-c-m1). Timeline: a scales 1.014 to 1.082 over 4.11 seconds, and the year is set
    to opacity 0 at 4.11 seconds; b is shown at 4.11 and scales 1.014 to 1.082 for 4.13 seconds,
    while the portrait inside the frame scales 1.0 to 1.050 over the same time; the frame and the
    name are hidden at 8.24 seconds; c scales 1.0 to 1.050 from 8.24 for 2.5 seconds, and its
    marker scales in from 0 to full over 0.55 seconds at 9.02 seconds.
  CUSTOMIZE: The year is the text of #c405hecker-a-name, 250 px, set inline at top 640 px, in
    the red rgba(198, 58, 36, 0.92) of .dr-name. The name under the frame is the text of
    #c405hecker-b-who, 44 px bold in #f04a2e, in a 600 px box at left 1220 px that is centred
    under the frame (left 1338 px, 364 px wide, 454 px tall, a 12 px #e8765a border, top 236
    px). The portrait's file is named by data-media on the img with id c405hecker-b-face-img; set its src to swap it. Each picture's file is named by data-media on its img (see MEDIA). The marker is an
    inline left 60 px, top 200 px, 1680 by 185 px rectangle. Timing: the year ends at 4.11
    seconds, the frame and name run from 4.11 to 8.24 seconds, and the last layer starts at 8.24
    seconds. The 10.74 second length must match data-duration of c4-05-hecker-slot in index.html.
    The grade is the standard data-color-grading attribute on a, b and the portrait, and the
    lighter page grade on c.
  MEDIA: no media file is bundled. This file has four photo slots and one font slot. It has no sound, no
    video and no CSS image. The yellow marker bar (#c405hecker-c-m1) is a plain box, not a file.
    1. The title page, img #c405hecker-a-img (inside #c405hecker-a, from the start to 4.11 seconds, under the red
       year #c405hecker-a-name). It showed the wide title page of Justus Hecker's Die Tanzwuth (hecker-title-wide.jpg).
       It now shows a faint hatch stand-in labeled "PHOTO: assets/generated/hecker-title-wide.jpg". To plug in your
       picture, set the img's src to your file (for example assets/generated/hecker-title-wide.jpg). The data-media
       attribute only names the expected path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The engraving, img #c405hecker-b-img (inside #c405hecker-b, shown from 4.11 seconds, with the frame and name).
       It showed an engraving of the dancers of Kolbigk from Gottfried's chronicle of 1674 (kolbeck2.jpg). It now shows
       a stand-in labeled "PHOTO: assets/generated/kolbeck2.jpg". To plug in your picture, set the img's src to your file.
    3. The portrait, img #c405hecker-b-face-img (inside #c405hecker-b-face, in the frame #c405hecker-b-frame). It showed
       a framed portrait of Justus Hecker (f-hecker.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/f-hecker.jpg". To plug in your portrait, set the img's src to your file. The portrait
       should be upright to fit the frame. The name #c405hecker-b-who is plain text; keep it matching the portrait.
    4. The title page again, img #c405hecker-c-img (inside #c405hecker-c, from 8.24 seconds, with the marker from
       9.02 seconds). It showed the title page again (hecker-title.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/hecker-title.jpg". To plug in your picture, set the img's src to your file. It is graded
       with the lighter page grade.
    5. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-name (the year) and .dr-who (the name). It
       was a bundled woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it is
       installed, otherwise the sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face. The year and the name are claims about the source, so keep
       them true to the picture you plug in.
  WHEN TO USE: a book whose title page and author are the point, with the author's portrait named
    under a frame. Pick another layout when the beat needs a caption with a source, since this
    layout only names people and a year.
-->
