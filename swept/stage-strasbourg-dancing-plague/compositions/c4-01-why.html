    answers with a short dated list. A still (pro-faces3.jpg) is pushed slowly in for 3.58

    answers appear as it reaches them: 1518 KUTUKAN SANTO VITUS, 1526 PARACELSUS, 1832

    plays from 402.88 seconds in index.html, on the narration "Mengapa begitu banyak orang",
    and lasts 7.94 seconds.
  STRUCTURE: Two layers in #root, back to front: #c401why-a (the still, in a .dr-shot) and
    #c401why-b (the diagram, a .dr-shot with the class dg). Layer b is hidden until 3.58
    seconds, then shown. Timeline: a scales 1.014 to 1.073 with a drift in x and y over 3.58
    seconds; b scales 1.0 to 1.03 from 3.58 for 4.36 seconds; the line #c401why-b-line draws
    (dash offset 1540 to 0) from 3.78 for 2.4 seconds. Each answer is a tick (id ending -k), a
    year (-a) and a caption (-b) that appear at 3.94, 4.47, 5.00, 5.49 and 5.99 seconds.
  CUSTOMIZE: The five years are the .dg-label elements (ids c401why-b-a1 to a5) and the five

    column centres, so move a column and its tick together. The heading is at left 200, top
    300. Reveal times are the numbers after "3.58 +" in the tl calls; keep the last one below
    the 7.94 second length, which must match data-duration of c4-01-why-slot in index.html. The
    red accent is the class dg-red on year 5 and the stroke #e0482c of tick k5; everything else
    is #e9eae2 on #111517. Text is Arimo, 26 px bold for years and 20 px for captions. The
    still's grade is its data-color-grading attribute.
  MEDIA: no media file is bundled. This file has one photo slot and one font slot. It has no video, no
    sound and no CSS image. The diagram is drawn in code, so it needs no stand-in.
    1. The still, img #c401why-a-img (inside #c401why-a, visible for the first 3.58 seconds, then covered by the

    2. The font, the @font-face for "Arimo" (weights 400 to 700), used by all the text (.dg-label and .dg-small).
       It was a bundled woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used
       if it is installed, otherwise the sans-serif fallback of the font stack. To plug in your font, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: a chapter opener that asks a question and answers it with a short dated list of
    five items or fewer, each a year and a few words, spread over time. Pick another layout
    when the answers need full sentences or there are more than five, since the columns are
    fixed.
