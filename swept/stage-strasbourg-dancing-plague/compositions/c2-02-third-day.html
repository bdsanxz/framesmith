<!doctype html>
<!--
  GUIDE: compositions/c2-02-third-day.html (composition id "c2-02-third-day")
  WHAT: The second beat of chapter 2, 8.18 s, from 193.7 s in index.html, narrated by segment s20
    (opening "Keesokan paginya ia menari", the next morning she danced). The first picture,
    dance-feet, is shown from 0 to 4.39 s. From 4.39 s the second picture, spindler, is shown with
    the caption "Wabah menari 1518, dibayangkan kembali" (dancing plague of 1518, imagined again)
    and "Gambar Charles Spindler, 1893" (picture by Charles Spindler, 1893).
  STRUCTURE: #root holds two .dr-shot wrappers (#c202thirdday-a and -b) and one caption,
    #c202thirdday-b-cap (.dr-cap, left 207 px, top 800 px). Picture a pushes from scale 1.014 to
    1.086 over 4.39 s. At 4.39 s picture b is cut in by opacity and pushes over 3.79 s, and the
    caption is shown with it. Nothing fades the caption out; it stays to the end.
  CUSTOMIZE: each picture's file is named by data-media on its img (dance-feet.jpg, spindler.jpg); set
    the src to swap in your own (see MEDIA). The cut time
    4.39 appears in several tweens; change them together and keep the end inside data-duration
    (8.18 in index.html). The caption text is the two lines inside #c202thirdday-b-cap. Grades are in
    data-color-grading; spindler adds an exposure of -0.25.
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. It has no sound,
    no video and no CSS image.
    1. The dancing feet, img #c202thirdday-a-img (inside #c202thirdday-a, shown 0 to 4.39 s). It showed a
       picture of dancing feet (dance-feet.jpg). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/dance-feet.jpg". To plug in your picture, set the img's src to your file (for
       example assets/generated/dance-feet.jpg). The data-media attribute only names the expected path; it
       loads nothing. The img's data-color-grading still grades your picture.
    2. The Spindler picture, img #c202thirdday-b-img (inside #c202thirdday-b, shown from 4.39 s with the
       caption #c202thirdday-b-cap). It showed the picture the caption credits to Charles Spindler (1893).
       It now shows a stand-in labeled "PHOTO: assets/generated/spindler.jpg". To plug in your picture, set
       the img's src to your file. Its grade adds exposure -0.25 so the caption reads.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap. It was a bundled font
       file. It now reads local("Arimo"): the face is used if it is installed, otherwise the sans-serif
       fallback of the font stack. To plug in your font, add url("your-font.woff2") format("woff2") to the
       src list of that @font-face.
  WHEN TO USE: a short two-picture beat in which a second source is named in a caption. Pick another
    pattern when the film needs a fade, a figure or a map.
-->
