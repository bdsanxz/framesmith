  GUIDE: compositions/c4-12-agreed.html (composition id "c4-12-agreed")
  WHAT: About 12.3 seconds closing chapter 4, with no words on screen and no sound in this file
    (the narration is in index.html). It opens on the title page of Hecker's Die Tanzwuth (1832),
    pushed slowly in. At 4.06 seconds it cuts to Brant's dance ban of 2 August 1518, on the
    narration word "Tetapi" (but), and at 7.57 seconds it cuts to a Hondius footbridge plate of
    1642, on "pada" (in). Each picture is a file that is not bundled, so until you add it a faint
    hatched stand-in with its file name shows in its place (see MEDIA). It is mounted in index.html
    as #c4-12-agreed-slot, plays from 504.86 seconds, on the narration "Belum ada penjelasan yang"
    (no explanation has yet been agreed), and lasts 12.34 seconds.
  STRUCTURE: Three img layers in #root, each in its own .dr-shot wrapper, stacked in source
    order: #c412agreed-a at the back, then #c412agreed-b and #c412agreed-c. Layers b and c are
    set to opacity 0 at the start and shown at their cut times with a 0.001 second tween.
    Timeline: a scales 1.014 to 1.081 with a small x and y drift over 4.06 seconds; b scales 1.014
    to 1.072 from 4.06 for 3.51 seconds; c scales 1.014 to 1.092 from 7.57 for 4.77 seconds. There
    is no text, no marker and no transition.
  CUSTOMIZE: The three pictures are the img tags with ids c412agreed-a-img (back), c412agreed-b-img
    (middle) and c412agreed-c-img (front); their src attributes hold the stand-ins, so set each src
    to your file. The cut times 4.06 and 7.57 seconds are in the tl calls, and they match the
    narration words "Tetapi" at 508.92 seconds and "pada" at 512.43 seconds (504.86 plus each cut).
    If the narration moves, change the cut times and the narration offsets together. The 12.34
    second length must match data-duration of c4-12-agreed-slot in index.html. Push ends and offsets
    are in the tl calls, and the grade is the data-color-grading attribute on each picture.
  MEDIA: No media file is bundled in this composition. It has three photo slots and one font slot,
    and no sound, video or CSS image slot.
    1. Photo, back layer: the img #c412agreed-a-img inside #c412agreed-a. It showed
       assets/generated/hecker-title2.jpg, the title page of Hecker's 1832 book Die Tanzwuth. Now
       it shows the hatched stand-in naming that path (data-media). To plug in: set
       src="assets/generated/hecker-title2.jpg" on that img.
    2. Photo, middle layer: the img #c412agreed-b-img inside #c412agreed-b, hidden until 4.06
       seconds. It showed assets/generated/ban-sign.jpg, Brant's dance ban of 2 August 1518. The
       ban is a document, so keep the document in the picture if it is replaced, or caption the
       stand-in with its own source. Now it shows the stand-in naming that path. To plug in: set
       src="assets/generated/ban-sign.jpg" on that img.
    3. Photo, front layer: the img #c412agreed-c-img inside #c412agreed-c, hidden until 7.57
       seconds. It showed assets/generated/hon-wide3.jpg, a Hondius footbridge plate of 1642. Now
       it shows the stand-in naming that path. To plug in: set src="assets/generated/hon-wide3.jpg"
       on that img.
    Each picture keeps its data-color-grading grade. If a picture is missing, use a still of the
    same kind, or a dark ground that keeps the timing.
    4. Font: Arimo, in the @font-face rule at the top of the style block. It was a bundled file.
       Now the rule reads src: local("Arimo"), and this file has no text, so the font is never
       drawn here. To plug in (only if you add text): add url("assets/fonts/arimo-latin.woff2")
       format("woff2") to the src list of that rule.
  WHEN TO USE: a chapter closing on a sentence that admits no answer yet, answered by three
    pictures with no words. Pick another layout when the closing needs a caption.
-->
