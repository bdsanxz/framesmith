<!doctype html>
<!--
  GUIDE: compositions/c3-12-september.html (composition id "c3-12-september")
  WHAT: Beat 12, the last of chapter 3, on the outbreak's end in early September. The narration (Indonesian
    "Pada awal September, wabah ...") opens the early-September part of the outbreak. The beat opens on Hollar's
    view of Strasbourg from the Ill (about 1630) for 3.43 s, then cuts to Hollar's view of the Rhine near
    Strasbourg (1635). A red figure, "sekitar 7 pekan" (about 7 weeks), is set over the Rhine picture from the
    same cut. The beat runs 8.06 s; index.html mounts it at 390.62 s, under narration clip voice-s42.
  STRUCTURE: Two stacked layers in #root, back to front: #c312september-a (ill.jpg) and #c312september-b (rhine.jpg),
    each a .dr-shot wrapper, then the red figure #c312september-b-fig, a div outside the layers. The timeline
    (window.__timelines["c3-12-september"]) pushes layer a from 1.014 to 1.071 over 3.43 s. At 3.43 s it cuts in
    layer b and the figure together, and layer b pushes from 1.014 to 1.090 over 4.63 s. The figure stays until
    the end of the beat.
  CUSTOMIZE: Each picture's file is named by data-media on its img (ill.jpg, rhine.jpg); set the src to swap in
    your own (see MEDIA). The figure's two lines are "sekitar" and "7 pekan", split
    by br; its position is the inline top 330 px. Its style is .dr-figure: 64 px, bold italic, letter-spacing 0.12
    em, colour rgba(214,62,38,0.96) with a red glow. Keep the words and units in one figure; the file does not
    check that the figure matches the narration. The cut time 3.43 s and the total 8.06 s data-duration must match
    index.html.
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. It has no sound, no video
    and no CSS image.
    1. The first view, img #c312september-a-img (inside #c312september-a, shown 0 to 3.43 s). It showed Hollar's
       view of Strasbourg from the Ill (about 1630) (ill.jpg). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/ill.jpg". To plug in your picture, set the img's src to your file (for example
       assets/generated/ill.jpg). The data-media attribute only names the expected path; it loads nothing. The
       img's data-color-grading still grades your picture.
    2. The Rhine view, img #c312september-b-img (inside #c312september-b, cut in at 3.43 s, with the red figure
       #c312september-b-fig, which is plain text). It showed Hollar's view of the Rhine near Strasbourg (1635)
       (rhine.jpg). It now shows a stand-in labeled "PHOTO: assets/generated/rhine.jpg". To plug in your picture,
       set the img's src to your file.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-figure for the red figure. It was a
       bundled woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it is
       installed, otherwise the sans-serif fallback of the font stack. To plug in your font, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: a closing beat of a chapter, when a red number with its unit is wanted on a picture. Pick a caption
    (c3-01) instead when the picture's source is what needs to appear.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* The figure font, Arimo, is read from the installed fonts with local("Arimo"); no font file is bundled. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        /* The root is the 1920 by 1080 frame in dark slate (#0f1518), behind every layer. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* The red figure: number on one line, unit on the next, bold italic, tracked. */
        .dr-figure { position: absolute; left: 0; width: 1920px; text-align: center; font-family: "Arimo", sans-serif; font-weight: 700; font-style: italic; font-size: 64px; line-height: 1.28; letter-spacing: 0.12em; color: rgba(214, 62, 38, 0.96); text-shadow: 0 0 18px rgba(198, 58, 36, 0.45); white-space: nowrap; }
      </style>
      <!-- "Pada awal September, wabah ..." (390.62 s): ill from the start; rhine + red figure sekitar 7 pekan on "sekitar" (394.05 s). -->
      <div id="root" data-composition-id="c3-12-september" data-width="1920" data-height="1080">
        <!-- Layer 1 is the first still; layer 2 is cut in over it at 3.43 s, and the red figure sits above both. -->
        <div class="dr-shot" id="c312september-a" data-layout-allow-overflow><img id="c312september-a-img" src="data:image/svg+xml,%3C!--ill.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'649' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/ill.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/ill.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-shot" id="c312september-b" data-layout-allow-overflow><img id="c312september-b-img" src="data:image/svg+xml,%3C!--rhine.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'687' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/rhine.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/rhine.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-figure" id="c312september-b-fig" style="top: 330px;">sekitar<br />7 pekan</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        /* Phase 1, 0 to 3.43 s: the first picture pushes in; phase 2 cuts in the Rhine picture and the red figure at 3.43 s. */
        tl.fromTo("#c312september-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.071, x: 6, y: -2, duration: 3.43, ease: "none" }, 0.0);
        tl.fromTo("#c312september-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.090, x: -5, y: 3, duration: 4.63, ease: "none" }, 3.43);
        gsap.set("#c312september-b", { opacity: 0 });
        tl.to("#c312september-b", { opacity: 1, duration: 0.001 }, 3.43);
        gsap.set("#c312september-b-fig", { opacity: 0 });
        tl.to("#c312september-b-fig", { opacity: 1, duration: 0.001 }, 3.43);
        window.__timelines["c3-12-september"] = tl;
      </script>
    </template>
  </body>
</html>
