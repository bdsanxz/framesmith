  GUIDE: compositions/c2-09-debate.html (composition id "c2-09-debate")
  WHAT: The ninth beat of chapter 2, 9.86 s, from 259.52 s in index.html, narrated by segment s27

    with the red line already drawn in full through its three points. At 7.45 s a grey band is set over
    the chart from 50 to 200 dancers, labelled "50 to 200 penari" and credited with a source line that
    names Sezaman, after E. Clementz.
  STRUCTURE: #root holds two shots: #c209debate-a (the picture) and #c209debate-b (.dr-shot.dg, the chart).
    Inside the chart, an svg draws the axes, the gridlines, the band rect #c209debate-b-band (x 330,
    y 560, width 1370, height 195), the red line #c209debate-b-line with stroke-dashoffset 0 (fully drawn
    at once), and the points -p1 to -p3. Labels are absolute divs: the title, the scale, the time labels

    line #c209debate-b-bs. Timeline: a pushes 0 to 2.54 s; b is cut in at 2.54 s and scales from 1.0 to
    1.03 over 7.32 s; the band, its label and its source appear at 7.45 s.
  CUSTOMIZE: the picture's file is named by data-media on #c209debate-a-img (ban-detail.jpg); set its src
    to swap in your own (see MEDIA). The band is the rect attributes;
    on the 100 to 400 scale of c2-07-imlin.html (130 px per 100 dancers, zero at y 820) its top y 560 is 200
    and its bottom y 755 is 50. The band label and source text are the text of #c209debate-b-bl and
    #c209debate-b-bs. The band appears at 7.45 s; move that time to the word that names the range. To draw
    the red line in as c2-07 does, set its dashoffset to 1200 and tween it to 0. Colours as in c2-07.
  MEDIA: no media file is bundled. This file has one photo slot and one font slot. It has no sound, no
    video and no CSS image. The chart is drawn in code, so it needs no media.
    1. The detail picture, img #c209debate-a-img (inside #c209debate-a, shown 0 to 2.54 s). It showed a close
       detail of the ban (ban-detail.jpg). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/ban-detail.jpg". To plug in your picture, set the img's src to your file (for
       example assets/generated/ban-detail.jpg). The data-media attribute only names the expected path; it
       loads nothing. The img's data-color-grading still grades your picture.
    2. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dg-label, .dg-small and .dr-figure.
       It was a bundled font file. It now reads local("Arimo"): the face is used if it is installed, otherwise
       the sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: showing a range of values that sources give, as a band over a chart. Pick c2-07-imlin.html
