<!doctype html>
<!--
  GUIDE: compositions/c3-08-ban.html (composition id "c3-08-ban")
  WHAT: Beat 8 of chapter 3, on the dance ban. The narration (Indonesian "Larangan itu dicatat oleh ...")
    says the ban was recorded. The first picture is the ban of 2 August 1518, signed by Sebastian Brant, with
    a yellow marker wiping over its first line at 1.87 s and a caption that names the date. Then three
    pictures are cut in: Bruegel's Wedding Dance (about 1566) at 4.15 s with a caption, the Nuremberg Chronicle
    page fol. 217r (1493) at 6.27 s, and Dürer's piper and drummer (about 1504) at 7.83 s. The beat runs 10.18 s;
    index.html mounts it at 356.06 s, under narration clip voice-s38.
  STRUCTURE: Four stacked layers in #root, back to front: #c308ban-a (ban.jpg, with the marker #c308ban-a-m1
    and the caption #c308ban-a-cap), #c308ban-b (wedding.jpg, caption #c308ban-b-cap), #c308ban-c
    (dancers2-lute.jpg) and #c308ban-d (drummer.jpg). Each is a .dr-shot wrapper. The timeline
    (window.__timelines["c3-08-ban"]) scales the marker from 0 to 1 at 1.87 s over 0.31 s, pushes layer a from
    1.0 to 1.050 over 4.15 s, and hides its caption at 4.15 s. It cuts in layer b at 4.15 s and pushes it to
    1.051 over 2.12 s, hiding its caption at 6.27 s. It cuts in layer c at 6.27 s and pushes it to 1.042 over
    1.56 s, and cuts in layer d at 7.83 s, drifting from the right to 1.054 over 2.35 s.
  CUSTOMIZE: The marker is a div with an inline left, top, width and height in frame pixels (440 by 110 px at
    1360,840); copy it to mark another line. Its colour is rgba(255,214,64,0.55) in .dr-mark, with multiply
    blending. Caption text is the two lines in each caption div; a's caption sits at top 880 px by inline style.
    The cut times 4.15, 6.27 and 7.83 must match the ends of the layers before them, and the total is the
    10.18 s data-duration in index.html. The ban uses the lighter page grade (exposure -0.25, no wheels), since
    it is a printed page; the other pictures use the usual grade.
  MEDIA: no media file is bundled. This file has four photo slots and one font slot. It has no sound, no
    video and no CSS image. The yellow markers are plain boxes, not files.
    1. The ban, img #c308ban-a-img (inside #c308ban-a, shown 0 to 4.15 s, with the marker #c308ban-a-m1 and the
       caption #c308ban-a-cap). It showed the ban of 2 August 1518, a printed page (ban.jpg). It now shows a
       faint hatch stand-in labeled "PHOTO: assets/generated/ban.jpg". To plug in your picture, set the img's src
       to your file (for example assets/generated/ban.jpg). The data-media attribute only names the expected
       path; it loads nothing. The img's data-color-grading still grades your page with the lighter page grade.
    2. Bruegel's Wedding Dance, img #c308ban-b-img (inside #c308ban-b, cut in at 4.15 s, with the caption
       #c308ban-b-cap until 6.27 s). It showed Bruegel's Wedding Dance (about 1566) (wedding.jpg). It now shows a
       stand-in labeled "PHOTO: assets/generated/wedding.jpg". To plug in your picture, set the img's src to your
       file.
    3. The chronicle page, img #c308ban-c-img (inside #c308ban-c, cut in at 6.27 s). It showed the Nuremberg
       Chronicle page fol. 217r (1493) (dancers2-lute.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/dancers2-lute.jpg". To plug in your picture, set the img's src to your file.
    4. The drummer, img #c308ban-d-img (inside #c308ban-d, cut in at 7.83 s and drifting from the right). It
       showed Dürer's piper and drummer (about 1504) (drummer.jpg). It now shows a stand-in labeled
       "PHOTO: assets/generated/drummer.jpg". To plug in your picture, set the img's src to your file.
    5. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap for both captions. It was a
       bundled woff2 file (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it
       is installed, otherwise the sans-serif fallback of the font stack. To plug in your font, add
       url("your-font.woff2") format("woff2") to the src list of that @font-face.
  WHEN TO USE: a beat where a document is marked and a few pictures follow for the narration's examples. Pick
    c3-01 for a single picture with a source line.
-->
