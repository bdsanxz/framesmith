<!doctype html>
<!--
  GUIDE: compositions/c3-04-halls.html (composition id "c3-04-halls")
  WHAT: Beat 4 of chapter 3, on the council's measures. The narration (Indonesian "Maka dewan
    mengosongkan dua ...") says the council cleared two halls, the two guildhalls and
    the grain market. The beat shows the Braun and Hogenberg plan of Strasbourg (1572) for 4.21 s, then
    cuts to a carpenter from Jost Amman's Staendebuch (1568), captioned with its source. It runs 8.1 s;
    index.html mounts it at 318.86 s, under narration clip voice-s34.
  STRUCTURE: Two stacked layers in #root, back to front: #c304halls-a (the plan, civ-north2.jpg) and
    #c304halls-b (the carpenter, carpenter.jpg). The caption #c304halls-b-cap is a sibling of the layers.
    Each layer is a .dr-shot wrapper. The timeline (window.__timelines["c3-04-halls"]) pushes layer a
    from scale 1.014 to 1.083 over 4.21 s. At 4.21 s layer b is cut in with its caption, and it pushes
    from 1.014 to 1.078 over 3.89 s.
  CUSTOMIZE: Each picture's file is named by data-media on #c304halls-a-img and #c304halls-b-img; set the src
    to swap in your own (see MEDIA). The caption is the two lines
    inside #c304halls-b-cap, split by the br tag; its place comes from .dr-cap (left 207 px, top 800 px,
    30 px Arimo). The cut time 4.21 s is the end of the first push and the start of the second, so change
    both. The total is the 8.1 s data-duration in index.html. The carpenter adds exposure -0.25 in its
    data-color-grading so the caption can be read.
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. It has no sound, no
    video and no CSS image.
    1. The plan, img #c304halls-a-img (inside #c304halls-a, shown 0 to 4.21 s). It showed the Braun and
       Hogenberg plan of Strasbourg (1572). It now shows a faint hatch stand-in labeled
       "PHOTO: assets/generated/civ-north2.jpg". To plug in your plan, set the img's src to your file (for
       example assets/generated/civ-north2.jpg). The data-media attribute only names the expected path; it
       loads nothing. The img's data-color-grading still grades your picture.
    2. The carpenter, img #c304halls-b-img (inside #c304halls-b, cut in at 4.21 s, with the caption
       #c304halls-b-cap). It showed Amman's carpenter from the Staendebuch (1568). It now shows a stand-in
       labeled "PHOTO: assets/generated/carpenter.jpg". To plug in your picture, set the img's src to your
       file. Its grade adds exposure -0.25 so the caption reads.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap. It was a bundled woff2 file
       (assets/fonts/arimo-latin.woff2). It now reads local("Arimo"): the face is used if it is installed,
       otherwise the sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
  WHEN TO USE: a beat that shows a place and then a trade, each named on screen, cut in on the narration's
    word. Pick c3-07 when no caption is wanted.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* The caption font, Arimo, is read from the installed fonts with local("Arimo"); no font file is bundled. */
        @font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: block; src: local("Arimo"); }
        /* The root is the 1920 by 1080 frame in dark slate (#0f1518), behind every layer. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }
        /* One wrapper per shot: the push is on the wrapper, the grade on the media. */
        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* The caption: where the picture comes from, two plain white lines. */
        .dr-cap { position: absolute; left: 207px; top: 800px; font-family: "Arimo", sans-serif; font-weight: 400; font-size: 30px; line-height: 38px; color: #eef1ee; text-shadow: 0 0 4px #0a0c0d, 0 0 9px #0a0c0d, 0 0 18px #0a0c0d, 0 0 34px rgba(10, 12, 13, 0.85); white-space: nowrap; }
      </style>
      <!-- "Maka dewan mengosongkan dua ..." (318.86 s): civ-north2 from the start; carpenter + caption on "lalu" (323.07 s). -->
      <div id="root" data-composition-id="c3-04-halls" data-width="1920" data-height="1080">
        <!-- Layers 1 and 2 are stacked: the Braun and Hogenberg plan, then the carpenter, cut in at 4.21 s with its caption. -->
        <div class="dr-shot" id="c304halls-a" data-layout-allow-overflow><img id="c304halls-a-img" src="data:image/svg+xml,%3C!--civ-north2.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'782' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/civ-north2.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/civ-north2.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-shot" id="c304halls-b" data-layout-allow-overflow><img id="c304halls-b-img" src="data:image/svg+xml,%3C!--carpenter.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'763' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/carpenter.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/carpenter.jpg" alt="" data-color-grading='{"adjust":{"contrast":0.1,"saturation":-0.32,"blacks":-0.22,"temperature":-0.05,"exposure":-0.25},"wheels":{"shadows":{"hue":192,"amount":0.26},"highlights":{"hue":35,"amount":0.14}},"details":{"vignette":0.2,"grain":0.08}}' /></div>
        <div class="dr-cap" id="c304halls-b-cap">Tukang kayu<br />Jost Amman, Ständebuch, 1568</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        /* Phase 1, 0 to 4.21 s: the plan pushes in; phase 2 cuts in the carpenter and its caption at 4.21 s and pushes it on. */
        tl.fromTo("#c304halls-a", { scale: 1.014, x: -6, y: 2 }, { scale: 1.083, x: 6, y: -2, duration: 4.21, ease: "none" }, 0.0);
        tl.fromTo("#c304halls-b", { scale: 1.014, x: 5, y: -3 }, { scale: 1.078, x: -5, y: 3, duration: 3.89, ease: "none" }, 4.21);
        gsap.set("#c304halls-b", { opacity: 0 });
        tl.to("#c304halls-b", { opacity: 1, duration: 0.001 }, 4.21);
        gsap.set("#c304halls-b-cap", { opacity: 0 });
        tl.to("#c304halls-b-cap", { opacity: 1, duration: 0.001 }, 4.21);
        window.__timelines["c3-04-halls"] = tl;
      </script>
    </template>
  </body>
</html>
