<!--
  GUIDE: compositions/c1-11-1374.html (composition id "c1-11-1374")
  WHAT: A beat on the outbreak of 1374 and the towns of the Rhine where it appeared. It opens on a
    woodcut of dancers with a priest (dancers2.jpg, a page of the Nuremberg Chronicle of 1493) from the start. At 2.35 s it cuts to a view of the Rhine (rhine2.jpg) with the red year
    "1374" over it until 4.96 s. From 4.96 s a map of the Rhine towns takes over and pushes in to the
    end at 8.58 s: six named dots (Strasbourg, Aachen, Köln, Metz, Utrecht and Trier) along a thin
    Rhine route, with the label "Sungai Rhein" (Rhine river). index.html mounts it as c1-11-1374-slot
    at 162.44 s.
  STRUCTURE: back to front: #c1111374-a (the dancers), #c1111374-b (the Rhine) with its red year
    #c1111374-b-name after it, and #c1111374-c (the map shot), which holds its own sea (.mp-sea), map
    image (#c1111374-c-map), route (an svg .mp-lines path), grain, shade, six dot and label pairs and
    the river note. The paused GSAP timeline, registered as window.__timelines["c1-11-1374"], pushes
    the dancers from 0 s (scale 1.014 to 1.054 over 2.35 s); from 2.35 s shows the Rhine and the year
    and pushes it (to 1.058 over 2.61 s); at 4.96 s hides the year and shows the map, which scales
    from 2.0 to 2.14 over 3.62 s. The map's transform origin is 1000 px 450 px.
  CUSTOMIZE: the red year is the text "1374" with top 150 px and font-size 250 px set inline. Each
    town is a .mp-dot and a .mp-label placed by inline left and top pixels; to add or move a town,
    copy one dot and label pair and change its position and name. The route is one path of 16 points,
    with a stroke of 3 px (the map in c1-01-city.html uses 4.5 px). The map's start and end scales
    (2.0 and 2.14) and the cut times 2.35 and 4.96 are in the tweens. The last tween ends at 8.58 s,
    which must match the data-duration that index.html gives c1-11-1374-slot.
  MEDIA: no media file is bundled. This file has two photo slots and one font slot. It has no sound and no CSS image.
    Bundled drawing (SVG, kept): the map, img #c1111374-c-map (.mp-map, 3840 x 2160 px, inside #c1111374-c, which
    cuts in at 4.96 s), src assets/generated/map-europe.svg. It is the same map of Europe that c1-01-city.html uses:
    orange land and dark borders on the blue sea. It renders as it is and needs nothing plugged in. The blue sea
    (#3f7f9f in .mp-sea), the Rhine route, the grain, the six dots and the labels are the rest of the scene. To use
    your own map, set the img's src to your own SVG (keep the 3840 x 2160 px size, or change the width and height
    together).
    1. The dancers, img #c1111374-a-img (inside #c1111374-a, on screen from the start). It showed a woodcut
       of dancers with a priest (Nuremberg Chronicle, fol. 217r, 1493). It now shows a faint hatch stand-in
       labeled "PHOTO: assets/generated/dancers2.jpg". To plug in your picture, set the img's src to your
       file (for example assets/generated/dancers2.jpg). The data-media attribute only names the expected
       path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The Rhine, img #c1111374-b-img (inside #c1111374-b, which cuts in at 2.35 s; the red year is over it
       until 4.96 s). It showed Hollar's Rhine near Strasbourg (1635). It now shows a stand-in labeled
       "PHOTO: assets/generated/rhine2.jpg". To plug in your picture, set the img's src to your file.
    3. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-name, .mp-label and .mp-note.
       It was a bundled font file. It now reads local("Arimo"): the face is used if it is installed, otherwise
       the sans-serif fallback of the font stack. To plug in your font, add url("your-font.woff2")
       format("woff2") to the src list of that @font-face.
    The red year "1374" is plain text and needs no file.
  WHEN TO USE: a beat that names an outbreak year and then shows the towns it reached on a map. Pick
    another composition when the beat has no year or no route to draw.
-->
