<!doctype html>
<!--
  GUIDE: compositions/c2-04-too-late.html (composition id "c2-04-too-late")
  WHAT: The fourth beat of chapter 2, 6.02 s, from 214.78 s in index.html, narrated by segment s22
    (opening "Tetapi sudah terlambat", but it was already too late). Two pictures with no text:
    pro-left from 0 to 2.18 s, then hon-wide from 2.18 s to the end. Each picture pushes slowly, and
    the cut between them is an opacity change.
  STRUCTURE: #root holds two .dr-shot wrappers, #c204toolate-a and #c204toolate-b. Picture a pushes
    from scale 1.014 to 1.052 over 2.18 s. At 2.18 s picture b is cut in by opacity and pushes from
    1.014 to 1.078 over 3.84 s. There is no caption, figure or lower third.
  CUSTOMIZE: each picture's file is named by data-media on its img (pro-left.jpg, hon-wide.jpg); set the
    src to swap in your own (see MEDIA). The cut time 2.18
    appears in two tweens and must stay where the narration changes picture; the last tween must end
    inside data-duration (6.02 in index.html). Grades are in data-color-grading. To add a caption, copy
    the .dr-cap rule and an element from c2-02-third-day.html; this file defines only the .dr-shot rules.
  MEDIA: no media file is bundled. This file has two photo slots. It has no sound, no video and no CSS
    image. It declares the Arimo font, but no element uses it, so no font file is needed.
    1. The first picture, img #c204toolate-a-img (inside #c204toolate-a, shown 0 to 2.18 s). It showed
       pro-left.jpg. It now shows a faint hatch stand-in labeled "PHOTO: assets/generated/pro-left.jpg".
       To plug in your picture, set the img's src to your file (for example assets/generated/pro-left.jpg).
       The data-media attribute only names the expected path; it loads nothing. The img's
       data-color-grading still grades your picture.
    2. The second picture, img #c204toolate-b-img (inside #c204toolate-b, shown from 2.18 s to the end). It
       showed hon-wide.jpg. It now shows a stand-in labeled "PHOTO: assets/generated/hon-wide.jpg". To plug
       in your picture, set the img's src to your file.
    If you add text later, the Arimo face needs its file: add url("your-font.woff2") format("woff2") to the
    src list of its @font-face, which is currently local("Arimo") and falls back to the sans-serif stack.
  WHEN TO USE: a short silent beat of two pictures, with the narration carrying the sense. Pick another
    pattern when a source or figure must appear on screen.
-->
