<!doctype html>
<!--
  GUIDE: compositions/c1-07-disease.html (composition id "c1-07-disease")
  WHAT: A beat on the diseases that weighed on the city: leprosy, plague and the new disease syphilis.
    A picture of the dance of death holds from the start, a close picture of the same dance cuts in
    at 2.17 s, and at 5.2 s a woodcut of Brant's broadsheet on
    syphilis takes over, with the caption "Selebaran Sebastian Brant tentang sifilis" (Brant's
    broadsheet on syphilis) and "Basel, 1496". It runs 7.86 s; index.html mounts it as
    c1-07-disease-slot at 128.68 s.
  STRUCTURE: three .dr-shot wrappers in document order: #c107disease-a (the dance of death), -b (its
    close shot) and -c (the syphilis woodcut). The caption #c107disease-c-cap sits after -c, so it
    stays above the picture. The paused GSAP timeline, registered as
    window.__timelines["c1-07-disease"], pushes the first picture from 0 s (scale 1.014 to 1.052 over
    2.17 s); at 2.17 s it shows the close shot and pushes it (to 1.065 over 3.03 s); at 5.2 s it
    shows the syphilis picture and its caption and pushes the picture (to 1.059 over 2.66 s).
  CUSTOMIZE: the caption text is in the markup: "Selebaran Sebastian Brant tentang sifilis" on the
    first line and "Basel, 1496" on the second. Its place is left 207 px and top 800 px in .dr-cap.
    The cut times 2.17 and 5.2 and the push amounts are in the tweens. The syphilis picture's grade
    adds exposure -0.25 in its data-color-grading, so the white caption reads over the pale print;
    the other two use the standard grade. The last tween ends at 7.86 s, which must match the
    data-duration that index.html gives c1-07-disease-slot.
  MEDIA: no media file is bundled. This file has three photo slots and one font slot. It has no sound
    and no CSS image.
    1. The dance of death, img #c107disease-a-img (inside #c107disease-a, on screen from the start). It
       showed the dance of death from the Nuremberg Chronicle (1493). It now shows a faint hatch stand-in
       labeled "PHOTO: assets/generated/deathdance.jpg". To plug in your picture, set the img's src to
       your file (for example assets/generated/deathdance.jpg). The data-media attribute only names the
       expected path; it loads nothing. The img's data-color-grading still grades your picture.
    2. The close shot, img #c107disease-b-img (inside #c107disease-b, which cuts in at 2.17 s). It showed
       a close picture of the same dance of death. It now shows a stand-in labeled
       "PHOTO: assets/generated/deathdance-close.jpg". To plug in your picture, set the img's src to your file.
    3. The syphilis woodcut, img #c107disease-c-img (inside #c107disease-c, which cuts in at 5.2 s, with
       the caption #c107disease-c-cap). It showed the woodcut of Brant's broadsheet on syphilis (Basel,
       1496). It now shows a stand-in labeled "PHOTO: assets/generated/syphilis.jpg". To plug in your
       picture, set the img's src to your file.
    4. The font, the @font-face for "Arimo" (weights 400 to 700), used by .dr-cap. It was a bundled font
       file. It now reads local("Arimo"): the face is used if it is installed, otherwise the sans-serif
       fallback of the font stack. To plug in your font, add url("your-font.woff2") format("woff2") to the
       src list of that @font-face.
  WHEN TO USE: a beat that lists diseases of the time and shows a dance of death with a dated
    caption. Pick another composition when the beat names no disease or no dated source.
-->

        #root { position: absolute; inset: 0; overflow: hidden; background: #0f1518; }

        .dr-shot { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .dr-shot [data-media-kind="video"], .dr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
