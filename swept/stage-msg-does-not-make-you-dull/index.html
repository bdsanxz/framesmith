    in z order: #tear-slot (z 5), #fx-slot (z 6), #captions-slot (z 7), #paper-slot (z 8), #mark-slot (z 9), each pointing
    at its file in compositions/. Then the sound slots, shown as SOUND SLOT comments: voice segments (track 10), the bed
    (track 11), and the seam sounds (tracks 12 to 14). The main tl (paused, registered as "main") runs three tweens on the
    videos: a blur-in on #v-s01 at 0 s (0.17 s), a zoom out on #v-s26 at 20.77 s (0.13 s, to scale 1.35), and a zoom in
    on #v-s27 at 20.9 s (0.17 s).
  CUSTOMIZE: change the manifests (shots.json, cut.json, captions.txt) and build again, never this file:
    it is rewritten on every build. The seam timings are RISE, HOLD, FALL, TEAR, ZOOM_IN, ZOOM_OUT
    at the head of scripts/paper-flash-build.py. After a build set the bed again with scripts/duck-under-voice.py index.html.
    The shot times, the mount times and the zoom times all come from the build, so they change together through the manifests.
  MEDIA: no media file is bundled. Every slot is listed here, in the order the file has them.
