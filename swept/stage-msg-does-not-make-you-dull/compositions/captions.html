    40.24 s film: the first starts at 0.19 s and the last ends at 40.24 s. The host mounts it over the whole film
    from index.html (the captions-slot, z-index 7).

    data-start/data-duration run from its first word to the next card, on tracks 0, 1 and 2 in turn. Each card has
    one 0.07 s tween at its own data-start (opacity 0.35 and scale 0.94 to 1), so it comes in dim and a touch small
    and is full white about two frames later. The font size steps down for longer cards: 112 px for most, 98 px for
    cw-30, cw-57, cw-61 and cw-74, and 82 px for the last card, cw-80.

    it is rewritten on every build. The seam timings are RISE, HOLD, FALL, TEAR, ZOOM_IN, ZOOM_OUT
    at the head of scripts/paper-flash-build.py. The values the build writes here must change together: top (1440px)
    and height (130px) with line-height (130px), so the caps stay centred in their box; the inline font-size of each
    card (112, 98 or 82 px); the 16px outline in -webkit-text-stroke and the hard shadow in text-shadow; and the 0.35
    start opacity, 0.94 start scale and 0.07 s length of each tween, which set how a card arrives.
  MEDIA: no media file is bundled. The one slot is the caption font. The @font-face at the top of the style block
    declares "Lilita One" with src local("Lilita One"), so the cards are set in Lilita One when it is installed on the
    machine, and in the sans-serif of the font stack when it is not. No picture, video or sound is in this file. To
    plug in your own font, add a url source before the local one in that @font-face, for example
    src: url("fonts/your-caption-font.woff2") format("woff2"), local("Lilita One"); with the path of your file.
  WHEN TO USE: a vertical Short (1080x1920) cut fast on the spoken words, in the paper flash transitions style
