    the incoming shot shows as a black-and-white halftone print, and white torn paper lines both edges. It lasts 0.33 s,
    mounted from 4.14 s to 4.47 s, just before the shot it opens on (shot s06, which starts at 4.47 s).

    registered as "tear") drives two custom properties on #root, named e and w in the CSS (their names start with a double
    dash): e goes from 0 to 1 over 0.07 s, a thin white line for about two frames, and w goes from 0 to 190px from 0.05 s
    to 0.33 s, opening the gap to a third of the frame.

    w tween, the 0.33 s length (the clip's data-duration, the #tear-in data-duration and the tween end must agree), and
    the 0.07 s line time. The polygon points are generated from the seed.

    1. Video #tear-in, inside #gap. It is a video slot (data-media-kind="video"). It showed footage/s06.mp4, the incoming

    2. CSS image, the edge paper of #edge-l and #edge-r (the .edge rule). It was a photo of crumpled white paper,
       assets/paper/crumpled-white.jpg. Now the rule shows its #f6f5f1 colour where the word none stands. To plug in the
       photo, change none in that background rule to url("assets/paper/crumpled-white.jpg").
    3. Sound: none in this file. The rip sound is the sound slot #sfx-tear-6 in index.html.
    No font is used here.
  WHEN TO USE: a vertical Short (1080x1920) cut fast on the spoken words, in the paper flash transitions style
    (references/paper-flash-transitions.md). For a calm or long-form film use another style.
