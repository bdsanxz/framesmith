<!-- hyperframes-registry-item: freeze-frame-dressing -->
<!--
  GUIDE: compositions/freeze-frame-dressing.html (composition id "freeze-frame-dressing")
  WHAT: a 4 s print dressing for a freeze frame: a white flash first, then a cream paper panel with
    red and yellow corner tints fades in just after it, two small tape strips snap onto the paper,
    and everything fades out near the end. Mounted by index.html at 16.04 s for 4 s on track 8, so
    the flash lands on the 17 s freeze in the photo card below it.
  STRUCTURE: back to front: #hf-freeze-paper (full-frame cream paper with red and yellow corners and
    a clipped, irregular edge), #hf-freeze-tape-a and #hf-freeze-tape-b (two small strips), then
    #hf-freeze-flash (full-frame white). Timeline: the hit is 24 percent into the window, and the
    exit is 0.3 s before the end, but at least 0.7 s after the hit. At the hit the flash rises to
    0.95 and clears over 0.24 s; the paper fades to 0.64 opacity from hit plus 0.04 s; tape A scales
    in at hit plus 0.3 s and tape B at hit plus 0.42 s; the paper and both tapes fade out at the exit.
  CUSTOMIZE: the paper colors are in the gradients of #hf-freeze-paper (red 248 84 73, yellow 255 221
    82, cream 244 240 224), with its 0.64 opacity and its clip-path edge. Tape size (12.5vmin by
    2.9vmin), tint, rotation (minus 8 and 7 degrees) and positions are in the tape rules. The flash
    color is #fff. The timing numbers are in the script. If the freeze moves, keep the host start plus
    0.96 s on the freeze time (17 s in index.html).
  MEDIA: No media file is bundled. The file has no slots: the paper, the two tapes and the flash are CSS
    gradients and shapes, with no picture, video, sound or font, so nothing is to be plugged in.
  WHEN TO USE: a printed photo or scrapbook look over a frozen frame. For a clean photo or a modern
    look, use no dressing.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      /* Cream paper panel: red and yellow corner tints on a light base, with an irregular clipped edge. */
      #hf-freeze-paper {
        position: absolute;
        inset: 0;
        opacity: 0;
        background:
          linear-gradient(115deg, rgb(248 84 73 / 86%) 0 16%, transparent 16%),
          linear-gradient(345deg, rgb(255 221 82 / 92%) 0 17%, transparent 17%),
          linear-gradient(rgb(244 240 224 / 78%), rgb(244 240 224 / 78%));
        clip-path: polygon(2% 8%, 97% 2%, 94% 94%, 6% 98%);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      /* Shared style for the two tape strips: small, translucent yellow, with a soft shadow. */
      .hf-freeze-tape {
        position: absolute;
        width: 12.5vmin;
        height: 2.9vmin;
        opacity: 0;
        background: rgb(255 236 168 / 76%);
        border: 1px solid rgb(110 91 55 / 18%);
        box-shadow: 0 0.3vmin 0.8vmin rgb(20 16 10 / 18%);
        pointer-events: none;
      }

      /* Tape strip A, rotated at the upper left. */
      #hf-freeze-tape-a {
        top: 8%;
        left: 12.5%;
        transform: rotate(-8deg);
      }

      /* Tape strip B, rotated at the lower right. */
      #hf-freeze-tape-b {
        right: 12.5%;
        bottom: 7%;
        transform: rotate(7deg);
      }

      /* Full-frame white flash that fires at the freeze. */
      #hf-freeze-flash {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: #fff;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="freeze-frame-dressing"
      data-composition-id="freeze-frame-dressing"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <!-- Dressing layers, back to front: the paper, the two tapes, then the flash on top. -->
      <div id="hf-freeze-paper" aria-hidden="true"></div>
      <div id="hf-freeze-tape-a" class="hf-freeze-tape" aria-hidden="true"></div>
      <div id="hf-freeze-tape-b" class="hf-freeze-tape" aria-hidden="true"></div>
      <div id="hf-freeze-flash" aria-hidden="true"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* Lookup: the paper layer and its composition host, which gives the window length. */
      var paper = document.getElementById("hf-freeze-paper");
      var host = paper && paper.closest("[data-composition-id]");
      if (!host) throw new Error("Freeze-Frame Dressing could not find its composition host");

      var compositionId = host.getAttribute("data-composition-id");
      var duration = Number(host.getAttribute("data-duration")) || 4;
      /* Beat times: the hit is 24 percent into the window; the exit is 0.3 s before the end, at least 0.7 s after the hit. */
      var hit = Math.max(0.1, duration * 0.24);
      var exit = Math.max(hit + 0.7, duration - 0.3);
      var tl = gsap.timeline({ paused: true });

      /* Empty tween that gives the timeline the full window length. */
      tl.to({}, { duration: duration, ease: "none" }, 0);
      /* The flash: a quick white burst at the hit time, then it clears. */
      tl.to("#hf-freeze-flash", { opacity: 0.95, duration: 0.06, ease: "power2.out" }, hit);
      tl.to("#hf-freeze-flash", { opacity: 0, duration: 0.24, ease: "power2.in" }, hit + 0.06);
      /* The paper fades in just after the flash, to 0.64 opacity. */
      tl.to("#hf-freeze-paper", { opacity: 0.64, duration: 0.18, ease: "power2.out" }, hit + 0.04);
      /* Tape A snaps in from a larger scale, 0.3 s after the hit. */
      tl.fromTo(
        "#hf-freeze-tape-a",
        { opacity: 0, scale: 1.18 },
        { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" },
        hit + 0.3,
      );
      /* Tape B follows 0.12 s after tape A. */
      tl.fromTo(
        "#hf-freeze-tape-b",
        { opacity: 0, scale: 1.18 },
        { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" },
        hit + 0.42,
      );
      /* Exit: the paper and both tapes fade out together. */
      tl.to(
        ["#hf-freeze-paper", "#hf-freeze-tape-a", "#hf-freeze-tape-b"],
        { opacity: 0, duration: 0.24, ease: "power2.in" },
        exit,
      );

      window.__timelines[compositionId] = tl;
    </script>
  </body>
</html>
