<!doctype html>
<!--
  GUIDE: index.html (root composition, id "main")
  WHAT: The whole film, 67.5 s at 1920x1080, on the 1883 eruption of Krakatoa as heard round the
    world. The dark half opens with a map of the Sunda Strait, then an 1883 photograph and 1930
    film of Anak Krakatau cut on the narration with gold tags, a stat that counts to the death toll,
    and a statement card. From 28.46 s to 52.98 s a paper-collage block shows a person card, a
    number card, and a paper diagram of the sound spreading over the Indian Ocean. The dark half
    returns for a counted figure and an ending on Anak Krakatau. Ten narration clips run over the
    whole film, with music and sound effects under them.
  STRUCTURE: The root #root (1920x1080, 67.5 s) lists its hosts in order. Each host is a div with a
    data-composition-src that mounts a file from compositions/ at a fixed start and length: map 0 s
    for 5.55 s; eruption 5.55 s for 8.45 s; waves 14 s for 3.93 s; stat 17.93 s for 4.89 s; statement
    22.82 s for 5.64 s; verbeek 28.46 s for 6.55 s; villages 35.01 s for 4.8 s; rings 39.81 s for
    13.17 s; barographs 52.98 s for 5.08 s; ending 58.06 s for 9.44 s. Track 2 mounts paper (28.46 s
    for 24.52 s, laid over the collage block). Track 3 mounts subs (0 s for the whole film). Audio
    follows: the music beds bed-a and bed-b, the rumble amb-rumble, the blast and guns, the sfx-* hits
    and the ten narration clips voice-s01 to voice-s10. The root script only creates an empty, paused
    GSAP timeline; each composition runs its own.
  CUSTOMIZE: To move a scene, change its host's data-start and data-duration here, and keep the
    composition's own tweens in step: they are timed from the scene's start, not the film's. The music
    level is set by data-automation volume lanes: bed-a sits at 0.0658 up to 9.72 s, and bed-b at about
    0.064 from 17.93 s, then rises and falls back to 0 at 49.57 s of its own length. sfx-blast and
    sfx-guns carry data-duck="off" so the voice does not duck them. The impact hits (sfx-stat,
    sfx-stamp-*, sfx-slap-*) each have a lane that brings them level with the voice for a third of a
    second and fades them within a second. The narration clips are written by scripts/narration-segments.py
    (marked do not edit): regenerate them, then update the matching data-start and data-duration.
  MEDIA: No media file is bundled. This file has no photo, video, font or CSS image slot of its own:
    the scene compositions carry their own slots, and each guide lists them. Its slots are sound slots,
    shown as SOUND SLOT comments in the body, and they play nothing now. Music: bed-a (from 0 s, for
    9.72 s) and bed-b (from 17.93 s, for 49.57 s, starting 20 s into the file), both from
    assets/generated/src/bed.mp3, which make-footage.sh made. Real sounds: sfx-blast (from
    assets/generated/src/blast.mp3), amb-rumble (from assets/generated/src/rumble.mp3, starting 18 s into
    the file) and sfx-guns (from assets/generated/src/guns.mp3). Hits: sfx-fly, sfx-pin, sfx-type-1 to
    sfx-type-5 (including sfx-type-4a), sfx-stat, sfx-whip-1 and sfx-whip-2, sfx-stamp-1 to sfx-stamp-3,
    sfx-slap-1 to sfx-slap-4, sfx-burst and sfx-front, from assets/sfx/ (whoosh, whoosh-short, pop,
    typing and impact-bass-1), the inspiration's sound kit. Narration: voice-s01 to voice-s10, one clip per
    segment, from assets/narration/s01.mp3 to s10.mp3, made by scripts/narrate.sh with the local voice
    am_michael (README); the narration block is written by scripts/narration-segments.py, so regenerate
    it rather than editing it. To hear one slot, add an audio element with its id, set its start,
    duration and track (data-start, data-duration and data-track-index) and its volume from its SOUND SLOT
    comment, and set its src to your own sound file. Missing narration needs a clip of each segment's
    length; missing music needs any quiet bed of the same length; missing hits can be any short whoosh,
    pop, typing or bass tone. The root loads GSAP 3.14.2 from cdn.jsdelivr.net, a script rather than a
    media file.
  WHEN TO USE: A short history film that explains an event through its own sound, with archive
    pictures, a locator map and a paper-collage middle. Pick a simpler root for a film with no timed
    narration or no sound design.
-->

<!-- "Dark archival with animation" (references/dark-archival-with-animation.md): a dark locator map,
