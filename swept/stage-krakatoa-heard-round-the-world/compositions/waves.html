<!doctype html>
<!--
  GUIDE: compositions/waves.html (composition id "waves")
  WHAT: A single 3.93 s shot of the blast cloud rolling out over the sea, in black and white with a
    slow zoom. A gold tag, WAVES OVER 30 METRES, wipes in 0.8 s into the scene, on the spoken word
    "thirty". index.html mounts it at 14 s, right after the explosion scene, for 3.93 s. The
    subtitle for this shot comes from subs.html.
  STRUCTURE: Back to front: #wv-shot (the zoom wrapper, origin 40% 60%, scaling from 1.02 to 1.09
    over 3.93 s) holding the video slot #wv-video (from 0 s); #wv-vig (the vignette); and
    the tag #wv-tag. Timeline, in seconds from the scene start: 0 the zoom starts, 0.8 the tag wipes
    in from scaleX 0 to 1 over 0.2 s.
  CUSTOMIZE: The tag text is #wv-tag ("WAVES OVER 30 METRES"); it must match the narration. Its
    colours are the box #e9b04a and the text #15110a, placed at left 118px and top 776px, in
    Roboto Condensed 500 at 50px. The wipe time 0.8 moves the tag; the zoom end 1.09 and origin are
    in the #wv-shot tween. The video grey, contrast and brightness are the filter on #wv-shot [data-media-kind="video"].
    data-duration (3.93) and the zoom length must match the scene's data-duration in index.html.
  MEDIA: No media file is bundled. Slot 1, a video: #wv-video, a shot of the blast cloud rolling out over
    the sea (it was footage/b1.mp4, cut by make-footage.sh from the film downloaded for the inspiration, per the
    README). It is the only clip here and plays for the full 3.93 s. A faint hatch stand-in labeled
    "VIDEO: footage/b1.mp4" shows there, under the same vignette. To plug in your own clip, replace that img
    with a video element with src set to your file, muted, playsinline, id="wv-video", data-start="0", data-duration="3.93", data-track-index="1" and data-media-kind="video", keeping the id, the data-* attributes and
    data-media-kind="video" so the grade still matches. A black-and-white or dark grey clip of rough sea
    works, and the CSS filter greys colour footage. Without a clip, a dark grey gradient that moves slowly
    will do; keep the 3.93 s duration. Slot 2, font: Roboto Condensed at weight 500 (the tag) loads with
    src: local("Roboto Condensed"), used if installed, else the sans-serif fallback shows. To plug in the
    file, add url("assets/fonts/roboto-condensed-latin.woff2") as a source in the @font-face rule. Sound
    slots: none; no audio in this file. CSS image slots: none; the vignette is a radial gradient.
  WHEN TO USE: A single shot that needs one number-tag laid over it on a spoken figure. Pick
    another scene when the moment needs two or more cuts.
-->

<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Font: Roboto Condensed at weight 500, loaded from the system with local(); no font file is bundled. */
        @font-face { font-family: "Roboto Condensed"; font-style: normal; font-weight: 500; font-display: block; src: local("Roboto Condensed"); }
        /* The black ground. */
        #root { position: absolute; inset: 0; overflow: hidden; background: #000000; }
        #wv-shot { position: absolute; inset: 0; transform-origin: 40% 60%; }
        #wv-shot [data-media-kind="video"] { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.12) brightness(0.88); }
        /* The vignette: a dark radial edge over the shot. */
        #wv-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.6) 100%); }
        #wv-tag { position: absolute; left: 118px; top: 776px; padding: 16px 22px; background: #e9b04a; font-family: "Roboto Condensed", sans-serif; font-weight: 500; font-size: 50px; line-height: 1.2; letter-spacing: 0.02em; color: #15110a; white-space: nowrap; transform-origin: 0 50%; }
      </style>
      <div id="root" data-composition-id="waves" data-width="1920" data-height="1080">
        <!-- The zoom wrapper holds the video slot; the vignette and the tag sit above it. -->
        <div id="wv-shot" data-layout-allow-overflow>
          <img id="wv-video" data-start="0" data-duration="3.93" data-track-index="1" src="data:image/svg+xml,%3C!--b1.mp4--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'459' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EVIDEO: footage/b1.mp4%3C/text%3E%3C/svg%3E" data-media="footage/b1.mp4" data-media-kind="video" alt="" />
        </div>
        <div id="wv-vig"></div>
        <div id="wv-tag">WAVES OVER 30 METRES</div>
      </div>
      <script>
        /* The scene timeline, paused; it is registered under the composition id at the end. */
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#wv-shot", { scale: 1.02 }, { scale: 1.09, duration: 3.93, ease: "none" }, 0);
        // The height lands on "thirty metres" (14.84 s).
        tl.fromTo("#wv-tag", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 0.8);
        window.__timelines["waves"] = tl;
      </script>
    </template>
  </body>
</html>
