  GUIDE: compositions/rings.html (composition id "rings")
  WHAT: The longest collage scene, 13.17 s, mounted at 39.81 s. On a paper map of the Indian Ocean the
    camera pushes in while a burst goes off on Krakatoa and a yellow ring grows outward from it
    without stopping. Two thick yellow arrows and a black tag, THE SOUND, ride the ring's front toward
    Batavia, Perth and Rodrigues. Each place gets a paper name strip and a dashed ring drawn around it,
    and each distance (160 KM, 3,110 KM, 4,800 KM) a yellow card. A police chief's note types in on the
    lower left, and ROAR OF HEAVY GUNS is stamped at its end. index.html mounts it after the villages
    scene and before barographs; the far-off guns sound is in index.html.
  STRUCTURE: Inside #rg-cam (the camera, scaling 1 to 1.16 over 13.17 s, origin 950,470), back to front:
    the ruled grid #rg-grid, the ocean map #rg-map (assets/generated/ocean.svg at -960,-540, 3840x2160),
    the SVG #rg-plan with the labels INDIAN OCEAN and AUSTRALIA, a north arrow, the three dashed rings
    #rg-m1-c, #rg-m2-c and #rg-m3-c revealed through the masks rg-m1, rg-m2 and rg-m3, and the front
    #rg-front (two circles, #rg-front-ink and #rg-front-y); the arrows #rg-arrow-p (to Perth) and
    #rg-arrow-r (to Rodrigues), each a shaft and a head; the burst #rg-burst; the label #rg-k; the
    place strips #rg-name-b, #rg-name-p and #rg-name-r with the cards #rg-card-b, #rg-card-p and
    #rg-card-r; the token #rg-token; the note #rg-note; and the stamp #rg-stamp. The overlay SVG #rg-over
    holds the dots and the Batavia leader. The caption tag #rg-tag sits outside the camera. Timeline,
    in seconds from the scene start: 0.04 the burst pops; 0.14 the KRAKATOA label blurs in; 0.15 the
    front shows, and its radius (in frame pixels) reaches 26 by 1.55 s, 547.7 by 4.8 s, 821.3 by 7.04 s
    and 1500 by 9.34 s; the front fades from 8.3 s. The arrows and the token ride from 2.17 s to about
    6.9 s. The place dots, strips and rings come in at 1.5 (Batavia), 4.72 (Perth) and 6.95 (Rodrigues)
    s, each card at 2.5, 5.58 and 7.67 s. The note types from 9.34 s at 28 characters a second, and the
    stamp slams at 10.5 s.
  CUSTOMIZE: The places are the pins in ocean.json (Krakatoa 1370.3,293.2; Batavia 1396.3,294.5; Perth

    moving its dot, its ring path, its arrow's rotation (#rg-arrow-p 69.31deg, #rg-arrow-r 161.56deg), its
    shaft length and its token positions together. The ring radii are 26, 547.7 and 821.3 pixels. Card
    texts are 160 KM, 3,110 KM and 4,800 KM; the stamp is ROAR OF HEAVY GUNS and the note is "the chief of
    police reports:". Colours: sea paper #d9cdb0, strips #f7f3e8, yellow #f2c230, ink #1c1a16. Type: Anton
    for the places, cards, the token, the label and the stamp; Special Elite for the labels and the note.
    The note types at 28 characters a second (the third argument of typeOn).

    on paper loaded by #rg-map (src="assets/generated/ocean.svg", drawn by map-svg.py; the CSS notes it draws
    half a frame past each edge), sized 3840 by 2160 px at -960,-540. It renders as it is and is not a media
    slot, so it needs nothing plugged in. To use your own map, set the img's src to your SVG, keeping the size
    and the pins in step with the CUSTOMIZE section. Font slots 1 and 2, fonts: no font file is bundled.
    Anton (the places, the cards, the token, the label and the stamp) and Special Elite (the map labels

    none; the far-off guns sound sits in index.html. CSS image slots: none; the torn edges come from an
