<!doctype html>
<!--
  GUIDE: compositions/subs.html (composition id "subs")
  WHAT: The subtitle layer for the parts of the film that show archive photographs and film. It holds
    eleven cues, one clause each, in small white type near the bottom of the frame. They run from
    5.57 s to 65.1 s of the film: over the eruption shots, the waves shot, the barographs shot and
    the ending. None play over the map, the cards or the collage scenes, which carry their own words.
    index.html mounts it in track 3 at 0 s for the whole 67.5 s film.
  STRUCTURE: #root fills the frame and holds eleven divs, #sub-1 to #sub-11, each with the classes
    subtitle-line and clip, a data-start (a time in the whole film, not in the scene), a data-duration
    and data-track-index 1. All sit at top 938px, full width, centred. There are no tweens: the
    timeline is empty, and each cue shows for the start and length its clip gives it.
  CUSTOMIZE: To change a cue, change its text and its data-start and data-duration. To add one, copy a
    div, give it a new id, and keep the classes and the track index. Cue times are the first and last
    word of each clause in the narration transcript; scripts/subtitle-cues.py lists them, and the
    film's cues are split where a cut falls inside a sentence. The style is Roboto Condensed 400 at
    38px, white, with a soft shadow and no box. Keep each cue to one clause so it reads in its time.
  MEDIA: No media file is bundled, and the file has no photo, video, sound or CSS image slot: the cues are
    text, and the shadow is a CSS text-shadow. The only slot is a font. Slot 1, font: Roboto Condensed
    (weight 400) for every cue. The @font-face rule loads it with src: local("Roboto Condensed"), so it is
    used if installed; otherwise the sans-serif fallback shows and the cues still read. To plug in the
    file, add url("assets/fonts/roboto-condensed-latin.woff2") as a source in that @font-face rule.
  WHEN TO USE: Subtitles for a narrated film, only over the shots whose picture has no words of its
    own. Use a full subtitle track instead when the picture is a person speaking.
-->

<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Font: Roboto Condensed at weight 400, loaded from the system with local(); no font file is bundled. */
        @font-face { font-family: "Roboto Condensed"; font-style: normal; font-weight: 400; font-display: block; src: local("Roboto Condensed"); }
        /* Subtitles in this style run only over archive film and photos: one clause per cue, small,
           white, centred low, with a soft shadow instead of a box. The map, the cards, and the collage
           scenes carry their own words. Cue times are the clause's first and last word in the
           transcript (scripts/subtitle-cues.py lists them; the film's cues are kept, split on the cuts). */
        /* The full-frame container for the cue lines. */
        #root { position: absolute; inset: 0; overflow: hidden; }
        .subtitle-line { position: absolute; left: 0; right: 0; top: 938px; text-align: center; font-family: "Roboto Condensed", sans-serif; font-weight: 400; font-size: 38px; line-height: 1.3; color: #ffffff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 3px rgba(0, 0, 0, 0.95); }
      </style>
      <div id="root" data-composition-id="subs" data-width="1920" data-height="1080">
        <!-- Cues over the eruption shots: from the photograph to the blast along the water. -->
        <div class="subtitle-line clip" id="sub-1" data-start="5.57" data-duration="2.23" data-track-index="1">The volcano has rumbled since May.</div>
        <div class="subtitle-line clip" id="sub-2" data-start="7.82" data-duration="1.88" data-track-index="1">At two minutes past ten,</div>
        <div class="subtitle-line clip" id="sub-3" data-start="9.72" data-duration="1.61" data-track-index="1">the third and largest explosion</div>
        <div class="subtitle-line clip" id="sub-4" data-start="11.35" data-duration="1.85" data-track-index="1">tears the island apart.</div>
        <!-- The cue over the waves shot, which starts at 14 s. -->
        <div class="subtitle-line clip" id="sub-5" data-start="14.12" data-duration="2.94" data-track-index="1">Waves more than thirty metres high cross the strait.</div>
        <!-- Cues over the barographs shot, after the collage block. -->
        <div class="subtitle-line clip" id="sub-6" data-start="53.02" data-duration="1.38" data-track-index="1">Barographs around the world</div>
        <div class="subtitle-line clip" id="sub-7" data-start="54.42" data-duration="2.96" data-track-index="1">record the pressure wave seven times.</div>
        <!-- Cues over the ending, which begins at 58.06 s. -->
        <div class="subtitle-line clip" id="sub-8" data-start="58.14" data-duration="1.68" data-track-index="1">In nineteen twenty-seven,</div>
        <div class="subtitle-line clip" id="sub-9" data-start="59.84" data-duration="2.24" data-track-index="1">a new island rises from the sea.</div>
        <div class="subtitle-line clip" id="sub-10" data-start="62.12" data-duration="1.28" data-track-index="1">Anak Krakatau:</div>
        <div class="subtitle-line clip" id="sub-11" data-start="63.42" data-duration="1.68" data-track-index="1">the child of Krakatoa.</div>
      </div>
      <script>
        /* No tweens: the cue clips carry their own timing, so the timeline stays empty. */
        window.__timelines["subs"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
