<!doctype html>
<!--
  GUIDE: compositions/paper.html (composition id "paper")
  WHAT: One sheet of paper and a warm vignette, laid over the collage block only: from 28.46 s to
    52.98 s, 24.52 s in all, which is the span of verbeek, villages and rings. It has no movement
    and no words. The host multiplies the layer onto the scenes under it, so the cards, the prints
    and the ink all take on the paper's colour and tooth. index.html mounts it in track 2 at 28.46 s.
  STRUCTURE: #root is a full-frame layer with no pointer events. Inside it, #pp-sheet is the paper
    image (assets/generated/paper.jpg, 2112x1188 at -96,-54, larger than the frame so its edges
    stay outside it) at opacity 0.58, and #pp-vig is a brown radial vignette at the same opacity.
    The timeline is empty: nothing moves, so the layer is static.
  CUSTOMIZE: Opacity is 0.58 on both #pp-sheet and #pp-vig. Keep it under 0.6, as the comment in
    the CSS explains, so the layout audit does not count the sheet as covering text. The strength of
    the paper is set in the texture itself (paper-texture.py, with its mottle and burn options), not here.
    The vignette colour is rgba(70, 54, 20) and its size is the radial gradient. The multiply blend
    is set on the host's #paper-slot in index.html, not in this file, so used alone this file draws
    the sheet over the scene without the blend.
  MEDIA: No media file is bundled. Slot 1, a photo: #pp-sheet, the paper texture (it was
    assets/generated/paper.jpg, made by paper-texture.py, named in the CSS comment). A faint hatch
    stand-in labeled "PHOTO: assets/generated/paper.jpg" fills the bled sheet at opacity 0.58 until a
    file is set. To plug in your own texture, set the img's src to the file, for example
    src="assets/generated/paper.jpg"; keep it at least 2112 by 1188 px so the bleed covers the frame.
    Sound, font and CSS image slots: none. The vignette is a radial gradient. A plain cream fill close
    to the collage's #e6dcc3 gives the same colour without the grain, if you want no texture at all.
  WHEN TO USE: A collage section where every piece should look printed on one sheet of paper. Skip
    it for a full-colour scene, since the multiply will dull it.
-->

<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* One sheet of paper over the collage scenes. The host multiplies this whole layer onto them
           (mix-blend-mode on the mount: a blend set inside a layer only mixes within that layer).
           Opacity stays under 0.6 so the layout audit does not count the sheet as covering the text;
           the strength is baked into the texture instead (paper-texture.py --mottle/--burn). */
        /* Nothing in this layer takes pointer events, so the page below stays usable. */
        #root, #root * { pointer-events: none; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #pp-sheet { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; opacity: 0.58; }
        /* The vignette: a brown radial darkening toward the corners of the sheet. */
        #pp-vig { position: absolute; inset: 0; opacity: 0.58; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(70, 54, 20, 0) 50%, rgba(70, 54, 20, 0.55) 100%); }
      </style>
      <div id="root" data-composition-id="paper" data-width="1920" data-height="1080">
        <!-- The sheet (a photo slot) and the vignette over it. -->
        <img id="pp-sheet" src="data:image/svg+xml,%3C!--paper.jpg--%3E%3Csvg xmlns%3D'http://www.w3.org/2000/svg' width%3D'1600' height%3D'900' viewBox%3D'0 0 1600 900'%3E%3Cdefs%3E%3Cpattern id%3D'h' width%3D'56' height%3D'56' patternUnits%3D'userSpaceOnUse' patternTransform%3D'rotate(45)'%3E%3Crect width%3D'2' height%3D'56' fill%3D'%23808080' fill-opacity%3D'0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width%3D'1600' height%3D'900' fill%3D'url(%23h)'/%3E%3Crect x%3D'96' y%3D'720' width%3D'687' height%3D'64' rx%3D'6' fill%3D'%2315181b' fill-opacity%3D'0.78'/%3E%3Ctext x%3D'126' y%3D'763' font-family%3D'monospace' font-size%3D'32' fill%3D'%23e6edf3'%3EPHOTO: assets/generated/paper.jpg%3C/text%3E%3C/svg%3E" data-media="assets/generated/paper.jpg" alt="" data-layout-allow-overflow />
        <div id="pp-vig"></div>
      </div>
      <script>
        /* No tweens: the timeline is empty, so the paper stays still for the whole block. */
        window.__timelines["paper"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
