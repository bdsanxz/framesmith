<!--
  GUIDE: compositions/chapters.html (composition id "chapters"), written by scripts/deep-tracery-build.py from cut.json
  WHAT: the six chapter cards of the film. Each card holds for 5 s on a dark drafting sheet: a paper note with
    CHAPTER NN and the chapter's question typed on, the film's title small at the top and the question small at the bottom.
    The host index.html mounts this file as #chapters-slot for the whole film (0 to 623.9 s). The cards start at
    46.1, 101.9, 185.3, 238.3, 339.4 and 501.8 s.
  STRUCTURE: mounted by index.html at z-index 8. Six .clip cards, #c0 to #c5, each a full-frame .chapter with a .grid,
    two .hud lines, a big number, three .cross marks, a paper .note (#cN-note) with its .tape, .pin, .holes, .kicker, the
    title letters (#cN-kM) and a .rule, plus an .under sheet (#cN-under) behind it. The timeline tl (paused) cues each card
    from its own start time: the grid flashes from brightness 6 to 1 (0.2 s), the note slides in from x -1900 (0.42 s), the
    under sheet drops in from y 420 (0.4 s), the title is typed letter by letter (one letter every 0.0556 s), the cursor
    blinks, and the note scales to 1.03 over 4.4 s.
  CUSTOMIZE: the questions are cut.json "chapters" ({"at": word, "title": ...}), numbered from 00, and each card is placed on
    the word named in "at". The card length is CHAPTER (5.0 s) in scripts/deep-tracery-build.py, which must match the
    data-duration of each card here. The cue offsets (note +0.17 s, under sheet +0.5 s, typing +0.75 s, cursor about
    +3.3 s, scale +0.6 s) and the letter count of each title move with the card's start time and text, so change them together.
    Change cut.json and build again, never this file: it is rewritten on every build. The colours are COLORS and the
    timings CHAPTER, END, LEAD sit at the head of scripts/deep-tracery-build.py.
  MEDIA: no media file is bundled, and this file has no media slot of its own (no photo, video, sound or CSS image).
    The six @font-face rules use src: local(...) for Archivo (500, 700, 800), Instrument Serif (italic), Bricolage
    Grotesque (800) and JetBrains Mono (500). An installed font is used; otherwise the title falls back to serif and
    the HUD to monospace. To bundle a face, add src: url("fonts/NAME.woff2") format("woff2") to its @font-face.
    The dark sheet and grid are drawn in CSS (#101112 and #111314), so they need no file.
    The card sounds (impact, typing, riser) are not in this file: index.html plays them as the audio slots sfx-6 to sfx-33,
    at the card times (see index.html's MEDIA for how to plug in files).
  WHEN TO USE: five or six questions that split a long explainer into parts; a short film takes none.
-->
