<!doctype html>
<!--
  GUIDE: compositions/seams.html (composition id "seams"), written by scripts/deep-tracery-build.py from cut.json
  WHAT: the 15 seams between the presenter and a full-frame scene: a streak of light that wipes across
    ("burn") or a white flash on the cut ("flash"), each a fraction of a second.
  STRUCTURE: mounted by index.html as #seams-slot over the whole film (0 to 623.9 s, z-index 9), above every scene.
    It has no clip per seam: the markup is three full-frame layers (#streak, #lick and #flash), and the timeline (tl,
    paused) cues each seam from two lists in the script. Burns, at the film times 16.37, 148.03, 265.33, 316.33,
    399.27 and 536.73 s: the streak drops in over 0.17 s, then sweeps down over 0.2 s, and #lick lights just before it.
    Flashes, at 46.07, 73.37, 101.87, 185.30, 238.27, 339.40, 440.70, 501.77 and 563.47 s: a white flash on #flash
    that rises and fades over about 0.27 s.
  CUSTOMIZE: a scene's "seam" (on the way in) and "seam_out" (back to the presenter) in cut.json: burn, flash, or cut.
    The build writes the time lists above; a changed seam means a new build (the file is rewritten), or edit the two
    lists in the script by hand and keep the times in step with the scene starts in index.html.
  MEDIA: no media file is bundled, and this file has no photo, video, sound, font or CSS image slot. The streak and
    the flash are CSS gradients and colours. The whoosh under each burn is not here: index.html has the audio slots
    sfx-0 to sfx-5 (assets/sfx/whoosh-short.mp3) at 16.2, 147.9, 265.2, 316.2, 399.1 and 536.6 s. To plug in a sound,
    see index.html's MEDIA. Flashes have no sound.
  WHEN TO USE: to mark the turn from the presenter to a page or a clip, a few times a chapter; a plain cut is the default.
-->
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Layout: the root fills the frame; the three layers below sit one above another in this order. */
        #root { position: absolute; inset: 0; overflow: hidden; }
        /* The streak of light: a white field with a burning edge above and below, taller than the frame. */
        #streak { position: absolute; left: -40px; width: 2000px; top: 0; height: 1500px;
          background: linear-gradient(180deg, rgba(255, 120, 20, 0) 0px, rgba(255, 150, 40, 0.75) 60px, #fff6e2 130px, #ffffff 210px, #ffffff 1290px, #fff6e2 1370px, rgba(255, 150, 40, 0.75) 1440px, rgba(255, 120, 20, 0) 1500px); }
        #lick { position: absolute; left: 0; width: 1920px; top: 0; height: 150px; opacity: 0; background: linear-gradient(180deg, rgba(255, 244, 214, 0.95) 0%, rgba(255, 160, 60, 0.6) 55%, rgba(255, 120, 20, 0) 100%); }
        #flash { position: absolute; inset: 0; background: #fffdf6; opacity: 0; }
      </style>
      <div id="root" data-composition-id="seams" data-width="1920" data-height="1080">
        <!-- Markup: three empty layers, all driven by the script: #streak (the burn), #lick (its glow at the top edge) and
             #flash (the white flash). No clip per seam. -->
        <div id="streak" data-layout-allow-overflow></div>
        <div id="lick" data-layout-allow-overflow></div>
        <div id="flash"></div>
      </div>
      <script>
        // Script: the timeline (tl) is paused and the host seeks it. The burn list and the flash list below are the cue times.
        const tl = gsap.timeline({ paused: true });
        // W: words that come in as they are spoken. Q: words that are typed on. [id, time] each. Both are defined here
        // for the build's shared helpers; this file calls neither.
        const W = (rows) => rows.forEach(([id, t]) => tl.fromTo("#" + id, { opacity: 0, filter: "blur(14px)", y: 10 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.28, ease: "power2.out" }, t));
        const Q = (rows) => rows.forEach(([id, t]) => tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, t));
        tl.set("#streak", { y: -1500 }, 0);
        tl.set("#lick", { opacity: 0 }, 0);
        [16.367, 148.033, 265.333, 316.333, 399.267, 536.733].forEach((t) => {
          tl.set("#lick", { opacity: 1 }, t - 0.4);
          tl.set("#lick", { opacity: 0 }, t - 0.333);
          tl.fromTo("#streak", { y: -1500 }, { y: -210, duration: 0.17, ease: "power1.in", immediateRender: false }, t - 0.2);
          tl.fromTo("#streak", { y: -210 }, { y: 1090, duration: 0.2, ease: "power1.out", immediateRender: false }, t + 0.034);
          tl.set("#streak", { y: -1500 }, t + 0.25);
        });
        tl.set("#flash", { opacity: 0 }, 0);
        [46.067, 73.367, 101.867, 185.3, 238.267, 339.4, 440.7, 501.767, 563.467].forEach((t) => tl.to("#flash", { keyframes: [{ opacity: 0.85, duration: 0.066, ease: "power1.in" }, { opacity: 0.9, duration: 0.034 }, { opacity: 0, duration: 0.17, ease: "power1.out" }] }, t - 0.07));
        window.__timelines["seams"] = tl;
      </script>
    </template>
  </body>
</html>
