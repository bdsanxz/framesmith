[workspace]
resolver = "2"
members = ["crates/timebase", "crates/motion", "crates/notation", "crates/project", "crates/cli", "crates/measure", "crates/parity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
timebase = { path = "crates/timebase" }
motion = { path = "crates/motion" }
notation = { path = "crates/notation" }
project = { path = "crates/project" }
measure = { path = "crates/measure" }

# frx7, the media stack, in a repository of its own: taken from its private remote at one revision.
# docs/dev/frx7.md says how, and how the pin is moved.
base = { git = "https://github.com/bdsanxz/frx7", rev = "23b07bc0c72771c9406461fedbe2ae89ffcf2816" }
format = { git = "https://github.com/bdsanxz/frx7", rev = "23b07bc0c72771c9406461fedbe2ae89ffcf2816" }
mp4 = { git = "https://github.com/bdsanxz/frx7", rev = "23b07bc0c72771c9406461fedbe2ae89ffcf2816" }
probe = { git = "https://github.com/bdsanxz/frx7", rev = "23b07bc0c72771c9406461fedbe2ae89ffcf2816" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
