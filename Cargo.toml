[workspace]
resolver = "2"
members = ["crates/timebase", "crates/motion", "crates/measure", "crates/parity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
timebase = { path = "crates/timebase" }
motion = { path = "crates/motion" }
measure = { path = "crates/measure" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
