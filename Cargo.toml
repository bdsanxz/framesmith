[workspace]
resolver = "2"
members = [
    "crates/timebase",
    "crates/motion",
    "crates/notation",
    "crates/project",
    "crates/layout",
    "crates/timeline",
    "crates/draw",
    "crates/draw-cpu",
    "crates/render",
    "crates/cli",
    "crates/measure",
    "crates/parity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
# The project file (docs/spec/project-file.md): the YAML reader, without the reader of other encodings.
saphyr = { version = "0.2", default-features = false }
# The run log (docs/spec/run-log.md): the fewest features the work needs.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2"
timebase = { path = "crates/timebase" }
motion = { path = "crates/motion" }
notation = { path = "crates/notation" }
project = { path = "crates/project" }
layout = { path = "crates/layout" }
draw = { path = "crates/draw" }
draw-cpu = { path = "crates/draw-cpu" }
render = { path = "crates/render" }
timeline = { path = "crates/timeline" }
measure = { path = "crates/measure" }

# frx7, the media stack, in a repository of its own: taken from its private remote at one revision.
# docs/dev/frx7.md says how, and how the pin is moved.
base = { git = "https://github.com/bdsanxz/frx7", rev = "495d0764b41a9ae6fbe7ad8b7e00cd031c6b571e" }
format = { git = "https://github.com/bdsanxz/frx7", rev = "495d0764b41a9ae6fbe7ad8b7e00cd031c6b571e" }
mp4 = { git = "https://github.com/bdsanxz/frx7", rev = "495d0764b41a9ae6fbe7ad8b7e00cd031c6b571e" }
probe = { git = "https://github.com/bdsanxz/frx7", rev = "495d0764b41a9ae6fbe7ad8b7e00cd031c6b571e" }
codec = { git = "https://github.com/bdsanxz/frx7", rev = "495d0764b41a9ae6fbe7ad8b7e00cd031c6b571e" }
backend-os = { git = "https://github.com/bdsanxz/frx7", rev = "495d0764b41a9ae6fbe7ad8b7e00cd031c6b571e" }
pixel = { git = "https://github.com/bdsanxz/frx7", rev = "495d0764b41a9ae6fbe7ad8b7e00cd031c6b571e" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
