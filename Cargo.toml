[workspace]
resolver = "2"
members = [
    "crates/timebase",
    "crates/motion",
    "crates/notation",
    "crates/project",
    "crates/layout",
    "crates/text",
    "crates/timeline",
    "crates/draw",
    "crates/draw-cpu",
    "crates/draw-gpu",
    "crates/mix",
    "crates/render",
    "crates/cli",
    "crates/measure",
    "crates/parity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
# The project file (docs/spec/project-file.md): the YAML reader, without the reader of other encodings.
saphyr = { version = "0.2", default-features = false }
# The run log (docs/spec/run-log.md): the fewest features the work needs.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2"
timebase = { path = "crates/timebase" }
motion = { path = "crates/motion" }
notation = { path = "crates/notation" }
project = { path = "crates/project" }
layout = { path = "crates/layout" }
text = { path = "crates/text" }
draw = { path = "crates/draw" }
draw-cpu = { path = "crates/draw-cpu" }
draw-gpu = { path = "crates/draw-gpu" }
mix = { path = "crates/mix" }
render = { path = "crates/render" }
timeline = { path = "crates/timeline" }
measure = { path = "crates/measure" }

# The shaping and line-breaking engine of the text crate (docs/spec/text.md, section 10). Default features are off so that
# its font collection reads no font of the machine: no system font interface is linked.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
# The processor draws glyph outlines with it (draw-cpu). Multithreading stays off, so the picture does not depend on the workers.
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "u8_pipeline", "text"] }

# frx7, the media stack, in a repository of its own: taken from its private remote at one revision.
# docs/dev/frx7.md says how, and how the pin is moved.
base = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }
format = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }
mp4 = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }
probe = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }
codec = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }
backend-os = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }
pixel = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }
# The graphics card, as frx7's system crate hands it to us: wgpu is reached through it, not named here.
gpu = { git = "https://github.com/bdsanxz/frx7", rev = "00114c411204178cfdf502e14f889b39062c87dc" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
